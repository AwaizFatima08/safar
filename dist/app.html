<title>Urdu Safar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#F1E6CC;
    --paper-dim:#E6D6A9;
    --card:#F8EFDA;
    --ink:#1E3A34;
    --ink-soft:#54685F;
    --ink-faint:#8A9089;
    --rule:#C9B679;
    --marigold:#C97A17;
    --marigold-ink:#3A2205;
    --maroon:#8F3232;
    --emerald:#2F7A54;
    --shadow: 0 1px 0 rgba(30,58,52,.06), 0 6px 16px -8px rgba(30,58,52,.25);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12211D;
      --paper-dim:#1A2E27;
      --card:#182B25;
      --ink:#EAD9AF;
      --ink-soft:#B7AB86;
      --ink-faint:#7C8579;
      --rule:#3B4E42;
      --marigold:#EBA13E;
      --marigold-ink:#241300;
      --maroon:#E08484;
      --emerald:#5FBE8F;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12211D;
    --paper-dim:#1A2E27;
    --card:#182B25;
    --ink:#EAD9AF;
    --ink-soft:#B7AB86;
    --ink-faint:#7C8579;
    --rule:#3B4E42;
    --marigold:#EBA13E;
    --marigold-ink:#241300;
    --maroon:#E08484;
    --emerald:#5FBE8F;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  .ur{
    font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',serif;
    direction:rtl;
    unicode-bidi:isolate;
    line-height:2.1;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',Georgia,serif;
    text-wrap:balance;
    margin:0;
  }
  ::selection{ background:var(--marigold); color:var(--marigold-ink); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--marigold); outline-offset:2px; border-radius:6px; }

  /* ============ SHELL ============ */
  #app{ max-width:760px; margin:0 auto; padding:20px 18px 64px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap;
    padding:10px 2px 18px; border-bottom:2px solid var(--rule); margin-bottom:22px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; flex-shrink:0; white-space:nowrap; }
  .brand .en{ font-size:26px; font-weight:600; letter-spacing:.2px; }
  .brand .ur-mark{ font-size:22px; color:var(--marigold); }
  .tagline{ font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; }

  /* ============ OVERALL PROGRESS ============ */
  .overall{
    display:flex; align-items:center; gap:16px;
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:26px; box-shadow:var(--shadow);
  }
  .overall-stat{ text-align:center; min-width:56px; }
  .overall-stat .num{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--marigold); display:block; }
  .overall-stat .lab{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.07em; }
  .overall-div{ width:1px; align-self:stretch; background:var(--rule); }
  .overall-msg{ flex:1; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  /* Phones: stats on one row, message underneath at full width */
  @media (max-width:480px){
    .overall{ flex-wrap:wrap; justify-content:center; gap:10px 22px; }
    .overall-div{ display:none; }
    .overall-msg{ flex-basis:100%; text-align:center; }
  }

  /* ============ PLAYER ROW / SIGN-UP / LEADERBOARD ============ */
  .player-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .player-name{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .link-btn{ background:none; border:none; padding:0; margin:0; font-size:11.5px; color:var(--marigold); text-decoration:underline; cursor:pointer; font-weight:600; }
  .lb-btn{ padding:8px 14px; font-size:12.5px; }
  .signup-card{ max-width:420px; margin:10vh auto 0; text-align:center; }
  .signup-card .rule-explain{ direction:ltr; text-align:center; margin-bottom:16px; }
  .nick-input{
    width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid var(--rule);
    background:var(--paper); color:var(--ink); font-size:16px; font-family:'Karla',sans-serif; margin-bottom:14px;
  }
  .medal-badge{ font-size:15px; font-weight:700; margin:6px 0 4px; }
  .lb-row{
    display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--rule);
    font-size:14px;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row.me{ background:color-mix(in srgb, var(--marigold) 12%, transparent); border-radius:8px; }
  .lb-rank{ width:22px; text-align:center; font-weight:700; color:var(--ink-faint); }
  .lb-name{ flex:1; font-weight:600; }
  .lb-medals{ font-size:12.5px; direction:ltr; white-space:nowrap; }
  .group-card{ margin-bottom:16px; }
  .group-caveat{ font-size:11.5px; color:var(--ink-faint); margin-top:12px; padding-top:10px; border-top:1px solid var(--rule); }

  /* ============ ACCOUNT + GROUP FLOWS ============ */
  .signup-card + .signup-card{ margin-top:16px; }
  .auth-card{ max-width:460px; margin:0 auto 16px; }
  .field-label{ display:block; font-size:13px; font-weight:700; color:var(--ink); margin:2px 0 6px; }
  .field-label .hint, .hint{ font-weight:400; color:var(--ink-faint); font-size:12px; }
  .auth-card .nick-input{ margin-bottom:12px; }
  .rule-explain.small{ font-size:12px; color:var(--ink-faint); }
  .auth-switch{ font-size:13px; color:var(--ink-soft); text-align:center; margin:12px 0 0; }
  .auth-switch .link-btn{ font-size:13px; }
  .form-msg{ font-size:13.5px; font-weight:600; margin:10px 0 0; min-height:1px; }
  .form-msg.good{ color:var(--emerald); }
  .form-msg.bad{ color:var(--maroon); }
  .account-chip-row{ display:flex; justify-content:flex-end; margin-bottom:12px; }
  .btn.chip{ font-size:12.5px; padding:7px 14px; }
  .group-list{ display:flex; flex-direction:column; gap:8px; margin:6px 0 12px; }
  .group-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    padding:12px 14px; border-radius:10px; border:1px solid var(--rule); background:var(--paper);
    color:var(--ink); font-family:'Karla',sans-serif; font-size:14.5px;
  }
  .group-row:hover{ border-color:var(--marigold); }
  .group-name{ flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .group-rank{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
  .chev{ color:var(--ink-faint); font-size:18px; }
  .owner-tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--emerald); border:1px solid var(--emerald); border-radius:6px; padding:1px 5px; margin-left:4px; }
  .danger-link{ color:var(--maroon); }
  .invite-card{ text-align:center; }
  .invite-code{ font-family:'Karla',monospace; font-size:34px; font-weight:700; letter-spacing:.22em; color:var(--marigold); margin:6px 0 4px; direction:ltr; }
  .invite-input{ text-transform:uppercase; letter-spacing:.2em; font-size:20px; text-align:center; direction:ltr; }
  .card.notice.good{ background:color-mix(in srgb, var(--emerald) 14%, var(--card)); color:var(--emerald); font-weight:700; text-align:center; }

  /* ============ EXAM-FORMAT EXTRAS ============ */
  .stem-line{ margin:10px 0 12px; padding:10px 12px; border-radius:10px; background:var(--paper); border:1px dashed var(--rule); }
  .stem-gap{ display:inline-block; min-width:64px; border-bottom:2px solid var(--marigold); color:var(--ink-faint); padding:0 4px; }
  .stem-gap.good{ color:var(--emerald); border-color:var(--emerald); }
  .stem-gap.bad{ color:var(--maroon); border-color:var(--maroon); }
  .task-points{ direction:rtl; text-align:right; margin:10px 0 0; padding-right:22px; font-size:17px; line-height:2; }
  .word-count{ float:right; font-weight:700; color:var(--ink-soft); direction:ltr; }

  /* ============ TOPIC GRID ============ */
  .section-label{
    font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);
    margin:0 0 10px 2px; font-weight:600;
  }
  .section-label .ur{ text-transform:none; letter-spacing:0; font-size:15px; margin-inline-start:6px; }
  .topic-grid{ display:grid; gap:14px; grid-template-columns:1fr; }
  @media(min-width:560px){ .topic-grid{ grid-template-columns:1fr 1fr; } }

  .topic-card{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:18px 18px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:right;
    position:relative; overflow:hidden; transition:transform .12s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .topic-card:hover{ transform:translateY(-2px); }
  .topic-card:active{ transform:translateY(0); }
  .topic-card .ur-title{ font-size:26px; font-weight:700; color:var(--ink); }
  .topic-card .en-title{ font-size:12.5px; color:var(--ink-soft); text-align:left; letter-spacing:.02em; }
  .topic-stars{ display:flex; gap:5px; justify-content:flex-start; direction:ltr; }
  .star{ font-size:15px; color:var(--rule); }
  .star.on{ color:var(--marigold); }
  .mastered-seal{
    position:absolute; top:10px; left:-30px; transform:rotate(-18deg);
    background:var(--emerald); color:var(--card); font-size:10px; font-weight:700;
    letter-spacing:.05em; padding:3px 34px; text-transform:uppercase; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  /* ============ TOPIC VIEW ============ */
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    background:none; border:1px solid var(--rule); color:var(--ink);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .back-btn:hover{ background:var(--paper-dim); }
  .topic-head{ margin-bottom:16px; }
  .topic-head .ur-title{ font-size:30px; font-weight:700; display:block; }
  .topic-head .en-title{ color:var(--ink-soft); font-size:13.5px; }

  .tabbar{ display:flex; gap:6px; border-bottom:2px solid var(--rule); margin-bottom:20px; }
  .tab{
    flex:1; background:none; border:none; padding:10px 6px 12px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:3px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--marigold); }
  .tab .tab-stars{ font-size:9px; letter-spacing:1px; direction:ltr; color:var(--marigold); }

  /* home-tabbar scrolls horizontally so more top-level areas can be added
     later without squeezing every tab down to fit one screen width. */
  .home-tabbar{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .home-tabbar::-webkit-scrollbar{ display:none; }
  .home-tabbar .tab{ flex:0 0 auto; padding-left:16px; padding-right:16px; white-space:nowrap; }

  /* ============ VOCABULARY PRACTICE ============ */
  .vp-card-title{ font-size:16px; font-weight:700; color:var(--ink); text-align:left; }
  .vp-card-desc{ font-size:12px; color:var(--ink-soft); text-align:left; letter-spacing:.01em; }
  .vp-view-title{ font-size:22px; font-weight:700; color:var(--ink); }

  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow); margin-bottom:16px;
  }

  .progress-dots{ display:flex; gap:6px; margin-bottom:16px; direction:ltr; }
  .dot{ height:5px; flex:1; background:var(--rule); border-radius:3px; }
  .dot.done{ background:var(--marigold); }
  .dot.now{ background:var(--ink-soft); }

  /* ============ FLASHCARD ============ */
  .flash-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .flashcard{
    width:100%; max-width:420px; min-height:200px; border-radius:16px;
    background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; cursor:pointer; text-align:center; gap:10px;
  }
  .flashcard .front-ur{ font-size:40px; font-weight:700; }
  .flashcard .hint{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .flashcard .back-en{ font-size:20px; font-weight:600; color:var(--marigold); }
  .flashcard .example{ font-size:20px; margin-top:6px; }
  .flashcard .example-en{ font-size:12.5px; color:var(--ink-soft); direction:ltr; }
  .flashcard .syn-line{ font-size:15px; color:var(--marigold); margin-top:8px; padding-top:8px; border-top:1px dashed var(--rule); }
  .flashcard .syn-line .lab{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:2px; }

  /* ============ BUTTON ROW ============ */
  .btn-row{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  .btn{
    border:none; border-radius:10px; padding:11px 20px; font-size:14px; font-weight:600;
    cursor:pointer; background:var(--paper-dim); color:var(--ink); border:1px solid var(--rule);
  }
  .btn:hover{ background:var(--rule); }
  .btn.primary{ background:var(--marigold); color:var(--marigold-ink); border-color:var(--marigold); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ background:#fff; color:#B3261E; border-color:#B3261E; }
  .btn.danger:hover{ background:#FBEAE9; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ============ MCQ ============ */
  .prompt-ur{ font-size:24px; font-weight:700; margin-bottom:16px; text-align:center; }
  .prompt-en{ font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:16px; direction:ltr;}
  .options{ display:grid; gap:10px; }
  .opt{
    display:block; width:100%; text-align:right; background:var(--paper-dim); border:1.5px solid var(--rule);
    border-radius:10px; padding:13px 16px; font-size:17px; cursor:pointer; color:var(--ink);
  }
  .opt.en{ text-align:left; direction:ltr; font-size:15px; font-family:'Karla',sans-serif; }
  .opt:hover{ border-color:var(--marigold); }
  .opt.correct{ background:color-mix(in srgb, var(--emerald) 22%, var(--card)); border-color:var(--emerald); }
  .opt.wrong{ background:color-mix(in srgb, var(--maroon) 22%, var(--card)); border-color:var(--maroon); }
  .opt:disabled{ cursor:default; }

  .feedback{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; font-weight:600; display:flex; gap:8px; align-items:center; }
  .feedback.good{ background:color-mix(in srgb, var(--emerald) 18%, transparent); color:var(--emerald); }
  .feedback.bad{ background:color-mix(in srgb, var(--maroon) 18%, transparent); color:var(--maroon); }

  /* ============ READING PASSAGE ============ */
  .passage{ font-size:23px; margin-bottom:6px; }
  .passage-cap{ text-align:right; font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
  .skill-meta{ font-size:10.5px; color:var(--ink-faint); margin-top:6px; }
  .sample-block{ margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
  .sample-block:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .sample-cap{ font-size:11.5px; color:var(--ink-faint); font-weight:700; margin-bottom:6px; direction:ltr; text-align:left; }
  .sample-text{ font-size:18px; line-height:1.9; white-space:pre-line; }

  /* ============ WORD BANK (sentence building) ============ */
  .answer-strip{
    min-height:56px; border:1.5px dashed var(--rule); border-radius:10px; background:var(--paper-dim);
    display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; padding:10px 12px;
    direction:rtl; margin-bottom:16px;
  }
  .answer-strip .placeholder{ color:var(--ink-faint); font-size:13px; direction:ltr; }
  .tile{
    background:var(--card); border:1.5px solid var(--rule); border-radius:8px; padding:9px 14px;
    font-size:19px; cursor:pointer;
  }
  .tile.used{ opacity:.35; cursor:default; }
  .tile.placed{ background:var(--marigold); color:var(--marigold-ink); border-color:var(--marigold); }
  .bank{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; direction:rtl; margin-bottom:6px; }
  .translation-hint{ font-size:12px; color:var(--ink-soft); text-align:center; direction:ltr; margin-bottom:10px; }

  /* ============ GRAMMAR ============ */
  .rule-title{ font-size:20px; font-weight:700; margin-bottom:10px; }
  .rule-explain{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; direction:ltr; }
  table.ex{ width:100%; border-collapse:collapse; margin-bottom:6px; }
  table.ex th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); text-align:right; padding:6px 8px; border-bottom:2px solid var(--rule); }
  table.ex td{ padding:9px 8px; border-bottom:1px solid var(--rule); font-size:18px; text-align:right; }
  table.ex td.gloss{ font-size:12px; color:var(--ink-soft); direction:ltr; text-align:left; font-family:'Karla',sans-serif; }

  /* ============ SUMMARY ============ */
  .summary{ text-align:center; padding:30px 10px; }
  .summary .big-stars{ font-size:38px; letter-spacing:8px; margin:10px 0 6px; direction:ltr; }
  .summary h2{ font-size:24px; margin-bottom:6px; }
  .summary p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }

  .qmeta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; direction:ltr; }

  /* ============ LEVEL SELECTOR ============ */
  .level-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .level-label{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .level-bar{ display:flex; gap:5px; background:var(--paper-dim); border:1px solid var(--rule); border-radius:10px; padding:3px; }
  .level-btn{
    border:none; background:none; padding:6px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer;
  }
  .level-btn.active{ background:var(--marigold); color:var(--marigold-ink); }

  /* ============ FACTOID ============ */
  .factoid{
    display:flex; gap:10px; align-items:flex-start; background:var(--paper-dim); border:1px dashed var(--rule);
    border-radius:12px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.55;
  }
  .factoid .mark{ font-family:'Fraunces',serif; font-weight:700; color:var(--marigold); font-size:16px; flex-shrink:0; }

  /* ============ CREATIVE CORNER ============ */
  .creative-ta{
    width:100%; font-size:20px; padding:14px; border-radius:10px; border:1.5px solid var(--rule);
    background:var(--paper-dim); color:var(--ink); resize:vertical; min-height:110px; font-family:'Noto Nastaliq Urdu',serif;
  }
  .checklist{ font-size:12.5px; color:var(--ink-soft); margin:14px 0 4px; padding-inline-start:20px; line-height:1.7; }
  .creative-badge{
    display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--emerald); border:1px solid var(--emerald); border-radius:20px; padding:3px 10px; margin-bottom:12px;
  }

  footer.note{ text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:36px; line-height:1.6; }

</style>

ssary'."}]},{"id":"letters","ur":"خط کی اقسام اور خط لکھنے کا طریقہ","en":"Types of letters & how to write a letter","points":["خط دو طرح کے ہوتے ہیں: غیر رسمی (ذاتی) خط اور رسمی خط۔","غیر رسمی خط میں 'پیارے/پیاری' سے آغاز کریں اور دوستانہ انداز رکھیں۔","رسمی خط میں 'محترم' + عہدہ لکھیں اور واضح مقصد بیان کریں۔","دونوں اقسام میں تاریخ، سلام، متن اور اختتامیہ شامل کریں۔"],"samples":[{"caption":"Informal letter to a friend about exam results","ur":"پیارے فہد،\n\nالسلام علیکم! تمہیں یہ جان کر خوشی ہو گی کہ میں نے امتحان میں اچھے نمبر حاصل کیے ہیں۔ میں نے بہت محنت کی تھی۔ تم نے کیسا کیا؟ جلد جواب دینا۔\n\nتمہارا دوست،\nحمزہ"},{"caption":"Formal letter to a newspaper editor about cleanliness","ur":"محترم مدیر صاحب،\n\nجناب والا،\n\nمیں آپ کی توجہ اپنے محلے کی صفائی کی طرف مبذول کرانا چاہتا ہوں۔ کچرا کئی دنوں سے نہیں اٹھایا گیا، جس سے بیماریاں پھیلنے کا خطرہ ہے۔ براہ کرم متعلقہ ادارے کو مطلع کریں تاکہ فوری کارروائی ہو سکے۔\n\nشکریہ۔\nایک پریشان شہری"},{"caption":"Informal letter to father while at a camp","ur":"پیارے ابو،\n\nالسلام علیکم! میں یہاں کیمپ میں ٹھیک ہوں اور نئے دوست بنا رہا ہوں۔ ہم نے پہاڑوں پر چڑھائی بھی کی۔ امی کا خیال رکھیں۔ گھر آ کر سب کچھ تفصیل سے بتاؤں گا۔\n\nآپ کا بیٹا،\nعثمان"}],"practice":[{"q":"An informal letter usually begins with:","opts":["المحترم پرنسپل صاحب","پیارے/پیاری + name","To whom it may concern","A hashtag"],"a":1},{"q":"A formal letter to a newspaper editor should be about:","opts":["Only personal gossip","A clear issue or matter of public concern","Nothing in particular","A private joke"],"a":1},{"q":"Which of these is common to BOTH formal and informal letters?","opts":["Date and a closing","Hashtags","Emojis only","No greeting at all"],"a":1}],"prompts":[{"ur":"بیرون ملک مقیم اپنے کزن کو ایک غیر رسمی خط لکھیں۔","en":"Write an informal letter to your cousin who lives abroad."},{"ur":"شہر کی صفائی کے مسئلے پر اخبار کے مدیر کو ایک رسمی خط لکھیں۔","en":"Write a formal letter to a newspaper editor about a cleanliness issue in your city." const IDIOMS = [{"id":"aankhon-mein-dhool-jhonkna","ur":"آنکھوں میں دھول جھونکنا","meaning_ur":"کسی کو دھوکہ دینا","meaning_en":"to deceive someone","example_ur":"اس نے جھوٹے وعدے کر کے سب کی آنکھوں میں دھول جھونک دی۔","example_en":"He deceived everyone with false promises."},{"id":"aik-teer-se-do-shikar","ur":"ایک تیر سے دو شکار کرنا","meaning_ur":"ایک کام سے دو فائدے حاصل کرنا","meaning_en":"to kill two birds with one stone","example_ur":"سفر کے دوران کام بھی مکمل کر کے اس نے ایک تیر سے دو شکار کر لیے۔","example_en":"By finishing his work while travelling, he killed two birds with one stone."},{"id":"aate-mein-namak-ke-barabar","ur":"آٹے میں نمک کے برابر","meaning_ur":"بہت کم مقدار میں، نہ ہونے کے برابر","meaning_en":"a very small, negligible amount","example_ur":"ایماندار لوگ اب آٹے میں نمک کے برابر رہ گئے ہیں۔","example_en":"Honest people have become a rare handful now."},{"id":"apna-ullu-seedha-karna","ur":"اپنا الو سیدھا کرنا","meaning_ur":"صرف اپنا مطلب یا فائدہ نکالنا","meaning_en":"to serve only one's own interest","example_ur":"بعض لوگ دوستی میں بھی اپنا الو سیدھا کرنے کی کوشش کرتے ہیں۔","example_en":"Some people try to serve their own interest even in friendship."},{"id":"aasman-sar-par-uthana","ur":"آسمان سر پر اٹھانا","meaning_ur":"بہت شور و غل مچانا","meaning_en":"to make a huge fuss/noise","example_ur":"بچوں نے کھیل میں ہار کر آسمان سر پر اٹھا لیا۔","example_en":"The children made a huge fuss after losing the game."},{"id":"hath-paon-phool-jana","ur":"ہاتھ پاؤں پھول جانا","meaning_ur":"خوف سے گھبرا جانا","meaning_en":"to be terrified, paralyzed with fear","example_ur":"اچانک شور سن کر اس کے ہاتھ پاؤں پھول گئے۔","example_en":"His hands and feet went numb with fear at the sudden noise."},{"id":"dil-par-pathar-rakhna","ur":"دل پر پتھر رکھنا","meaning_ur":"صبر سے کام لینا، دکھ چھپا لینا","meaning_en":"to steel one's heart, to endure patiently","example_ur":"ماں نے دل پر پتھر رکھ کر بیٹے کو دیارِ غیر جانے کی اجازت دے دی۔","example_en":"The mother steeled her heart and allowed her son to go abroad."},{"id":"kaan-par-joon-tak-na-rengna","ur":"کان پر جوں تک نہ رینگنا","meaning_ur":"بالکل بے پروائی برتنا، اثر نہ ہونا","meaning_en":"to remain completely unaffected/indifferent","example_ur":"اتنی نصیحت کے باوجود اس کے کان پر جوں تک نہ رینگی۔","example_en":"Despite so much advice, he remained completely unaffected."},{"id":"munh-mein-pani-aana","ur":"منہ میں پانی آنا","meaning_ur":"کسی چیز کو دیکھ کر کھانے کی خواہش پیدا ہونا","meaning_en":"to have one's mouth water (craving something)","example_ur":"میٹھائیوں کی دکان دیکھ کر بچوں کے منہ میں پانی آ گیا۔","example_en":"Seeing the sweet shop made the children's mouths water."},{"id":"naak-mein-dam-karna","ur":"ناک میں دم کرنا","meaning_ur":"بہت تنگ کرنا، پریشان کر دینا","meaning_en":"to trouble/harass someone greatly","example_ur":"شور کرنے والے پڑوسیوں نے سب کی ناک میں دم کر رکھا ہے۔","example_en":"The noisy neighbours have troubled everyone greatly."},{"id":"aag-mein-ghee-dalna","ur":"آگ میں گھی ڈالنا","meaning_ur":"پہلے سے موجود جھگڑے کو مزید بھڑکانا","meaning_en":"to add fuel to the fire","example_ur":"جھگڑے کے وقت اس کی بات نے آگ میں گھی کا کام کیا۔","example_en":"His remark added fuel to the fire during the quarrel."},{"id":"hath-milna","ur":"ہاتھ ملنا","meaning_ur":"پچھتانا، افسوس کرنا","meaning_en":"to regret bitterly","example_ur":"موقع ہاتھ سے جانے پر وہ صرف ہاتھ ملتا رہ گیا۔","example_en":"He was left only regretting after losing the opportunity."},{"id":"dinaton-tale-ungli-dabana","ur":"دانتوں تلے انگلی دبانا","meaning_ur":"حیرت زدہ ہو جانا","meaning_en":"to be utterly astonished","example_ur":"اس کی ذہانت دیکھ کر سب نے دانتوں تلے انگلی دبا لی۔","example_en":"Everyone was astonished to see his intelligence."},{"id":"aankh-ka-tara","ur":"آنکھ کا تارا","meaning_ur":"سب سے زیادہ پیارا، محبوب","meaning_en":"the apple of one's eye, most beloved","example_ur":"چھوٹی بیٹی اپنے والدین کی آنکھ کا تارا ہے۔","example_en":"The youngest daughter is the apple of her parents' eye."},{"id":"kamar-tor-dena","ur":"کمر توڑ دینا","meaning_ur":"مکمل طور پر کمزور یا بے بس کر دینا","meaning_en":"to break someone completely (spirit or finances)","example_ur":"مہنگائی نے غریب آدمی کی کمر توڑ دی ہے۔","example_en":"Inflation has completely broken the poor man's back."},{"id":"sar-aankhon-par-bithana","ur":"سر آنکھوں پر بٹھانا","meaning_ur":"بہت عزت و احترام دینا","meaning_en":"to give someone great respect and honour","example_ur":"مہمانوں کو گھر آنے پر سر آنکھوں پر بٹھایا گیا۔","example_en":"The guests were given the greatest honour on arrival."},{"id":"zaban-dena","ur":"زبان دینا","meaning_ur":"وعدہ کرنا","meaning_en":"to give one's word, to promise","example_ur":"اس نے مجھے مدد کرنے کی زبان دی تھی۔","example_en":"He had given me his word that he would help."},{"id":"dil-bara-karna","ur":"دل بڑا کرنا","meaning_ur":"فراخ دلی سے کام لینا، معاف کر دینا","meaning_en":"to be generous or broad-minded","example_ur":"بھائی نے دل بڑا کر کے اپنے دوست کی غلطی معاف کر دی۔","example_en":"The brother was big-hearted and forgave his friend's mistake."},{"id":"paon-tale-zameen-nikal-jana","ur":"پاؤں تلے زمین نکل جانا","meaning_ur":"بہت زیادہ حیران یا پریشان ہو جانا","meaning_en":"to be utterly shocked, to lose one's footing (figuratively)","example_ur":"خبر سن کر اس کے پاؤں تلے زمین نکل گئی۔","example_en":"The ground seemed to slip from under his feet at the news."},{"id":"apne-pairon-par-khara-hona","ur":"اپنے پیروں پر کھڑا ہونا","meaning_ur":"خود مختار یا خود کفیل ہو جانا","meaning_en":"to become self-reliant, to stand on one's own feet","example_ur":"تعلیم مکمل کر کے وہ اپنے پیروں پر کھڑا ہو گیا۔","example_en":"After finishing his education, he became self-reliant."},{"id":"dekha-dekhi-karna","ur":"دیکھا دیکھی کرنا","meaning_ur":"دوسروں کی نقل اتارنا، بلا سوچے سمجھے تقلید کرنا","meaning_en":"to blindly imitate others","example_ur":"دیکھا دیکھی میں بہت سے طالب علم غلط راستہ اپنا لیتے ہیں۔","example_en":"By blindly imitating others, many students take the wrong pat rate and solve problems as a team. Discipline and punctuality learned at school stay with students throughout their lives. Although studying can sometimes feel difficult or stressful, the friendships and lessons gained during school years remain valuable for a very long time. For this reason, students should make the most of their time at school and respect their teachers and classmates.","modelUr":"سکول ایک نوجوان کی شخصیت اور مستقبل سنوارنے میں بہت اہم کردار ادا کرتا ہے۔ ہر روز طلبہ ریاضی، سائنس اور زبانوں جیسے نئے مضامین سیکھنے کے لیے کلاسوں میں شرکت کرتے ہیں۔ اچھے اساتذہ نہ صرف علم بانٹتے ہیں بلکہ طلبہ کی اچھی عادات اور اقدار پیدا کرنے میں بھی رہنمائی کرتے ہیں۔ تعلیمی مضامین کے علاوہ، سکول کھیلوں، کلبوں اور ثقافتی سرگرمیوں کا اہتمام بھی کرتے ہیں جو طلبہ کو اپنی صلاحیتوں اور دلچسپیوں کو دریافت کرنے میں مدد دیتے ہیں۔ ساتھی طلبہ کے ساتھ مل کر منصوبوں پر کام کرنا بچوں کو ٹیم کے طور پر تعاون کرنا اور مسائل حل کرنا سکھاتا ہے۔ سکول میں سیکھا گیا نظم و ضبط اور وقت کی پابندی زندگی بھر طلبہ کے ساتھ رہتی ہے۔ اگرچہ پڑھائی کبھی کبھار مشکل یا تھکا دینے والی محسوس ہو سکتی ہے، لیکن سکول کے دنوں کی دوستیاں اور سبق طویل عرصے تک قیمتی رہتے ہیں۔ اسی لیے طلبہ کو اپنے سکول کے وقت سے بھرپور فائدہ اٹھانا چاہیے اور اپنے اساتذہ اور ساتھیوں کا احترام کرنا چاہیے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"festivals-culture","ur":"تہوار اور ثقافت","en":"Festivals & Culture","warmup":[{"en":"We celebrate Eid with our whole family.","bank":["عید","خاندان","پورے","اپنے","ہم","کے","ساتھ","مناتے","ہیں"],"answer":["ہم","اپنے","پورے","خاندان","کے","ساتھ","عید","مناتے","ہیں"]},{"en":"Children receive Eidi from elders.","bank":["سے","عیدی","بڑوں","بچوں","کو","ملتی","ہے"],"answer":["بچوں","کو","بڑوں","سے","عیدی","ملتی","ہے"]},{"en":"My mother cooks sweet dishes on Eid.","bank":["پکوان","میری","عید","بناتی","پر","والدہ","میٹھے","ہیں"],"answer":["میری","والدہ","عید","پر","میٹھے","پکوان","بناتی","ہیں"]},{"en":"We wear new clothes and visit relatives.","bank":["ملتے","پہنتے","سے","نئے","ہم","ہیں","کپڑے","اور","رشتہ","داروں"],"answer":["ہم","نئے","کپڑے","پہنتے","ہیں","اور","رشتہ","داروں","سے","ملتے"]},{"en":"Everyone says Eid Mubarak to each other.","bank":["کو","مبارک","دوسرے","ایک","عید","سب","کہتے","ہیں"],"answer":["سب","ایک","دوسرے","کو","عید","مبارک","کہتے","ہیں"]}],"passage":{"en":"Festivals hold a very special place in Pakistani culture, bringing families and communities together in celebration. Eid, one of the most important festivals, is celebrated twice a year with great enthusiasm. Families wake up early, wear new clothes, and visit the mosque for special prayers. Afterwards, relatives and friends gather to share festive meals and sweets. Children eagerly look forward to receiving Eidi, small gifts of money given by elders. Besides Eid, Pakistan also celebrates cultural festivals such as Basant and various regional harvest festivals, each with its own unique traditions and customs. These occasions provide an opportunity for people to set aside their daily worries and enjoy time with loved ones. Festivals also help pass down traditions and values from one generation to the next, strengthening the bonds within families and communities. For many people, these celebrations are the most cherished moments of the year.","modelUr":"تہوار پاکستانی ثقافت میں بہت خاص مقام رکھتے ہیں اور خاندانوں اور برادریوں کو جشن منانے کے لیے اکٹھا کرتے ہیں۔ عید، جو سب سے اہم تہواروں میں سے ایک ہے، سال میں دو بار بڑے جوش و خروش سے منائی جاتی ہے۔ خاندان صبح سویرے اٹھتے ہیں، نئے کپڑے پہنتے ہیں اور خصوصی نماز کے لیے مسجد جاتے ہیں۔ اس کے بعد رشتہ دار اور دوست اکٹھے ہو کر تہواری کھانے اور مٹھائیاں بانٹتے ہیں۔ بچے بے صبری سے عیدی کا انتظار کرتے ہیں، جو بڑوں کی طرف سے دیے جانے والے چھوٹے تحائف ہیں۔ عید کے علاوہ، پاکستان بسنت اور مختلف علاقائی فصل کے تہوار بھی مناتا ہے، ہر ایک اپنی منفرد روایات اور رسومات کے ساتھ۔ یہ مواقع لوگوں کو روزمرہ کی پریشانیوں کو ایک طرف رکھ کر پیاروں کے ساتھ وقت گزارنے کا موقع فراہم کرتے ہیں۔ تہوار ایک نسل سے دوسری نسل تک روایات اور اقدار منتقل کرنے میں بھی مدد دیتے ہیں، جس سے خاندانوں اور برادریوں کے رشتے مضبوط ہوتے ہیں۔ بہت سے لوگوں کے لیے یہ جشن سال کے سب سے پیارے لمحات ہوتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"health-body","ur":"صحت اور جسم","en":"Health & Body","warmup":[{"en":"Exercise is good for health.","bank":["اچھی","لیے","ورزش","کے","صحت","ہے"],"answer":["ورزش","صحت","کے","لیے","اچھی","ہے"]},{"en":"The doctor gave me medicine.","bank":["مجھے","نے","دی","ڈاکٹر","دوا"],"answer":["ڈاکٹر","نے","مجھے","دوا","دی"]},{"en":"I drink water every morning.","bank":["صبح","پیتا","پانی","ہر","میں","ہوں"],"answer":["میں","ہر","صبح","پانی","پیتا","ہوں"]},{"en":"She takes good care of her health.","bank":["خیال","کا","رکھتی","صحت","اپنی","وہ","اچھا","ہے"],"answer":["وہ","اپنی","صحت","کا","اچھا","خیال","رکھتی","ہے"]},{"en":"Children need enough sleep.","bank":["ضرورت","کی","نیند","کو","بچوں","مناسب","ہے"],"answer":["بچوں","کو","مناسب","نیند","کی","ضرورت","ہے"]}],"passage":{"en":"Good health is one of the greatest blessings a person can have, and taking care of it should be a daily priority. Eating a balanced diet full of fruits, vegetables, and clean water helps the body stay strong and fight off illness. Regular exercise, even something as simple as a daily walk, keeps the heart healthy and improves mood. Getting enough sleep every night allows the body and mind to rest and recover from the day's activities. Doctors also recommend regular medical checkups so that any health problem can be identified and treated early, before it becomes serious. Unfortunately, many people ignore these simple habits because of busy schedules, only to face health problems later in life. Schools and families should teach children from a young age that maintaining good health is far easier than curing a serious illness.","modelUr":"اچھی صحت ان بڑی نعمتوں میں سے ایک ہے جو انسان کو حاصل ہو سکتی ہیں، اور اس کا خیال رکھنا روزانہ کی ترجیح ہونی چاہیے۔ پھلوں، سبزیوں اور صاف پانی سے بھرپور متوازن غذا کھانا جسم کو مضبوط رکھنے اور بیماریوں سے لڑنے میں مدد دیتا ہے۔ باقاعدہ ورزش، چاہے وہ روزانہ کی سادہ چہل قدمی ہی کیوں نہ ہو، دل کو صحت مند رکھتی ہے اور موڈ بہتر بناتی ہے۔ ہر رات مناسب نیند لینا جسم اور دماغ کو دن بھر کی سرگرمیوں سے آرام اور بحالی کا موقع دیتا ہے۔ ڈاکٹر باقاعدہ طبی معائنے کا مشورہ بھی دیتے ہیں تاکہ کسی بھی صحت کے مسئلے کی بروقت شناخت اور علاج ہو سکے، اس سے پہلے کہ وہ سنگین ہو جائے۔ افسوس کی بات ہے کہ بہت سے لوگ مصروف معمولات کی وجہ سے ان سادہ عادات کو نظرانداز کرتے ہیں اور بعد میں زندگی میں صحت کے مسائل کا سامنا کرتے ہیں۔ سکولوں اور خاندانوں کو بچوں کو بچپن ہی سے سکھانا چاہیے کہ اچھی صحت برقرار رکھنا کسی سنگین بیماری کے علاج سے کہیں زیادہ آسان ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"technology-communication","ur":"ٹیکنالوجی اور رابطہ","en":"Technology & Communication","warmup":[{"en":"I use the internet every day.","bank":["روزانہ","استعمال","میں","انٹرنیٹ","کرتا","ہوں"],"answer":["میں","روزانہ","انٹرنیٹ","استعمال","کرتا","ہوں"]},{"en":"She sent me an important message.","bank":["پیغام","بھیجا","اس","مجھے","اہم","نے","ایک"],"answer":["اس","نے","مجھے","ایک","اہم","پیغام","بھیجا"]},{"en":"This app is very useful for students.","bank":["مفید","طلبہ","یہ","بہت","ایپ","کے","لیے","ہے"],"answer":["یہ","ایپ","طلبہ","کے","لیے","بہت","مفید","ہے"]},{"en":"We should keep our password safe.","bank":["پاس","چاہیے","رکھنا","اپنا","محفوظ","ہمیں","ورڈ"],"answer":["ہمیں","اپنا","پاس","ورڈ","محفوظ","رکھنا","چاہیے"]},{"en":"My phone has a lot of useful features.","bank":["خصوصیات","میں","مفید","فون","میرے","بہت","سی","ہیں"],"answer":["میرے","فون","میں","بہت","سی","مفید","خصوصیات","ہیں"]}],"passage":{"en":"Modern technology has transformed the way people communicate and share information. With just a smartphone and an internet connection, a person can send a message, make a video call, or search for information from anywhere in the world within seconds. Social media platforms allow people to stay connected with friends and family, even when they live far apart. Businesses also rely heavily on technology to reach customers, advertise products, and manage their daily operations. However, using technology responsibly is extremely important. People should never share personal information with strangers online, and they should always use strong passwords to protect their accounts. Parents and teachers have a duty to guide children about safe internet habits from an early age. When used wisely, technology can be one of the most powerful tools for learning, communication, and progress in the modern world.","modelUr":"جدید ٹیکنالوجی نے لوگوں کے رابطے اور معلومات کے تبادلے کے انداز کو یکسر بدل دیا ہے۔ صرف ایک سمارٹ فون اور انٹرنیٹ کنکشن کی مدد سے کوئی بھی شخص چند سیکنڈوں میں دنیا کے کسی بھی کونے سے پیغام بھیج سکتا ہے، ویڈیو کال کر سکتا ہے یا معلومات تلاش کر سکتا ہے۔ سوشل میڈیا پلیٹ فارمز لوگوں کو دور رہنے کے باوجود دوستوں اور خاندان سے جڑے رہنے میں مدد دیتے ہیں۔ کاروبار بھی گاہکوں تک پہنچنے، مصنوعات کی تشہیر کرنے اور روزمرہ کے کاموں کو سنبھالنے کے لیے ٹیکنالوجی پر بہت انحصار کرتے ہیں۔ تاہم، ٹیکنالوجی کا ذمہ دارانہ استعمال انتہائی ضروری ہے۔ لوگوں کو کبھی بھی اجنبیوں کے ساتھ آن لائن ذاتی معلومات شیئر نہیں کرنی چاہییں، اور انہیں ہمیشہ اپنے اکاؤنٹس کی حفاظت کے لیے مضبوط پاس ورڈ استعمال کرنے چاہییں۔ والدین اور اساتذہ کی ذمہ داری ہے کہ وہ بچوں کو بچپن ہی سے انٹرنیٹ کی محفوظ عادات کے بارے میں رہنمائی دیں۔ عقلمندی سے استعمال کیا جائے تو ٹیکنالوجی سیکھنے، رابطے اور جدید دنیا میں ترقی کے لیے ایک انتہائی طاقتور ذریعہ بن سکتی ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"elephants","ur":"ہاتھیوں کی زندگی","en":"Life of Elephants","warmup":[{"en":"The elephant is a very large animal.","bank":["بڑا","ایک","بہت","ہاتھی","جانور","ہے"],"answer":["ہاتھی","ایک","بہت","بڑا","جانور","ہے"]},{"en":"Elephants live in the forest.","bank":["میں","رہتے","ہاتھی","جنگل","ہیں"],"answer":["ہاتھی","جنگل","میں","رہتے","ہیں"]},{"en":"We should protect wild animals.","bank":["کرنی","جنگلی","چاہیے","حفاظت","ہمیں","جانوروں","کی"],"answer":["ہمیں","جنگلی","جانوروں","کی","حفاظت","کرنی","چاہیے"]},{"en":"Hunters kill many elephants every year.","bank":["ہاتھی","بہت","شکاری","ہر","سے","سال","ہلاک","کر","دیتے","ہیں"],"answer":["شکاری","ہر","سال","بہت","سے","ہاتھی","ہلاک","کر","دیتے","ہیں"]},{"en":"This sanctuary is safe for elephants.","bank":["محفوظ","کے","ہاتھیوں","سینکچوری","یہ","لیے","ہے"],"answer":["یہ","سینکچوری","ہاتھیوں","کے","لیے","محفوظ","ہے"]}],"passage":{"en":"The elephant is one of the most magnificent creatures on Earth, admired for its intelligence, strength, and gentle nature. Unfortunately, the world's elephant population has been declining rapidly due to illegal hunting and the destruction of their natural habitats. Poachers kill elephants for their valuable ivory tusks, which are sold illegally in various markets around the world. This cruel practice has pushed several elephant species toward extinction. To address this serious problem, many countries have established wildlife sanctuaries and passed strict laws against poaching. Conservationists work tirelessly to protect elephants, monitor their health, and educate local communities about the importance of preserving these animals. Schools and media campaigns also play an important role in raising public awareness about elephant conservation. If people around the world work together, it may still be possible to save this remarkable species for future generations to admire and enjoy.","modelUr":"ہاتھی زمین پر پائی جانے والی سب سے شاندار مخلوقات میں سے ایک ہے، جسے اس کی ذہانت، طاقت اور نرم مزاجی کی وجہ سے سراہا جاتا ہے۔ بدقسمتی سے، غیر قانونی شکار اور قدرتی مسکن کی تباہی کی وجہ سے دنیا بھر میں ہاتھیوں کی آبادی تیزی سے کم ہو رہی ہے۔ شکاری ہاتھیوں کو ان کے قیمتی ہاتھی دانت کے لیے ہلاک کرتے ہیں، جنہیں دنیا بھر کی مختلف منڈیوں میں غیر قانونی طور پر فروخت کیا جاتا ہے۔ اس ظالمانہ عمل نے کئی ہاتھیوں کی اقسام کو معدومیت کے قریب پہنچا دیا ہے۔ اس سنگین مسئلے سے نمٹنے کے لیے، بہت سے ممالک نے جنگلی حیات کی سینکچوریز قائم کی ہیں اور شکار کے خلاف سخت قوانین بنائے ہیں۔ ماہرینِ فطرت ہاتھیوں کی حفاظت، ان کی صحت کی نگرانی اور مقامی برادریوں کو ان جانوروں کے تحفظ کی اہمیت کے بارے میں آگاہی دینے کے لیے انتھک محنت کرتے ہیں۔ سکول اور میڈیا مہمات بھی ہاتھیوں کے تحفظ کے بارے میں عوامی شعور اجاگر کرنے میں اہم کردار ادا کرتی ہیں۔ اگر دنیا بھر کے لوگ مل کر کوشش کریں تو ممکن ہے کہ اس شاندار نسل کو آنے والی نسلوں کے لیے بچایا جا سکے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"cricket","ur":"کرکٹ","en":"Cricket","warmup":[{"en":"Our team won the match.","bank":["میچ","گئی","جیت","ٹیم","ہماری"],"answer":["ہماری","ٹیم","میچ","جیت","گئی"]},{"en":"The players practise every day.","bank":["پریکٹس","کھلاڑی","روزانہ","کرتے","ہیں"],"answer":["کھلاڑی","روزانہ","پریکٹس","کرتے","ہیں"]},{"en":"The captain makes good decisions.","bank":["فیصلے","کپتان","کرتا","اچھے","ہے"],"answer":["کپتان","اچھے","فیصلے","کرتا","ہے"]},{"en":"Thousands of people watched the final.","bank":["دیکھا","لوگوں","فائنل","ہزاروں","نے"],"answer":["ہزاروں","لوگوں","نے","فائنل","دیکھا"]},{"en":"This is the most important match.","bank":["اہم","سب","یہ","میچ","سے","ہے"],"answer":["یہ","سب","سے","اہم","میچ","ہے"]}],"passage":{"en":"Cricket is one of the most popular sports in Pakistan, followed passionately by millions of fans across the country. The sport requires not only physical skill but also mental strength, teamwork, and strategic thinking. Young cricketers spend years practising their batting, bowling, and fielding techniques before they get a chance to represent their school, city, or country. A good captain plays a vital role in a team's success, making important decisions during the match and keeping the players motivated, especially during difficult situations. Winning a match often depends on how well the players work together as a team rather than relying on individual performance alone. Cricket tournaments, whether at the school level or international level, bring communities together and create a sense of excitement and unity among supporters. For many young players, cricket is not just a game but a dream they hope to pursue as a career.","modelUr":"کرکٹ پاکستان کے مقبول ترین کھیلوں میں سے ایک ہے، جسے ملک بھر میں لاکھوں شائقین جوش و خروش سے فالو کرتے ہیں۔ اس کھیل کے لیے نہ صرف جسمانی مہارت بلکہ ذہنی مضبوطی، ٹیم ورک اور حکمتِ عملی بھی درکار ہوتی ہے۔ نوجوان کرکٹرز اپنے سکول، شہر یا ملک کی نمائندگی کرنے کا موقع ملنے سے پہلے برسوں تک اپنی بیٹنگ، باؤلنگ اور فیلڈنگ کی تکنیکوں پر مشق کرتے ہیں۔ ایک اچھا کپتان ٹیم کی کامیابی میں اہم کردار ادا کرتا ہے، میچ کے دوران اہم فیصلے کرتا ہے اور خاص طور پر مشکل حالات میں کھلاڑیوں کا حوصلہ بلند رکھتا ہے۔ میچ جیتنا اکثر اس بات پر منحصر ہوتا ہے کہ کھلاڑی ایک ٹیم کے طور پر کتنی اچھی طرح مل کر کام کرتے ہیں، نہ کہ صرف انفرادی کارکردگی پر۔ کرکٹ ٹورنامنٹ، چاہے سکول کی سطح پر ہوں یا بین الاقوامی سطح پر، برادریوں کو اکٹھا کرتے ہیں اور حامیوں میں جوش اور اتحاد کا احساس پیدا کرتے ہیں۔ بہت سے نوجوان کھلاڑیوں کے لیے کرکٹ محض ایک کھیل نہیں بلکہ ایک خواب ہے جسے وہ بطور کیریئر اپنانا چاہتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"environment-seasons","ur" ری بھی ہوتی ہے، جبکہ گرمیوں میں شدید گرمی آتی ہے جسے بہت سے شہروں میں برداشت کرنا مشکل ہو جاتا ہے۔ مون سون کا موسم زراعت کے لیے ضروری بارش لاتا ہے، اگرچہ کبھی کبھار یہ نشیبی علاقوں میں سیلاب کا باعث بھی بنتا ہے۔ بہار، جسے بہت سے لوگ سب سے خوشگوار موسم سمجھتے ہیں، کھلتے پھول اور معتدل، آرام دہ درجہ حرارت لاتی ہے۔ تاہم، حالیہ برسوں میں موسمیاتی تبدیلی نے ان قدرتی نمونوں کو نمایاں طور پر متاثر کرنا شروع کر دیا ہے۔ گرمیاں زیادہ گرم اور طویل ہو گئی ہیں، جبکہ بارشیں غیر متوقع ہوتی جا رہی ہیں، کبھی شدید سیلاب اور کبھی طویل خشک سالی کے درمیان۔ سائنسدانوں کا انتباہ ہے کہ اگر یہ تبدیلیاں مناسب اقدامات کے بغیر جاری رہیں تو ملک بھر میں زراعت، پانی کی فراہمی اور روزمرہ زندگی کو سنگین مشکلات کا سامنا کرنا پڑ سکتا ہے۔ زیادہ درخت لگانا اور آلودگی کم کرنا دو سادہ اقدامات ہیں جو آنے والی نسلوں کے لیے ماحول کے تحفظ میں مدد دے سکتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"margalla-hills","ur":"مارگلہ کی پہاڑیاں","en":"The Margalla Hills","warmup":[{"en":"We went hiking in the mountains.","bank":["گئے","میں","کرنے","ہائیکنگ","ہم","پہاڑوں"],"answer":["ہم","پہاڑوں","میں","ہائیکنگ","کرنے","گئے"]},{"en":"The view from the top was beautiful.","bank":["خوبصورت","سے","نظارہ","چوٹی","تھا"],"answer":["چوٹی","سے","نظارہ","خوبصورت","تھا"]},{"en":"We should carry water on the trail.","bank":["پانی","ہمیں","چاہیے","پر","رکھنا","ٹریل","ساتھ"],"answer":["ہمیں","ٹریل","پر","پانی","ساتھ","رکھنا","چاہیے"]},{"en":"The guide showed us the correct path.","bank":["دکھایا","نے","راستہ","گائیڈ","ہمیں","صحیح"],"answer":["گائیڈ","نے","ہمیں","صحیح","راستہ","دکھایا"]},{"en":"This trail is more difficult than that one.","bank":["مشکل","زیادہ","ٹریل","اس","یہ","سے","ہے"],"answer":["یہ","ٹریل","اس","سے","زیادہ","مشکل","ہے"]}],"passage":{"en":"The Margalla Hills, located on the edge of Islamabad, offer some of the most popular hiking trails
