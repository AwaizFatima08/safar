ہمیت","en":"The Importance of Family Time","passage":"جدید دور میں مصروف طرزِ زندگی کی وجہ سے خاندان کے افراد ایک دوسرے کے ساتھ کم وقت گزار پاتے ہیں۔ والدین دفتر کے کاموں میں مصروف رہتے ہیں جبکہ بچے سکول، ہوم ورک اور اپنی سرگرمیوں میں الجھے رہتے ہیں۔ اس کے نتیجے میں خاندانی رشتے کمزور ہونے لگتے ہیں۔\n\nماہرینِ نفسیات کا کہنا ہے کہ خاندان کے ساتھ گزارا گیا وقت بچوں کی ذہنی اور جذباتی نشوونما کے لیے انتہائی اہم ہے۔ اکٹھے کھانا کھانا، ایک دوسرے کے دن کے بارے میں بات کرنا اور مشترکہ سرگرمیوں میں حصہ لینا خاندانی تعلقات کو مضبوط کرتا ہے۔\n\nبہت سے خاندان ہفتے میں کم از کم ایک دن مقرر کرتے ہیں جسے وہ صرف ایک دوسرے کے ساتھ گزارتے ہیں، چاہے یہ سیر پر جانا ہو، کھیل کھیلنا ہو، یا صرف گھر میں اکٹھے وقت گزارنا ہو۔ اس طرح کی عادات بچوں کو یہ احساس دلاتی ہیں کہ وہ اپنے خاندان کے لیے اہم ہیں۔\n\nمصروفیت کے باوجود، خاندان کے ساتھ وقت نکالنا ہر فرد کی ذمہ داری ہے، کیونکہ یہ رشتے زندگی بھر کی خوشی اور سکون کا سب سے بڑا ذریعہ ہوتے ہیں۔","modelSummary":"مصروف طرزِ زندگی کی وجہ سے خاندانی رشتے کمزور ہو رہے ہیں۔ ماہرین کے مطابق خاندان کے ساتھ وقت بچوں کی نشوونما کے لیے اہم ہے۔ اکٹھے کھانا کھانا اور بات چیت کرنا رشتوں کو مضبوط کرتا ہے۔ بہت سے خاندان ہفتے میں ایک دن مخصوص کرتے ہیں۔ مصروفیت کے باوجود خاندان کے لیے وقت نکالنا ضروری ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے خاندانی وقت کی اہمیت کے کم از کم دو نکات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"role-of-a-good-teacher","ur":"ایک اچھے استاد کا کردار","en":"The Role of a Good Teacher","passage":"استاد کسی بھی معاشرے کی تعمیر میں بنیادی کردار ادا کرتے ہیں۔ ایک اچھا استاد صرف نصاب نہیں پڑھاتا بلکہ اپنے طلبہ کی زندگی پر گہرا اور مثبت اثر چھوڑتا ہے۔ اچھے اساتذہ طلبہ کی صلاحیتوں کو پہچانتے ہیں اور انہیں اپنی بہترین کارکردگی دکھانے کی ترغیب دیتے ہیں۔\n\nایک مؤثر استاد صبر، ہمدردی اور تفہیم کا مظاہرہ کرتا ہے، خاص طور پر ان طلبہ کے ساتھ جو پڑھائی میں مشکلات کا سامنا کرتے ہیں۔ وہ مختلف طریقے استعمال کرتے ہیں تاکہ ہر طالب علم اپنے انداز میں سیکھ سکے۔ اچھے اساتذہ طلبہ کو صرف امتحان پاس کرنے کے لیے نہیں بلکہ زندگی کے چیلنجز کا مقابلہ کرنے کے لیے تیار کرتے ہیں۔\n\nبہت سے کامیاب افراد اپنی کامیابی کا سہرا کسی ایک استاد کے سر باندھتے ہیں جس نے ان پر یقین کیا جب انہیں خود پر یقین نہیں تھا۔ اساتذہ اکثر اپنے طلبہ کی زندگی بھر یاد رہتے ہیں کیونکہ وہ علم کے ساتھ ساتھ کردار سازی میں بھی اہم کردار ادا کرتے ہیں۔\n\nمعاشرے کو چاہیے کہ وہ اساتذہ کی عزت اور قدر کرے، کیونکہ وہ ہماری آنے والی نسلوں کے معمار ہیں۔","modelSummary":"استاد معاشرے کی تعمیر میں اہم کردار ادا کرتے ہیں اور طلبہ کی زندگی پر گہرا اثر چھوڑتے ہیں۔ اچھے اساتذہ صبر اور ہمدردی سے کام لیتے ہیں اور طلبہ کو زندگی کے چیلنجز کے لیے تیار کرتے ہیں۔ بہت سے کامیاب افراد اپنی کامیابی کا سہرا کسی استاد کو دیتے ہیں۔ معاشرے کو اساتذہ کی قدر کرنی چاہیے کیونکہ وہ آنے والی نسلوں کے معمار ہیں۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے اچھے استاد کی کم از کم دو خصوصیات شامل کیں؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"cultural-diversity-in-pakistan","ur":"پاکستان میں ثقافتی تنوع","en":"Cultural Diversity in Pakistan","passage":"پاکستان مختلف ثقافتوں، زبانوں اور روایات کا حسین امتزاج ہے۔ پنجاب، سندھ، بلوچستان اور خیبر پختونخوا سمیت ہر صوبے کی اپنی منفرد ثقافت، لباس، کھانے اور تہوار ہیں۔ یہ تنوع پاکستان کو ایک بھرپور ثقافتی ورثہ رکھنے والا ملک بناتا ہے۔\n\nمختلف علاقوں کے لوگ اپنے مقامی تہوار بڑے جوش و خروش سے مناتے ہیں، جیسے پنجاب میں بسنت، سندھ میں سندھی ثقافتی دن اور بلوچستان میں مقامی میلے۔ ہر تہوار اپنے ساتھ روایتی موسیقی، رقص اور کھانے لاتا ہے، جو اس علاقے کی پہچان بن جاتے ہیں۔\n\nیہ ثقافتی تنوع پاکستانی معاشرے کو مزید بھرپور اور متنوع بناتا ہے، لیکن اس کے ساتھ ساتھ یہ ضروری ہے کہ لوگ ایک دوسرے کی ثقافت کا احترام کریں اور رواداری کو فروغ دیں۔ سکولوں کو چاہیے کہ وہ طلبہ کو پاکستان کی مختلف ثقافتوں کے بارے میں آگاہی دیں تاکہ وہ اپنے ملک کے تنوع کی قدر کرنا سیکھیں۔\n\nبالآخر، یہ تنوع پاکستان کی طاقت ہے، اور اسے منانا اور محفوظ رکھنا ہر پاکستانی کی ذمہ داری ہے۔","modelSummary":"پاکستان مختلف ثقافتوں، زبانوں اور روایات کا حسین امتزاج ہے، جہاں ہر صوبے کی اپنی منفرد شناخت ہے۔ لوگ اپنے مقامی تہوار جوش سے مناتے ہیں جو موسیقی، رقص اور کھانوں کے ساتھ منسلک ہیں۔ اس تنوع کی قدر کرنے اور رواداری فروغ دینے کے لیے سکولوں کو آگاہی دینی چاہیے۔ یہ تنوع پاکستان کی طاقت ہے اور اسے محفوظ رکھنا ضروری ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے ثقافتی تنوع کے کم از کم دو نکات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"mental-health-awareness","ur":"ذہنی صحت کی آگاہی","en":"Mental Health Awareness","passage":"جسمانی صحت کی طرح ذہنی صحت بھی ایک صحت مند زندگی کے لیے اتنی ہی اہم ہے، لیکن ہمارے معاشرے میں اس موضوع پر بات کرنا اب بھی مشکل سمجھا جاتا ہے۔ بہت سے لوگ ذہنی دباؤ، پریشانی یا اداسی کا شکار ہونے کے باوجود مدد لینے سے ہچکچاتے ہیں کیونکہ انہیں معاشرتی تنقید کا خوف ہوتا ہے۔\n\nنوجوانوں میں امتحانات کا دباؤ، سوشل میڈیا کا اثر اور مستقبل کی فکر ذہنی دباؤ کی عام وجوہات ہیں۔ ماہرین کا کہنا ہے کہ اگر ابتدائی مراحل میں ہی ذہنی دباؤ کو پہچان لیا جائے تو اس کا علاج کرنا آسان ہو جاتا ہے۔\n\nسکولوں اور خاندانوں کو چاہیے کہ وہ ایک ایسا ماحول فراہم کریں جہاں بچے اپنے جذبات کھل کر بیان کر سکیں بغیر کسی خوف کے۔ کھیلوں میں حصہ لینا، دوستوں سے بات کرنا اور کافی نیند لینا ذہنی صحت بہتر بنانے کے آسان طریقے ہیں۔\n\nمعاشرے کو ذہنی صحت کے بارے میں غلط فہمیوں کو دور کرنا ہوگا اور اسے جسمانی صحت جتنی ہی اہمیت دینی ہوگی، تاکہ لوگ بلا جھجک مدد حاصل کر سکیں۔","modelSummary":"ذہنی صحت جسمانی صحت جتنی ہی اہم ہے، لیکن معاشرے میں اس پر بات کرنا مشکل سمجھا جاتا ہے۔ نوجوانوں میں امتحانات اور سوشل میڈیا دباؤ کی عام وجوہات ہیں۔ سکولوں اور خاندانوں کو کھلا ماحول فراہم کرنا چاہیے۔ کھیل، دوستوں سے بات چیت اور نیند ذہنی صحت بہتر بناتے ہیں۔ معاشرے کو غلط فہمیاں دور کر کے ذہنی صحت کو اہمیت دینی چاہیے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے ذہنی دباؤ کی کم از کم دو وجوہات شامل کیں؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"saving-endangered-species","ur":"خطرے سے دوچار انواع کو بچانا","en":"Saving Endangered Species","passage":"دنیا بھر میں بہت سی جانوروں کی انواع، جیسے ہاتھی، شیر اور گینڈے، معدومیت کے خطرے سے دوچار ہیں۔ اس کی بڑی وجوہات جنگلات کی کٹائی، غیر قانونی شکار اور آب و ہوا کی تبدیلی ہیں۔ جیسے جیسے انسانی آبادی بڑھتی ہے، جنگلی جانوروں کے قدرتی مسکن سکڑتے جا رہے ہیں۔\n\nہاتھیوں کو خاص طور پر ان کے قیمتی دانتوں کی وجہ سے نشانہ بنایا جاتا ہے، جبکہ شیروں کا شکار ان کی کھال اور اعضاء کے لیے کیا جاتا ہے۔ اگر ان جانوروں کے تحفظ کے لیے سنجیدہ اقدامات نہ کیے گئے تو آنے والی نسلیں انہیں صرف تصاویر میں دیکھ پائیں گی۔\n\nکئی تنظیمیں اور حکومتیں سینکچوریز قائم کر رہی ہیں، سخت قوانین بنا رہی ہیں اور عوام میں آگاہی مہمات چلا رہی ہیں تاکہ ان جانوروں کو بچایا جا سکے۔ سکولوں میں بچوں کو چھوٹی عمر سے ہی ماحولیات اور جنگلی حیات کے تحفظ کی اہمیت سکھانا بھی ضروری ہے۔\n\nاگر پوری دنیا مل کر کوشش کرے تو ہم اپنی زمین کے ان شاندار مخلوقات کو معدومیت سے بچا سکتے ہیں۔","modelSummary":"جنگلات کی کٹائی، غیر قانونی شکار اور آب و ہوا کی تبدیلی کی وجہ سے ہاتھی اور شیر جیسی انواع معدومیت کے خطرے سے دوچار ہیں۔ ہاتھیوں کا شکار دانتوں کے لیے کیا جاتا ہے۔ حکومتیں اور تنظیمیں سینکچوریز اور قوانین کے ذریعے انہیں بچانے کی کوشش کر رہی ہیں۔ سکولوں میں بچوں کو ماحولیات کی اہمیت سکھانا بھی ضروری ہے تاکہ یہ مخلوقات معدوم نہ ہوں۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے معدومیت کی کم از کم دو وجوہات شامل کیں؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"cricket-and-national-unity","ur":"کرکٹ اور قومی اتحاد","en":"Cricket and National Unity","passage":"کرکٹ پاکستان میں محض ایک کھیل نہیں بلکہ قومی جذبات اور اتحاد کی علامت بن چکا ہے۔ جب پاکستانی ٹیم کوئی اہم میچ کھیلتی ہے تو پورا ملک، مذہب، زبان اور صوبے کے فرق کے بغیر، ایک ساتھ ٹیم کی حمایت کرتا ہے۔\n\n1992 کا ورلڈ کپ اس کی بہترین مثال ہے، جب پاکستان کی جیت نے پوری قوم کو خوشی کے ایک ہی لمحے میں جوڑ دیا۔ گلیوں، بازاروں اور گھروں میں لوگ ایک ساتھ میچ دیکھتے اور جشن مناتے ہیں، جو معاشرتی اور علاقائی فرق کو عارضی طور پر بھلا دیتا ہے۔\n\nکرکٹ نوجوانوں کو بھی ایک مثبت سرگرمی فراہم کرتا ہے اور انہیں نظم و ضبط، محنت اور ٹیم ورک جیسی اقدار سکھاتا ہے۔ کئی کھلاڑی غریب پس منظر سے تعلق رکھنے کے باوجود اپنی محنت سے قومی ہیرو بن جاتے ہیں، جو دوسرے نوجوانوں کے لیے تحریک کا باعث بنتے ہیں۔\n\nاس طرح، کرکٹ نہ صرف تفریح کا ذریعہ ہے بلکہ یہ پاکستانی قوم کو ایک لڑی میں پرونے کا بھی کام کرتا ہے۔","modelSummary":"کرکٹ پاکستان میں قومی اتحاد کی علامت بن چکا ہے، جہاں پورا ملک فرق کے بغیر ٹیم کی حمایت کرتا ہے۔ 1992 کے ورلڈ کپ کی جیت نے قوم کو خوشی میں جوڑ دیا۔ کرکٹ نوجوانوں کو نظم و ضبط اور ٹیم ورک سکھاتا ہے، اور کئی کھلاڑی غریب پس منظر سے قومی ہیرو بنتے ہیں۔ یہ کھیل تفریح کے ساتھ قومی اتحاد کا بھی ذریعہ ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے کرکٹ کے قومی اتحاد میں کردار کے کم از کم دو نکات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"rural-urban-migration","ur":"دیہات سے شہروں کی طرف نقل مکانی","en":"Rural-to-Urban Migration","passage":"پچھلی چند دہائیوں میں پاکستان میں دیہات سے شہروں کی طرف نقل مکانی میں نمایاں اضافہ ہوا ہے۔ بہت سے لوگ بہتر روزگار، تعلیم اور طبی سہولیات کی تلاش میں اپنے آبائی گاؤں چھوڑ کر شہروں کا رخ کرتے ہیں۔\n\nاس نقل مکانی کے مثبت اور منفی دونوں اثرات ہیں۔ ایک طرف، لوگوں کو بہتر معیارِ زندگی اور روزگار کے مواقع ملتے ہیں، جس سے ان کے خاندانوں کی معاشی حالت بہتر ہوتی ہے۔ دوسری طرف، اس سے شہروں پر آبادی کا دباؤ بڑھتا ہے، جس کے نتیجے میں ٹریفک جام، رہائش کی کمی اور بنیادی سہولیات پر بوجھ جیسے مسائل جنم لیتے ہیں۔\n\nاس کے علاوہ، دیہات میں کام کرنے کے قابل نوجوانوں کی کمی سے کاشتکاری متاثر ہوتی ہے، اور کئی گاؤں آبادی کی کمی کا شکار ہو جاتے ہیں۔ ماہرینِ معاشیات کا کہنا ہے کہ اگر دیہاتوں میں بھی روزگار اور تعلیم کے مواقع بہتر بنائے جائیں تو یہ نقل مکانی کم ہو سکتی ہے۔\n\nحکومت کو دیہی ترقیاتی منصوبوں پر توجہ دینی چاہیے تاکہ شہروں اور دیہاتوں کے درمیان توازن برقرار رہے۔","modelSummary":"پاکستان میں دیہات سے شہروں کی طرف نقل مکانی روزگار، تعلیم اور طبی سہولیات کی تلاش میں بڑھ رہی ہے۔ اس سے معاشی بہتری آتی ہے لیکن شہروں پر آبادی کا دباؤ اور ٹریفک جیسے مسائل بھی جنم لیتے ہیں۔ دیہاتوں میں افرادی قوت کی کمی سے کاشتکاری متاثر ہوتی ہے۔ ماہرین کے مطابق دیہی ترقی سے یہ نقل مکانی کم ہو سکتی ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے نقل مکانی کے کم از کم دو اثرات (مثبت اور منفی) شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"kalash-people","ur":"کیلاش لوگ اور ان کی ثقافت","en":"The Kalash People and Their Culture","passage":"پاکستان کے شمال مغرب میں ضلع چترال کی تین سرسبز وادیاں — بمبوریت، رمبور اور بریر — کیلاش لوگوں کا گھر ہیں۔ یہ لوگ صدیوں سے اپنی منفرد زبان، لباس اور رسم و رواج کے ساتھ ان پہاڑوں میں آباد ہیں۔ ان کی آبادی صرف چند ہزار افراد پر مشتمل ہے، اس لیے ان کی ثقافت دنیا کی نایاب ثقافتوں میں شمار کی جاتی ہے۔\n\nکیلاش خواتین کا لباس خاص طور پر قابلِ ذکر ہے۔ وہ کالے رنگ کے لمبے فراک پہنتی ہیں جن پر سرخ، پیلے اور سبز رنگ کی کڑھائی ہوتی ہے، اور سر پر سیپیوں سے سجی ٹوپی رکھتی ہیں۔ کیلاش کے گھر لکڑی اور پتھر سے بنے ہوتے ہیں اور پہاڑی ڈھلوانوں پر اس طرح تعمیر کیے جاتے ہیں کہ ایک گھر کی چھت دوسرے گھر کا صحن بن جاتی ہے۔\n\nکیلاش لوگ سال بھر میں کئی تہوار مناتے ہیں۔ بہار میں ‘چلم جوشٹ’، گرمیوں میں فصل کا جشن ‘اوچل’ اور سردیوں میں ‘چاؤموس’ ان کے اہم تہوار ہیں۔ ان مواقع پر موسیقی، رقص اور روایتی کھانوں کا خاص اہتمام کیا جاتا ہے۔\n\nسیاحت نے ان وادیوں میں نئے ہوٹل، سڑکیں اور روزگار کے مواقع پیدا کیے ہیں، لیکن ساتھ ہی ماحول اور مقامی طرزِ زندگی پر دباؤ بھی بڑھا ہے۔ اگر سیاح ذمہ داری کا مظاہرہ کریں، کچرا نہ پھیلائیں اور مقامی لوگوں کی رضامندی کا خیال رکھیں تو یہ قیمتی ثقافت آئندہ نسلوں تک محفوظ رہ سکتی ہے۔","modelSummary":"کیلاش لوگ چترال کی تین وادیوں میں آباد ہیں اور اپنی منفرد زبان، لباس اور روایات کی وجہ سے ایک نایاب ثقافت کے مالک ہیں۔ ان کی خواتین کڑھائی والے کالے لباس اور سیپیوں والی ٹوپیاں پہنتی ہیں، جبکہ ان کے گھر پہاڑی ڈھلوانوں پر ایک دوسرے کے اوپر بنے ہوتے ہیں۔ وہ بہار، گرمی اور سردی میں رقص و موسیقی سے بھرپور تہوار مناتے ہیں۔ سیاحت سے روزگار بڑھا ہے مگر ماحول پر دباؤ بھی آیا ہے، اس لیے ذمہ دارانہ سیاحت ضروری ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے لباس، رہائش اور تہوار — تینوں کا ذکر کیا؟","کیا آپ نے سیاحت کے فائدے اور نقصان دونوں شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے اور غیر ضروری تفصیلات (جیسے رنگوں کے نام) چھوڑ دیں؟"]},{"id":"indus-valley-civilisation","ur":"وادیٔ سندھ کی تہذیب","en":"The Indus Valley Civilisation","passage":"تقریباً ساڑھے چار ہزار سال پہلے، جب دنیا کے بیشتر حصوں میں لوگ چھوٹی بستیوں میں رہتے تھے، دریائے سندھ کے کنارے ایک ترقی یافتہ تہذیب پروان چڑھ رہی تھی۔ اس تہذیب کے دو بڑے شہر موئن جو دڑو اور ہڑپہ تھے، جو آج پاکستان میں واقع ہیں۔ دریا کے پانی نے یہاں کھیتی باڑی کو آسان بنایا اور تجارت کو فروغ دیا۔\n\nاس تہذیب کے لوگ شہری منصوبہ بندی میں غیر معمولی مہارت رکھتے تھے۔ ان کے شہر باقاعدہ نقشے کے مطابق بنائے گئے تھے، جن میں سیدھی گلیاں، پکی اینٹوں کے مکان اور ڈھکی ہوئی نالیاں شامل تھیں۔ بہت سے گھروں میں کنویں اور غسل خانے تھے، جو اُس دور کے لحاظ سے حیرت انگیز سہولتیں تھیں۔\n\nیہ لوگ تجارت میں بھی آگے تھے۔ کھدائی سے ملنے والی مہریں اور وزن کرنے کے یکساں باٹ اس بات کا ثبوت ہیں کہ ان کا کاروبار منظم تھا۔ ان کی مصنوعات دور دراز علاقوں تک پہنچتی تھیں۔ البتہ ان کی تحریر آج تک ایک معما ہے، کیونکہ ماہرین اسے پڑھنے میں کامیاب نہیں ہو سکے۔\n\nتقریباً 1900 قبل مسیح کے بعد یہ تہذیب آہستہ آہستہ زوال پذیر ہو گئی۔ ماہرین کے خیال میں موسم کی تبدیلی، دریاؤں کے راستے بدلنا اور سیلاب اس کی ممکنہ وجوہات تھیں۔ اس کے باوجود اس کے کھنڈرات آج بھی ہمیں اپنے شاندار ماضی کی یاد دلاتے ہیں۔","modelSummary":"ساڑھے چار ہزار سال پہلے دریائے سندھ کے کنارے ایک ترقی یافتہ تہذیب آباد تھی جس کے بڑے شہر موئن جو دڑو اور ہڑپہ تھے۔ اس کے لوگ منصوبہ بندی کے ماہر تھے؛ ان کے شہروں میں سیدھی گلیاں، پکی اینٹوں کے گھر ا  موجود چیزوں سے ٹکرا کر واپس آتی ہیں۔ ان گونجوں کو سن کر یہ جان لیتی ہے کہ مچھلی کہاں ہے یا راستے میں کوئی رکاوٹ ہے۔ یہ چند منٹ بعد سانس لینے کے لیے سطح پر آتی ہے، جس سے دریا کے کنارے کھڑے لوگ اسے دیکھ پاتے ہیں۔\n\nپچھلی صدی میں انسانی سرگرمیوں نے اس کی بقا کو خطرے میں ڈال دیا۔ آبپاشی کے لیے بنائے گئے بیراجوں نے دریا کو ٹکڑوں میں بانٹ دیا اور ڈولفنوں کے گروہ ایک دوسرے سے جدا ہو گئے۔ کیمیکل ملا پانی دریا میں آنے لگا اور خشک موسم میں پانی کی کمی نے مشکلات بڑھا دیں۔ سب سے زیادہ ڈولفنیں نہروں میں پھنس کر مر جاتی تھیں۔\n\nاب حالات کچھ بہتر ہیں۔ حکومت اور غیر سرکاری تنظیموں نے ایک محفوظ علاقہ بنایا ہے، شکار پر پابندی لگائی ہے اور ریسکیو ٹیمیں تیار کی ہیں جو پھنسی ہوئی ڈولفنوں کو بچاتی ہیں۔ ان کوششوں سے ڈولفنوں کی تعداد میں اضافہ ہوا ہے، لیکن ماہرین کہتے ہیں کہ دریا کو صاف رکھے بغیر یہ کامیابی برقرار نہیں رہ سکتی۔","modelSummary":"دریائے سندھ کی ڈولفن صرف پاکستان میں پائی جاتی ہے اور گدلے پانی کی وجہ سے تقریباً نابینا ہے، اس لیے آوازوں کی گونج سے شکار اور راستہ ڈھونڈتی ہے۔ بیراجوں نے اس کی آبادی کو تقسیم کیا، آلودگی اور پانی کی کمی نے نقصان پہنچایا اور بہت سی ڈولفنیں نہروں میں پھنس کر مر گئیں۔ محفوظ علاقے، شکار پر پابندی اور ریسکیو ٹیموں کی بدولت اب ان کی تعداد بڑھی ہے، مگر یہ کامیابی دریا کو صاف رکھنے سے ہی قائم رہ سکتی ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے ڈولفن کی خاص صلاحیت، خطرات اور تحفظ — تینوں کا ذکر کیا؟","کیا آپ نے آخری انتباہ (دریا صاف رکھنے کی ضرورت) شامل کیا؟","کیا آپ نے اپنے الفاظ استعمال کیے؟"]},{"id":"khewra-salt-mine-history","ur":"کھیوڑہ — نمک کا خزانہ","en":"Khewra — A Treasure of Salt","passage":"پنجاب کے ضلع جہلم میں کوہِ نمک کے دامن میں کھیوڑہ کی مشہور کان واقع ہے، جسے دنیا کی دوسری بڑی نمک کی کان قرار دیا جاتا ہے۔ یہاں سے نکلنے والا گلابی نمک نہ صرف پاکستان بلکہ دنیا بھر میں استعمال ہوتا ہے۔\n\nاس کان کی دریافت کے بارے میں ایک دلچسپ روایت مشہور ہے۔ کہا جاتا ہے کہ جب سکندرِ اعظم کی فوج اس علاقے سے گزری تو سپاہیوں نے دیکھا کہ ان کے گھوڑے بار بار چٹانوں کو چاٹ رہے ہیں۔ جب انہوں نے خود چٹان چکھی تو اس کا ذائقہ نمکین نکلا۔ بعد میں مقامی لوگوں اور پھر مغل حکمرانوں نے یہاں سے باقاعدہ نمک نکالنا شروع کیا۔\n\nانیسویں صدی میں ایک انگریز ماہر نے کان کنی کا ایسا طریقہ متعارف کرایا جو آج تک استعمال ہوتا ہے۔ اس طریقے میں نمک کا آدھا حصہ نکال لیا جاتا ہے اور آدھا ستونوں کی شکل میں چھوڑ دیا جاتا ہے تاکہ پہاڑ کا بوجھ سنبھالا جا سکے۔ اس طرح کان کے اندر ہال نما کمرے اور کئی کلومیٹر لمبی سرنگیں بن گئی ہیں۔\n\nآج کھیوڑہ ایک بڑا سیاحتی مرکز بھی ہے۔ سیاح ریل گاڑی کے ذریعے کان کے اندر جاتے ہیں اور نمک کی مسجد، نمک کا پل اور روشنیوں سے جگمگاتی چٹانیں دیکھتے ہیں۔ یہاں دمے کے مریضوں کے لیے ایک کلینک بھی ہے، کیونکہ نمکین ہوا کو سانس کے لیے مفید سمجھا جاتا ہے۔","modelSummary":"ضلع جہلم میں واقع کھیوڑہ دنیا کی دوسری بڑی نمک کی کان ہے جس کا گلابی نمک دنیا بھر میں استعمال ہوتا ہے۔ روایت ہے کہ سکندر کی فوج کے گھوڑوں کے چٹانیں چاٹنے سے یہ دریافت ہوئی، اور بعد میں مغلوں نے یہاں باقاعدہ کان کنی شروع کی۔ انیسویں صدی سے آدھا نمک نکال کر آدھا ستونوں کی صورت میں چھوڑا جاتا ہے، جس سے بڑے ہال اور سرنگیں بنی ہیں۔ آج یہاں سیاح نمک کی مسجد اور دیگر عجائبات دیکھنے آتے ہیں اور دمے کا کلینک بھی ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے دریافت کی روایت، کان کنی کا طریقہ اور سیاحت — تینوں شامل کیے؟","کیا آپ نے روایت کی تفصیل (چکھنا وغیرہ) مختصر کر دی؟","کیا آپ نے اپنے الفاظ استعمال کیے؟"]},{"id":"amazon-lungs-of-earth","ur":"ایمیزون — زمین کے پھیپھڑے","en":"The Amazon — The Lungs of the Earth","passage":"جنوبی امریکہ کا ایمیزون دنیا کا سب سے بڑا برساتی جنگل ہے۔ یہ اتنا وسیع ہے کہ اس میں کئی ملک سما سکتے ہیں۔ یہاں سال بھر گرم اور مرطوب موسم رہتا ہے اور اتنی بارش ہوتی ہے کہ جنگل ہمیشہ سرسبز رہتا ہے۔ دریائے ایمیزون، جو دنیا میں سب سے زیادہ پانی بہانے والا دریا ہے، اسی جنگل کے بیچ سے گزرتا ہے۔\n\nاس جنگل کی سب سے بڑی دولت اس کا حیاتیاتی تنوع ہے۔ یہاں رنگین پرندوں، کیڑوں، مچھلیوں، بندروں اور جیگوار جیسے لاکھوں جانداروں کا مسکن ہے، جن میں سے بہت سے دنیا میں کہیں اور نہیں پائے جاتے۔ سائنس دانوں کا خیال ہے کہ یہاں ایسی ہزاروں انواع بھی موجود ہیں جو ابھی تک دریافت نہیں ہوئیں۔\n\nایمیزون پوری دنیا کی آب و ہوا کے لیے بھی اہم ہے۔ اس کے درخت فضا میں موجود کاربن ڈائی آکسائیڈ کو جذب کرتے ہیں اور آکسیجن خارج کرتے ہیں۔ اسی لیے اسے ‘زمین کے پھیپھڑے’ کہا جاتا ہے۔ اس کے علاوہ اس جنگل کے پودوں سے کئی قیمتی دوائیں تیار کی گئی ہیں۔\n\nلیکن یہ قیمتی جنگل خطرے میں ہے۔ مویشیوں کی چراگاہوں، فصلوں اور لکڑی کے لیے ہر سال بڑے پیمانے پر درخت کاٹے جاتے ہیں، اور جان بوجھ کر لگائی گئی آگ مزید تباہی پھیلاتی ہے۔ اگر اس تباہی کو نہ روکا گیا تو جانور ختم ہو جائیں گے، مقامی لوگ بے گھر ہو جائیں گے اور زمین کا درجہ حرارت مزید بڑھ جائے گا۔","modelSummary":"جنوبی امریکہ کا ایمیزون دنیا کا سب سے بڑا برساتی جنگل ہے جہاں سال بھر گرمی اور بارش رہتی ہے اور دریائے ایمیزون بہتا ہے۔ یہ لاکھوں جانداروں کا گھر ہے جن میں سے کئی کہیں اور نہیں ملتے۔ اس کے درخت کاربن ڈائی آکسائیڈ جذب کر کے آکسیجن دیتے ہیں اور اس کے پودوں سے دوائیں بنتی ہیں۔ مگر چراگاہوں، فصلوں، لکڑی اور آگ کی وجہ سے یہ تباہ ہو رہا ہے، جس سے جانداروں، مقامی لوگوں اور زمین کی آب و ہوا کو خطرہ ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے جنگل کی خصوصیات، اہمیت اور خطرات — تینوں شامل کیے؟","کیا آپ نے جانوروں کے ناموں کی لمبی فہرست کے بجائے عمومی الفاظ استعمال کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے؟"]},{"id":"helen-keller-courage","ur":"ہیلن کیلر — اندھیرے سے روشنی تک","en":"Helen Keller — From Darkness to Light","passage":"ہیلن کیلر کی زندگی اس بات کا ثبوت ہے کہ بلند حوصلہ انسان کو ہر مشکل پر غالب آنا سکھا دیتا ہے۔ وہ 1880ء میں امریکہ میں پیدا ہوئیں اور ابتدا میں ایک عام صحت مند بچی تھیں۔ لیکن ڈیڑھ سال کی عمر میں ایک شدید بیماری نے ان سے دیکھنے اور سننے کی صلاحیت چھین لی۔\n\nاس کے بعد کے چند سال ہیلن کے لیے بہت مشکل تھے۔ وہ نہ کسی کی بات سمجھ سکتی تھیں اور نہ اپنی بات سمجھا سکتی تھیں۔ اس بے بسی کی وجہ سے وہ اکثر غصے میں چیخنے چلانے لگتیں۔ ان کے والدین ان کے مستقبل کے بارے میں بہت پریشان تھے۔\n\nسات سال کی عمر میں ان کی زندگی میں این سلیوان نامی استانی آئیں، جو خود بھی کمزور بینائی کا شکار رہ چکی تھیں۔ این نے بے پناہ صبر کے ساتھ ہیلن کی ہتھیلی پر حروف بنا کر انہیں الفاظ سکھانے شروع کیے۔ ایک دن پانی کے نلکے کے پاس ہیلن کو پہلی بار احساس ہوا  وقت جانیں بچاتا ہے۔","modelSummary":"زلزلہ بغیر اطلاع کے آتا ہے، اور پاکستان کے شمالی علاقے دو پلیٹوں کے سنگم پر ہونے کی وجہ سے اکثر اس کی زد میں رہتے ہیں۔ 2005ء کے زلزلے میں ہزاروں جانیں گئیں، جن کی بڑی وجہ کمزور عمارتیں تھیں۔ زلزلہ روکا نہیں جا سکتا مگر زلزلہ مزاحم عمارتوں، درست ردِعمل یعنی جھکنے، پناہ لینے اور تھامے رکھنے، ہنگامی بیگ اور باقاعدہ مشقوں سے نقصان کم کیا جا سکتا ہے۔ تیاری ہی جانیں بچاتی ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے 2005ء کے زلزلے کا سبق اور تیاری کے طریقے — دونوں شامل کیے؟","کیا آپ نے ہنگامی بیگ کی چیزوں کی فہرست کے بجائے مختصر ذکر کیا؟","کیا آپ نے اپنے الفاظ استعمال کیے؟"]},{"id":"heatwaves-in-pakistan","ur":"پاکستان میں گرمی کی لہریں","en":"Heatwaves in Pakistan","passage":"پچھلے چند برسوں میں پاکستان میں گرمیوں کا موسم پہلے سے کہیں زیادہ سخت ہو گیا ہے۔ اب گرمی کی لہریں نہ صرف زیادہ شدید ہوتی ہیں بلکہ زیادہ دن تک بھی رہتی ہیں۔ جیکب آباد اور دادو جیسے شہروں میں درجۂ حرارت پچاس ڈگری سے تجاوز کر جاتا ہے، جبکہ کراچی جیسے ساحلی شہر میں بھی نمی کے باعث گرمی ناقابلِ برداشت ہو جاتی ہے۔\n\nماہرین کے مطابق اس کی بنیادی وجہ عالمی موسمیاتی تبدیلی ہے، لیکن کچھ ذمہ داری ہماری اپنی بھی ہے۔ شہروں میں درخت تیزی سے کاٹے جا رہے ہیں اور ان کی جگہ کنکریٹ کی عمارتیں اور سڑکیں لے رہی ہیں۔ یہ کنکریٹ دن بھر سورج کی حرارت جذب کرتا ہے اور رات کو بھی ماحول کو گرم رکھتا ہے۔\n\nگرمی کی لہر کا سب سے برا اثر غریب اور کمزور طبقے پر پڑتا ہے۔ مزدور، رکشہ ڈرائیور اور کسان دھوپ میں کام کرنے پر مجبور ہوتے ہیں، جبکہ بزرگ اور بچے ہیٹ اسٹروک کا جلد شکار ہو جاتے ہیں۔ 2015ء میں کراچی کی گرمی کی لہر اس کی ایک دردناک مثال ہے۔\n\nاس مسئلے کا حل صرف حکومت کے پاس نہیں۔ ہر شہری کو زیادہ پانی پینے، دوپہر کی دھوپ سے بچنے اور اپنے اردگرد کے لوگوں کا خیال رکھنے کی عادت ڈالنی چاہیے۔ ساتھ ہی بڑے پیمانے پر شجرکاری، اسپتالوں میں ہیٹ اسٹروک سینٹرز اور بروقت انتباہی نظام ہمارے شہروں کو اس آفت سے محفوظ بنا سکتے ہیں۔","modelSummary":"پاکستان میں گرمی کی لہریں اب زیادہ شدید اور طویل ہو گئی ہیں، اور بعض شہروں میں درجۂ حرارت پچاس ڈگری سے بڑھ جاتا ہے۔ اس کی بڑی وجہ موسمیاتی  تو شاہی قلعہ آپ کو ہرگز مایوس نہیں کرے گا۔ اگلی بار لاہور آئیں تو اسے اپنی فہرست میں سب سے اوپر رکھیں۔\n\nآپ میں سے کون کون یہاں جا چکا ہے؟ اپنے تجربات نیچے کمنٹس میں ضرور لکھیں!","checklist":["کیا آپ کی بلاگ پوسٹ کا ایک دلچسپ عنوان ہے؟","کیا انداز دوستانہ اور قارئین سے براہِ راست مخاطب ہے؟","کیا آپ نے تینوں حصوں — پسندیدہ چیز، مشورے، دیکھنے کے لائق ہونا — کا جواب دیا؟","کیا آپ نے ربط کے الفاظ (سب سے پہلے، دوسرا، تیسرا) استعمال کیے؟","کیا املا اور رموزِ اوقاف درست ہیں؟","کیا آپ کی تحریر تقریباً 200 الفاظ پر مشتمل ہے؟"]},{"id":"email-cousin-kkh-road-trip","ur":"شاہراہِ قراقرم کے سفر کے بارے میں کزن کو ای میل","en":"Email to a Cousin about a Karakoram Highway Road Trip","prompt":{"ur":"آپ کا کزن بیرونِ ملک رہتا ہے اور اگلی گرمیوں میں پاکستان آ کر آپ کے ساتھ شاہراہِ قراقرم پر سفر کرنا چاہتا ہے۔ اسے ایک ای میل لکھیں جس میں درج ذیل نکات شامل ہوں۔","en":"Your cousin lives abroad and wants to travel the Karakoram Highway with you next summer. Write him an email including the points below.","points":["سفر کا مجوزہ راستہ اور دیکھنے کی جگہیں","سفر کی تیاری کے لیے ضروری چیزیں","اس سفر کے بارے میں آپ کیوں پُرجوش ہیں"],"words":150,"purpose":"To plan and inform","format":"Informal email","audience":"A cousin living abroad"},"modelResponse":"برائے: bilal.cousin@example.com\nعنوان: ہمارا قراقرم کا سفر!\n\nپیارے بلال بھائی!\nالسلام علیکم!\n\nآپ کی ای میل پڑھ کر بہت خوشی ہوئی کہ آپ اگلی گرمیوں میں پاکستان آ رہے ہیں۔ میں نے ہمارے سفر کا خاکہ تیار کر لیا ہے۔ ہم اسلام آباد سے روانہ ہو کر پہلی رات چلاس میں گزاریں گے، پھر گلگت اور ہنزہ جائیں گے۔ وہاں بلتت قلعہ اور عطا آباد جھیل دیکھیں گے اور آخر میں خنجراب پاس تک جائیں گے۔\n\nتیاری کے لیے گرم جیکٹ، آرام دہ جوتے اور دھوپ کی عینک ضرور لائیں، کیونکہ خنجراب پر گرمیوں میں بھی سخت سردی ہوتی ہے۔ اپنا پاسپورٹ بھی ہر وقت ساتھ رکھنا ہوگا کیونکہ راستے میں چیک پوسٹیں ہیں۔\n\nمیں اس سفر کے لیے بہت پُرجوش ہوں کیونکہ میں نے بھی آج تک خنجراب نہیں دیکھا، اور آپ کے ساتھ یہ یادگار سفر کرنے کا مزہ ہی کچھ اور ہوگا۔\n\nآپ کے جواب کا انتظار رہے گا۔\n\nآپ کا چھوٹا بھائی،\nعلی","checklist":["کیا آپ نے ای میل کا درست خاکہ (برائے، عنوان، القاب، سلام، اختتامیہ) استعمال کیا؟","کیا آپ نے راستہ اور کم از کم دو دیکھنے کی جگہیں بیان کیں؟","کیا آپ نے تیاری کے لیے ضروری چیزیں وجہ کے ساتھ بتائیں؟","کیا آپ نے اپنے جوش کی وجہ بیان کی؟","کیا انداز رشتے کے مطابق ہے (بڑے کزن کے لیے ‘آپ’)؟","کیا آپ کی ای میل تقریباً 150 الفاظ پر مشتمل ہے؟"]},{"id":"formal-email-deosai-camp","ur":"دیوسائی میں کیمپنگ کی اجازت کے لیے رسمی ای میل","en":"Formal Email Asking about a School Camping Trip to Deosai","prompt":{"ur":"آپ کا اسکول گرمیوں میں دیوسائی نیشنل پارک میں دو روزہ کیمپ لگانا چاہتا ہے۔ اسکول کی ایڈونچر کلب کے صدر کی حیثیت سے پارک کے دفتر کے انچارج کو ایک رسمی ای میل لکھیں جس میں درج ذیل نکات شامل ہوں۔","en":"Your school wants to hold a two-day camp in Deosai National Park in summer. As president of the school adventure club, write a formal email to the officer in charge of the park office, including the points below.","points":["کیمپ کا مقصد اور طلبہ کی تعداد","آپ کون سی معلومات یا اجازت چاہتے ہیں","طلبہ پارک کے قواعد کی پابندی کیسے کریں گے"],"words":150,"purpose":"To request information and permission","format":"Formal email","audience":"The officer in charge of the national park office"},"modelResponse":"برائے: info@deosaipark.example.pk\nعنوان: اسکول کے دو روزہ کیمپ کے بارے میں معلومات\n\nمحترم انچارج صاحب!\nالسلام علیکم!\n\nمیں یہ ای میل گرین ویلی اسکول، اسلام آباد کی ایڈونچر کلب کی جانب سے لکھ رہی ہوں۔ ہم جولائی کے آخری ہفتے میں دیوسائی نیشنل پارک میں دو روزہ تعلیمی کیمپ لگانا چاہتے ہیں۔ اس کیمپ کا مقصد طلبہ کو جنگلی حیات اور قدرتی ماحول کی اہمیت سے روشناس کرانا ہے۔ ہمارے ساتھ نویں اور دسویں جماعت کے پچیس طلبہ اور چار اساتذہ ہوں گے۔\n\nبراہِ کرم ہمیں بتائیں کہ گروپ کیمپنگ کے لیے کون سے مقامات مخصوص ہیں، فیس کتنی ہوگی اور کیا پیشگی اجازت نامہ لینا ضروری ہے۔ اگر ممکن ہو تو کسی گائیڈ کی خدمات کے بارے میں بھی آگاہ کریں۔\n\nمیں یقین دلاتی ہوں کہ ہمارے طلبہ پارک کے تمام قواعد کی سختی سے پابندی کریں گے۔ وہ اپنا تمام کچرا واپس لائیں گے، آگ نہیں جلائیں گے اور جانوروں سے مناسب فاصلہ رکھیں گے۔\n\nآپ کے جواب کا منتظر رہوں گی۔\n\nخیر اندیش،\nمریم احمد\nصدر، ایڈونچر کلب","checklist":["کیا آپ نے رسمی ای میل کا خاکہ (برائے، عنوان، محترم، سلام، خیر اندیش) استعمال کیا؟","کیا آپ نے کیمپ کا مقصد اور طلبہ کی تعداد واضح طور پر بتائی؟","کیا آپ نے مطلوبہ معلومات یا اجازت مہذب انداز میں مانگی (براہِ کرم، اگر ممکن ہو)؟","کیا آپ نے قواعد کی پابندی کی یقین دہانی مثالوں کے ساتھ کرائی؟","کیا پوری ای میل کا لہجہ رسمی ہے (آپ، محترم) اور غیر رسمی الفاظ سے پاک ہے؟","کیا آپ کی ای میل تقریباً 150 الفاظ پر مشتمل ہے؟"]},{"id":"article-life-in-the-desert","ur":"صحرا کی زندگی — میگزین کے لیے مضمون","en":"Life in the Desert — Magazine Article","prompt":{"ur":"آپ کے اسکول کا میگزین ‘پاکستان کے مختلف علاقوں کی زندگی’ پر ایک خصوصی شمارہ شائع کر رہا ہے۔ چولستان کے صحرا میں رہنے والوں کی زندگی پر ایک مضمون لکھیں جس میں ان کی مشکلات، ان کے رہن سہن اور ان کی مدد کے طریقوں پر روشنی ڈالیں۔ تقریباً 200 الفاظ میں لکھیں۔","en":"Your school magazine is publishing a special issue on ‘Life in different regions of Pakistan’. Write an article about life in the Cholistan desert, covering the difficulties people face, their way of life, and ways to help them. Write about 200 words.","purpose":"To inform and persuade","format":"Magazine article","audience":"Students and teachers who read the school magazine"},"modelResponse":"ریت کے سمندر میں زندگی\n\nجب ہم شہروں میں نلکا کھولتے ہیں تو صاف پانی بہنے لگتا ہے، لیکن کیا آپ نے کبھی سوچا ہے کہ چولستان کے صحرا میں رہنے والوں کے لیے پانی کا ایک گھڑا کتنا قیمتی ہے؟\n\nچولستان کے لوگوں کو قدم قدم پر مشکلات کا سامنا ہے۔ گرمیوں میں درجہ حرارت پچاس ڈگری تک پہنچ جاتا ہے اور سال بھر میں بارش بمشکل چند بار ہوتی ہے۔ خواتین اور بچوں کو اکثر کئی کلومیٹر پیدل چل کر پانی لانا پڑتا ہے۔ اسکول اور اسپتال دور ہونے کی وجہ سے تعلیم اور علاج بھی آسانی سے میسر نہیں۔\n\nاس کے باوجود یہاں کے لوگ ہمت نہیں ہارتے۔ وہ بارش کا پانی ٹوبوں میں جمع کرتے ہیں، اونٹ اور بکریاں پالتے ہیں اور مٹی اور گھاس سے ایسی جھونپڑیاں بناتے ہیں جو گرمی میں ٹھنڈی رہتی ہیں۔ ان کی خواتین کی بنائی ہوئی رلیاں اور کڑھائی والے کپڑے اپنی خوبصورتی کی وجہ سے مشہور ہیں۔\n\nہم طلبہ بھی ان کی مدد کر سکتے ہیں۔ سب سے پہلے، ہم پانی ضائع کرنا چھوڑ دیں اور اس کی قدر کریں۔ دوسرا، ہم اپنے اسکول میں فنڈ جمع کر کے صحرائی علاقوں میں پانی کے فلٹر لگانے والی تنظیموں کی مدد کر سکتے ہیں۔ تیسرا، چولستانی دستکاریاں خرید کر ہم ان کی آمدنی بڑھا سکتے ہیں۔\n\nآئیے، ہم یاد رکھیں کہ ریت کے اس سمندر میں بسنے والے بھی ہمارے ہم وطن ہیں اور ان کی مدد کرنا ہمارا فرض ہے۔","checklist":["کیا آپ کے مضمون کا دلچسپ عنوان اور قاری کو متوجہ کرنے والا آغاز ہے؟","کیا آپ نے مشکلات، رہن سہن اور مدد کے طریقے — تینوں پر الگ پیراگراف لکھے؟","کیا آپ نے ربط کے الفاظ (اس کے باوجود، سب سے پہلے، دوسرا) استعمال کیے؟","کیا انداز قارئین (طلبہ اور اساتذہ) کو قائل کرنے والا ہے؟","کیا املا، گرامر اور رموزِ اوقاف درست ہیں؟","کیا آپ کی تحریر تقریباً 200 الفاظ پر مشتمل ہے؟"]},{"id":"report-wildlife-club-talk","ur":"وائلڈ لائف کلب کی تقریب کی رپورٹ","en":"Report on a Wildlife Club Talk","prompt":{"ur":"آپ کے اسکول کی وائلڈ لائف کلب نے ایک تقریب منعقد کی جس میں محکمہ جنگلی حیات کے ایک افسر نے مارخور کے تحفظ پر گفتگو کی۔ اسکول کے نیوز لیٹر کے لیے اس تقریب کی رپورٹ لکھیں جس میں تقریب کی تفصیل، افسر کی گفتگو کے اہم نکات اور طلبہ کے ردِعمل کا ذکر ہو۔ تقریباً 200 الفاظ میں لکھیں۔","en":"Your school's wildlife club held an event at which an officer from the wildlife department spoke about protecting the markhor. Write a report for the school newsletter describing the event, the main points of the talk, and how students responded. Write about 200 words.","purpose":"To inform","format":"Report (school newsletter)","audience":"Students, parents and teachers"},"modelResponse":"مارخور کی کہانی، ماہر کی زبانی\n\nگزشتہ جمعرات کو اسکول کی وائلڈ لائف کلب کے زیرِ اہتمام آڈیٹوریم میں ایک معلوماتی تقریب منعقد ہوئی۔ تقریب کے مہمانِ خصوصی محکمہ جنگلی حیات کے ڈویژنل افسر جناب کامران علی تھے۔ اس موقع پر ساتویں سے دسویں جماعت کے تقریباً ڈیڑھ سو طلبہ اور کئی اساتذہ موجود تھے۔\n\nکامران صاحب نے سلائیڈز کی مدد سے بتایا کہ مارخور ہمارا قومی جانور ہے اور کچھ عرصہ پہلے غیر قانونی شکار اور جنگلات کی کٹائی کی وجہ سے معدومی کے قریب پہنچ گیا تھا۔ انہوں نے وضاحت کی کہ محدود اور قانونی شکار سے حاصل ہونے والی آمدنی مقامی دیہات پر خرچ کی گئی، جس کے بعد لوگوں نے خود جانوروں کی حفاظت شروع کر دی۔ ان کے مطابق آج کئی علاقوں میں مارخوروں کی تعداد پہلے سے کہیں زیادہ ہے۔\n\nگفتگو کے بعد سوال و جواب کا سیشن ہوا جس میں طلبہ نے بڑھ چڑھ کر حصہ لیا۔ ایک طالب علم نے پوچھا کہ عام شہری کیا کر سکتے ہیں، جس پر افسر نے جنگلی جانوروں کی غیر قانونی تجارت کی اطلاع دینے اور آگاہی پھیلانے کا مشورہ دیا۔\n\nتقریب کے آخر میں کلب کی صدر نے مہمان کا شکریہ ادا کیا اور اعلان کیا کہ اگلے ماہ کلب ‘جنگلی حیات بچاؤ’ کے موضوع پر پوسٹر مقابلہ منعقد کرے گی۔ طلبہ کی رائے میں یہ تقریب بے حد مفید اور دلچسپ رہی۔","checklist":["کیا آپ کی رپورٹ میں دلچسپ سرخی اور واضح تعارف (کب، کہاں، کون) ہے؟","کیا آپ نے افسر کی گفتگو کے کم از کم دو اہم نکات بیان کیے؟","کیا آپ نے طلبہ کے ردِعمل اور سوال و جواب کا ذکر کیا؟","کیا رپورٹ زمانۂ ماضی میں اور رسمی انداز میں لکھی گئی ہے؟","کیا پیراگراف مربوط ہیں اور ربط کے الفاظ استعمال ہوئے ہیں؟","کیا آپ کی تحریر تقریباً 200 الفاظ پر مشتمل ہے؟"]},{"id":"email-editor-dolphins-canals","ur":"نہروں میں پھنسی ڈولفنوں پر مدیر کو ای میل","en":"Email to a Newspaper Editor about Dolphins in Canals","prompt":{"ur":"آپ نے پڑھا ہے کہ ہر سال کئی ڈولفنیں نہروں میں پھنس جاتی ہیں۔ ایک روزنامے کے مدیر کو رسمی ای میل لکھیں جس میں درج ذیل نکات شامل ہوں۔","en":"You have read that every year several dolphins get trapped in canals. Write a formal email to the editor of a daily newspaper including the points below.","points":["یہ مسئلہ کیا ہے اور کیوں تشویشناک ہے","حکومت اور متعلقہ اداروں کے لیے آپ کی تجاویز","عام شہری اس سلسلے میں کیا کردار ادا کر سکتے ہیں"],"words":150,"purpose":"To raise awareness and suggest solutions","format":"Formal email to a newspaper editor","audience":"The editor and readers of a newspaper"},"modelResponse":"برائے: editor@dailynews.example.pk\nعنوان: نہروں میں پھنسنے والی ڈولفنوں کا مسئلہ\n\nمحترم مدیر school.example.pk\nعنوان: اسکول میں زلزلے کی مشق کی درخواست\n\nواجبِ احترام پرنسپل صاحبہ!\nالسلام علیکم!\n\nمیں اسٹوڈنٹ کونسل کی جانب سے یہ ای میل ایک اہم تجویز کے ساتھ لکھ رہی ہوں۔ ہمارا شہر زلزلے والے علاقے میں واقع ہے، لیکن ہمارے اسکول میں آج تک زلزلے کی کوئی مشق نہیں ہوئی۔ اگر خدانخواستہ زلزلہ آئے تو گھبراہٹ اور بھگدڑ سے بڑا نقصان ہو سکتا ہے، اس لیے طلبہ کو درست طریقہ جاننا ضروری ہے۔\n\nمیری تجویز ہے کہ مقامی ریسکیو 1122 کے کسی اہلکار کو مدعو کیا جائے جو پہلے ایک مختصر لیکچر دیں۔ اس کے بعد گھنٹی بجا کر تمام کلاسوں میں ‘جھکیں، ڈھانپیں، تھامے رکھیں’ کی مشق کرائی جائے اور پھر طلبہ کو ترتیب سے کھیل کے میدان میں جمع کیا جائے۔\n\nاسٹوڈنٹ کونسل کے اراکین ہر منزل پر رہنمائی کر سکتے ہیں، طلبہ کی گنتی میں مدد دے سکتے ہیں اور آگاہی کے پوسٹر بھی بنا سکتے ہیں۔\n\nامید ہے آپ اس تجویز پر غور فرمائیں گی۔\n\nآپ کی فرماں بردار شاگرد،\nعائشہ ملک\nنمائندہ، اسٹوڈنٹ کونسل","checklist":["کیا آپ نے پرنسپل کے لیے موزوں القاب اور اختتامیہ (واجبِ احترام، آپ کی فرماں بردار شاگرد) استعمال کیا؟","کیا آپ نے مشق کی ضرورت وجہ کے ساتھ بیان کی؟","کیا آپ نے مشق کا طریقہ ترتیب وار (پہلے، اس کے بعد، پھر) بتایا؟","کیا آپ نے اسٹوڈنٹ کونسل کے کردار کی وضاحت کی؟","کیا لہجہ مہذب اور رسمی ہے (غور فرمائیں گی)؟","کیا آپ کی ای میل تقریباً 150 الفاظ پر مشتمل ہے؟"]},{"id":"formal-email-heatwave-water-points","ur":"بلدیہ کو ای میل: ٹھنڈے پانی کے مراکز","en":"Formal Email to the Municipal Officer: Drinking-Water Points","prompt":{"ur":"آپ کے علاقے میں شدید گرمی ہے اور بازار میں پینے کے پانی کا کوئی انتظام نہیں۔ بلدیہ کے افسر کو ایک رسمی ای میل لکھیں جس میں درج ذیل نکات شامل ہوں۔","en":"There is a severe heatwave in your area and the market has no drinking water. Write a formal email to the municipal officer including the points below.","points":["علاقے میں لوگوں کو کیا مشکلات پیش آ رہی ہیں","آپ بلدیہ سے کیا اقدامات چاہتے ہیں","علاقے کے نوجوان کس طرح مدد کر سکتے ہیں"],"words":150,"purpose":"To complain politely and request action","format":"Formal email","audience":"The municipal officer"},"modelResponse":"برائے: /* ======================================================================
   DIFFICULTY
   Easy = fewer options + a hint, so a struggling learner still gets a win.
   Medium = the original v1 experience.
   Hard = more options, no hints, plus one open-ended "Creative Corner" or
   reflective task at the end (self-checked, not auto-graded — free Urdu
   writing can't be marked reliably by this app).
   ====================================================================== */
const LEVELS = [
  { key:"easy",   en:"Easy",   ur:"آسان" },
  { key:"medium", en:"Medium", ur:"درمیانہ" },
  { key:"hard",   en:"Hard",   ur:"مشکل" }
];
function levelCfg(level){
  if(level==="easy")   return { quizCount:4, optCount:2, hint:true,  creative:false };
  if(level==="hard")   return { quizCount:8, optCount:4, hint:false, creative:true  };
  return                      { quizCount:6, optCount:4, hint:false, creative:false }; // medium
}
// Trims an options array down to `count` choices while keeping the correct
// one in the set, and returns the correct answer's new index.
function sliceOptions(opts, correctIdx, count){
  if(count>=opts.length) return { opts:opts.slice(), a:correctIdx };
  const correctVal = opts[correctIdx];
  const others = opts.filter((_,i)=>i!==correctIdx).sort(()=>Math.random()-0.5).slice(0, Math.max(0,count-1));
  const finalOpts = others.concat([correctVal]).sort(()=>Math.random()-0.5);
  return { opts:finalOpts, a: finalOpts.indexOf(correctVal) };
}

/* ======================================================================
   PROGRESS  (localStorage — per-device, no login)
   ====================================================================== */
const STORE_KEY = "urdu-safar-progress-v1";
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(p){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();
function sectionStars(topicId, sectionKey){
  const p = progress[topicId] && progress[topicId][sectionKey];
  return p ? p.stars : 0;
}
function setSectionResult(topicId, sectionKey, correct, total){
  if(!progress[topicId]) progress[topicId] = {};
  const pct = total ? correct/total : 0;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  progress[topicId][sectionKey] = { correct, total, stars, done:true };
  saveProgress(progress);
  refreshPlayerLeaderboardEntry();
}
function topicTotalStars(topicId){
  return SECTIONS.reduce((s,sec)=> s + sectionStars(topicId, sec.key), 0);
}
function isTopicMastered(topicId){
  return SECTIONS.every(sec => sectionStars(topicId, sec.key) >= 2);
}
function overallStars(){
  return TOPICS.reduce((s,t)=> s + topicTotalStars(t.id), 0);
}
function masteredCount(){
  return TOPICS.filter(t=>isTopicMastered(t.id)).length;
}
// Writing-prompt completion, used only by the Skills feature (free-write
// prompts aren't auto-graded, so they're tracked as done/not-done, not stars).
function markPromptDone(skillId, idx){
  if(!progress[skillId]) progress[skillId] = {};
  if(!progress[skillId].prompts) progress[skillId].prompts = {};
  progress[skillId].prompts[idx] = true;
  saveProgress(progress);
}
function isPromptDone(skillId, idx){
  return !!(progress[skillId] && progress[skillId].prompts && progress[skillId].prompts[idx]);
}
function promptsDoneCount(skillId){
  const skill = SKILLS.find(s=>s.id===skillId);
  const n = skill ? skill.prompts.length : 0;
  let done = 0;
  for(let i=0;i<n;i++) if(isPromptDone(skillId,i)) done++;
  return done;
}

/* ======================================================================
   PLAYER + LEADERBOARD
   "Sign up" is just a nickname, stored on this device — always available,
   works fully offline, no account needed. Every finished section earns a
   medal (gold=3 stars, silver=2, bronze=1); a local leaderboard on this
   device always works, so more than one learner sharing the same device
   can compare medals. Signing into a real account (Firebase Auth, see
   ACCOUNTS + FRIEND GROUPS below) additionally lets someone create or
   join one real friend group whose members' medals sync through Cloud
   Firestore, for a leaderboard that works across separate devices.
   ====================================================================== */
const PLAYER_KEY = "urdu-safar-player-v1";
function loadPlayer(){
  try{
    const raw = localStorage.getItem(PLAYER_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function savePlayer(p){
  try{ localStorage.setItem(PLAYER_KEY, JSON.stringify(p)); }catch(e){}
}
function newPlayerId(){
  try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  return "p" + Date.now() + "-" + Math.random().toString(36).slice(2);
}
let player = loadPlayer();

function medalForStars(stars){
  return stars===3 ? "gold" : stars===2 ? "silver" : stars===1 ? "bronze" : null;
}
function computeMedalTotals(){
  let gold=0, silver=0, bronze=0;
  TOPICS.forEach(t=> SECTIONS.forEach(sec=>{
    const m = medalForStars(sectionStars(t.id, sec.key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  SKILLS.forEach(s=>{
    const m = medalForStars(sectionStars(s.id, "practice"));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  ["wordquiz","idioms"].forEach(kind=>{
    const m = medalForStars(vpStars(kind));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  READING_SKILLS.forEach(t=> ["short","matching","notes"].forEach(key=>{
    const m = medalForStars(rsStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  GRAMMAR_LAB.forEach(t=> ["cloze","transform"].forEach(key=>{
    const m = medalForStars(glStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  TRANSLATION.forEach(t=> ["warmup","passage"].forEach(key=>{
    const m = medalForStars(trStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  SUMMARY_WRITING.forEach(t=>{
    const m = medalForStars(swStars(t.id));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  EXTENDED_WRITING.forEach(t=>{
    const m = medalForStars(ewStars(t.id));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  return { gold, silver, bronze, score: gold*3 + silver*2 + bronze*1 };
}

// Lenient short-answer check: Urdu spelling varies, so accept an exact
// match after trimming punctuation/whitespace, or either string containing
// the other (handles "10 بجے" vs "صبح 10 بجے"-style acceptable variants).
function normalizeAnswer(s){
  return (s||"").trim()
    .replace(/[ً-ٰٟ​-‏]/g,"") // diacritics (zer/zabar/pesh…) and zero-width joiners
    .replace(/ي/g,"ی").replace(/ك/g,"ک")              // Arabic-keyboard yeh/kaf → Urdu forms
    .replace(/[۔،؟!.,?]/g,"").replace(/\s+/g," ").toLowerCase();
}
function isShortAnswerCorrect(given, acceptable){
  const g = normalizeAnswer(given);
  if(!g) return false;
  return acceptable.some(a=>{
    const na = normalizeAnswer(a);
    return g===na || g.includes(na) || na.includes(g);
  });
}

/* ======================================================================
   VOCABULARY PRACTICE — data layer
   A dedicated, cross-topic practice mode (not tied to any one Essay
   topic): spaced-repetition flashcards over every topic's vocab (170
   words, not scored — repetition is the point), a mixed word-match quiz
   drawn from all topics, and an idiom drill from a new idiom bank. Built
   first because "concentrate on vocabulary and skills practice" was the
   top-level ask — see docs/new-categories-design-3248.md. Reuses vocab
   already authored per topic; only the idiom bank is new content.
   ====================================================================== */
function allVocabWords(){
  const out = [];
  TOPICS.forEach(t=> t.vocab.forEach(w=> out.push(Object.assign({ topicId:t.id }, w))));
  return out;
}

// Leitner-style spaced repetition: box 0-3, each box a longer review gap.
// "Still learning" resets to box 0 (due immediately); "Got it" advances a
// box and pushes the next review further out.
const SRS_KEY = "urdu-safar-vocab-srs-v1";
const SRS_GAPS_MS = [0, 24*3600e3, 3*24*3600e3, 7*24*3600e3];
function loadSrs(){
  try{ const raw = localStorage.getItem(SRS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveSrs(s){ try{ localStorage.setItem(SRS_KEY, JSON.stringify(s)); }catch(e){} }
let srs = loadSrs();
function srsKeyFor(w){ return w.topicId + "|" + w.ur; }
function srsBox(w){ const e = srs[srsKeyFor(w)]; return e ? e.box : 0; }
function srsIsDue(w){
  const e = srs[srsKeyFor(w)];
  return !e || Date.now() >= e.dueAt;
}
function srsMark(w, knewIt){
  const key = srsKeyFor(w);
  const prevBox = srs[key] ? srs[key].box : 0;
  const box = knewIt ? Math.min(prevBox+1, SRS_GAPS_MS.length-1) : 0;
  srs[key] = { box, dueAt: Date.now() + SRS_GAPS_MS[box] };
  saveSrs(srs);
}
function srsMasteredCount(){
  return allVocabWords().filter(w=> srsBox(w) >= SRS_GAPS_MS.length-1).length;
}

// Vocabulary Practice's own progress bucket, separate from the per-topic
// TOPICS/SECTIONS bookkeeping above since it isn't tied to one topic.
function vpStars(kind){
  const p = progress["_vocabpractice"] && progress["_vocabpractice"][kind];
  return p ? p.stars : 0;
}
function setVpResult(kind, correct, total){
  if(!progress["_vocabpractice"]) progress["_vocabpractice"] = {};
  const pct = total ? correct/total : 0;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  progress["_vocabpractice"][kind] = { correct, total, stars, done:true };
  saveProgress(progress);
  refreshPlayerLeaderboardEntry();
}

function loadLocalLeaderboard(){

  }catch(e){}
  return [];
}
function saveLocalLeaderboard(list){

function upsertLocalLeaderboard(entry){

/* ======================================================================
   ACCOUNTS + FRIEND GROUPS (Firebase Auth + Firestore)
   Optional layer on top of the always-available local guest mode above.
   Design: docs/accounts-friends-leaderboard-design.md (v1.0) and
   docs/update-1.1-design.md (multi-group, moderation, reset flow).
   Signing in is never required — every practice feature and the
   on-device leaderboard work offline as a guest. Signing in (email +
   password) lets you create or join up to MAX_GROUPS friend groups whose
   members' medal totals sync through Cloud Firestore.
   ====================================================================== */
const MAX_GROUPS = 5;
const PLAY_URL = "https://play.google.com/store/apps/details?id=com.homilabs.safar";
let fbUser = null;
function fbAuth(){ try{ return (typeof firebase !== "undefined") ? firebase.auth() : null; }catch(e){ return null; } }
function fbFirestore(){ try{ return (typeof firebase !== "undefined") ? firebase.firestore() : null; }catch(e){ return null; } }

// Names typed by other group members end up on this screen, so every piece
// of user-supplied text goes through escapeHtml before touching innerHTML.
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cleanName(s, max){
  return String(s || "").replace(/[\u0000-\u001f\u007f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, max || 30);
}

// v1.0 stored a single `player.group`; v1.1 keeps a list.
function playerGroups(){
  if(!player) return [];
  if(!Array.isArray(player.groups)){
    player.groups = (player.group && player.group.groupId) ? [player.group] : [];
    delete player.group;
    savePlayer(player);
  }
  return player.groups;
}
function setPlayerGroups(list){
  player.groups = list.filter(g => g && g.groupId).slice(0, MAX_GROUPS);
  delete player.group;
  savePlayer(player);
  if(fbUser){
    const fs = fbFirestore();
    if(fs) fs.collection("users").doc(fbUser.uid).set({ groups: player.groups }, { merge:true }).catch(()=>{});
  }
}
function dropPlayerGroup(groupId){
  setPlayerGroups(playerGroups().filter(g => g.groupId !== groupId));
}

const AUTH_VIEWS = ["home", "account", "leaderboard", "group", "groupCreate", "groupJoin"];
function initFirebaseAuthListener(){
  const auth = fbAuth();
  if(!auth) return;
  auth.onAuthStateChanged(async (u)=>{
    fbUser = u;
    if(u) await loadAccountFromFirestore();
    if(player && AUTH_VIEWS.includes(route.view)) render();
  });
}

async function loadAccountFromFirestore(){
  const fs = fbFirestore();
  if(!fs || !fbUser) return;
  try{
    const ref = fs.collection("users").doc(fbUser.uid);
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : {};
    if(!player) player = { id: fbUser.uid, nickname: data.displayName || fbUser.displayName || (fbUser.email||"").split("@")[0] };
    player.id = fbUser.uid;
    if(data.displayName) player.nickname = data.displayName;
    const legacy = (data.group && data.group.groupId) ? [data.group] : [];
    player.groups = (Array.isArray(data.groups) ? data.groups : legacy).filter(g => g && g.groupId).slice(0, MAX_GROUPS);
    delete player.group;
    savePlayer(player);
    if(!Array.isArray(data.groups)){
      ref.set({ groups: player.groups, group: firebase.firestore.FieldValue.delete() }, { merge:true }).catch(()=>{});
    }
    refreshPlayerLeaderboardEntry();
  }catch(e){ /* offline — local state stays as-is */ }
}

async function signUp(email, password, displayName){
  const auth = fbAuth();
  if(!auth) throw new Error("offline");
  const name = cleanName(displayName, 20) || email.split("@")[0];
  const cred = await auth.createUserWithEmailAndPassword(email, password);
  try{ await cred.user.updateProfile({ displayName: name }); }catch(e){}
  await fbFirestore().collection("users").doc(cred.user.uid).set({ email, displayName: name, createdAt: Date.now(), groups: [] });
  if(!player) player = { id: cred.user.uid, nickname: name };
  player.id = cred.user.uid;
  player.nickname = name;
  player.groups = [];
  delete player.group;
  savePlayer(player);
  refreshPlayerLeaderboardEntry();
}
async function logIn(email, password){
  const auth = fbAuth();
  if(!auth) throw new Error("offline");
  await auth.signInWithEmailAndPassword(email, password);
  // onAuthStateChanged runs loadAccountFromFirestore, but callers navigate
  // straight away — load here too so the next screen has the groups list.
  fbUser = auth.currentUser;
  await loadAccountFromFirestore();
}
async function sendReset(email){
  const auth = fbAuth();
  if(!auth) throw new Error("offline");
  await auth.sendPasswordResetEmail(email);
}
async function logOut(){
  const auth = fbAuth();
  if(auth) await auth.signOut();
  fbUser = null;
  if(player){ player.groups = []; delete player.group; savePlayer(player); }
}
function updateDisplayName(name){
  const clean = cleanName(name, 20);
  if(clean.length < 2) return false;
  player.nickname = clean;
  savePlayer(player);
  refreshPlayerLeaderboardEntry();
  return true;
}
// Firebase requires a *recent* sign-in for account deletion, so the
// password is always re-checked first.
async function deleteAccountEverywhere(password){
  const auth = fbAuth();
  const fs = fbFirestore();
  if(!auth || !auth.currentUser) throw new Error("not signed in");
  const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, password);
  await auth.currentUser.reauthenticateWithCredential(cred);
  await Promise.all(playerGroups().slice().map(g => leaveGroup(g.groupId).catch(()=>{})));
  await fs.collection("users").doc(auth.currentUser.uid).delete().catch(()=>{});
  await auth.currentUser.delete();
  fbUser = null;
  if(player){ player.groups = []; savePlayer(player); }
}

const INVITE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O/1/I — easy to read aloud
function randomInviteCode(){
  let s = "";
  for(let i=0;i<6;i++) s += INVITE_ALPHABET[Math.floor(Math.random()*INVITE_ALPHABET.length)];
  return s;
}
function memberDoc(){
  const t = computeMedalTotals();
  return { displayName: cleanName(player.nickname, 20) || "Player", gold: t.gold, silver: t.silver, bronze: t.bronze, score: t.score, updatedAt: Date.now() };
}
async function createGroup(name){
  const fs = fbFirestore();
  if(!fs || !fbUser) throw new Error("signin");
  if(playerGroups().length >= MAX_GROUPS) throw new Error("limit");
  const groupName = cleanName(name, 30) || "My Group";
  const groupRef = fs.collection("groups").doc();
  let code = randomInviteCode();
  for(let tries=0; tries<4; tries++){
    const taken = await fs.collection("groupLookup").doc(code).get();
    if(!taken.exists) break;
    code = randomInviteCode();
  }
  await groupRef.set({ name: groupName, ownerUid: fbUser.uid, inviteCode: code, memberUids: [fbUser.uid], createdAt: Date.now() });
  await fs.collection("groupLookup").doc(code).set({ groupId: groupRef.id, ownerUid: fbUser.uid });
  await groupRef.collection("members").doc(fbUser.uid).set(memberDoc());
  const g = { groupId: groupRef.id, name: groupName, inviteCode: code };
  setPlayerGroups(playerGroups().concat([g]));
  return g;
}
async function joinGroupByCode(rawCode){
  const code = normalizeGroupCode(rawCode);
  if(code.length !== 6) throw new Error("format");
  const fs = fbFirestore();
  if(!fs || !fbUser) throw new Error("signin");
  const existing = playerGroups().find(g => g.inviteCode === code);
  if(existing) return existing;
  if(playerGroups().length >= MAX_GROUPS) throw new Error("limit");
  const lookupSnap = await fs.collection("groupLookup").doc(code).get();
  if(!lookupSnap.exists) throw new Error("not-found");
  const { groupId } = lookupSnap.data();
  const groupRef = fs.collection("groups").doc(groupId);
  try{
    await groupRef.update({ memberUids: firebase.firestore.FieldValue.arrayUnion(fbUser.uid) });
  }catch(e){ throw new Error("not-found"); }
  await groupRef.collection("members").doc(fbUser.uid).set(memberDoc());
  let groupName = "Friend Group";
  try{ const gs = await groupRef.get(); if(gs.exists) groupName = gs.data().name || groupName; }catch(e){}
  const g = { groupId, name: groupName, inviteCode: code };
  setPlayerGroups(playerGroups().concat([g]));
  return g;
}
async function leaveGroup(groupId){
  const fs = fbFirestore();
  if(!fs || !fbUser || !groupId) return;
  const groupRef = fs.collection("groups").doc(groupId);
  let data = null;
  try{ const s = await groupRef.get(); if(s.exists) data = s.data(); }catch(e){}
  if(data && data.ownerUid === fbUser.uid && (data.memberUids||[]).length <= 1){
    await deleteGroup(groupId, data).catch(()=>{});
    return;
  }
  await groupRef.collection("members").doc(fbUser.uid).delete().catch(()=>{});
  await groupRef.update({ memberUids: firebase.firestore.FieldValue.arrayRemove(fbUser.uid) }).catch(()=>{});
  dropPlayerGroup(groupId);
}
// Owner only. Member docs go first: the rule that lets the owner delete
// them looks the owner up on the group doc, which must still exist.
async function deleteGroup(groupId, known){
  const fs = fbFirestore();
  if(!fs || !fbUser) return;
  const groupRef = fs.collection("groups").doc(groupId);
  let data = known;
  if(!data){ const s = await groupRef.get(); data = s.exists ? s.data() : null; }
  if(!data || data.ownerUid !== fbUser.uid) throw new Error("not-owner");
  const members = await groupRef.collection("members").get();
  await Promise.all(members.docs.map(d => d.ref.delete().catch(()=>{})));
  if(data.inviteCode) await fs.collection("groupLookup").doc(data.inviteCode).delete().catch(()=>{});
  await groupRef.delete();
  dropPlayerGroup(groupId);
}
async function removeMember(groupId, uid){
  const fs = fbFirestore();
  if(!fs || !fbUser || uid === fbUser.uid) return;
  const groupRef = fs.collection("groups").doc(groupId);
  await groupRef.collection("members").doc(uid).delete();
  await groupRef.update({ memberUids: firebase.firestore.FieldValue.arrayRemove(uid) });
}
// Returns { group, members } or null when the group is gone or this user
// was removed from it (both look like a permission error to the client).
async function fetchGroup(groupId){
  const fs = fbFirestore();
  if(!fs || !groupId) return null;
  try{
    const ref = fs.collection("groups").doc(groupId);
    const gs = await ref.get();
    if(!gs.exists) return null;
    const ms = await ref.collection("members").get();
    const members = ms.docs.map(d => Object.assign({ id:d.id }, d.data()))
      .sort((a,b) => (b.score||0) - (a.score||0) || (b.gold||0) - (a.gold||0));
    return { group: Object.assign({ groupId }, gs.data()), members };
  }catch(e){
    if(e && e.code === "permission-denied") return null;
    throw e;
  }
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function refreshPlayerLeaderboardEntry(){
  if(!player) return;

/* ======================================================================
   STATE + ROUTER
   ====================================================================== */
let route = { view:"home" };
const app = document.getElementById("app");

/* Android back button: each screen gets a browser-history entry, and the
   backButton listener below walks that history (closing the app from home).
   Tab/level switches on the same screen replace the entry, and forms you
   leave on success (sign-in, create/join group) are replaced too, so Back
   never lands on a stale form. Navigating to a screen that is already further
   down the history (Home, the in-app back links, Leaderboard after deleting a
   group) rewinds to it instead of stacking a duplicate. If the History API is
   unavailable (some sandboxed web frames), navigation just renders in place. */
const NAV_REPLACE_FROM = ["signin", "signup", "forgot", "groupCreate", "groupJoin"];
let navStack = [route], pendingNav = null, historyOk = true;
function hist(fn){
  if(!historyOk) return false;
  try { fn(); return true; } catch(e){ historyOk = false; return false; }
}
function sameScreen(a, b){
  return a.view === b.view && ["topicId","skillId","groupId","mode"].every(k => (a[k]||"") === (b[k]||""));
}
function showRoute(next){ route = next; render(); window.scrollTo({top:0}); }
function go(next){
  const cur = navStack.length - 1;
  for(let i = cur - 1; i >= 0; i--){
    if(sameScreen(navStack[i], next)){
      pendingNav = { next, idx: i };
      if(hist(() => history.go(i - cur))) return;
      pendingNav = null;
      break;
    }
  }
  if(sameScreen(route, next) || NAV_REPLACE_FROM.includes(route.view)){
    navStack[cur] = next;
    hist(() => history.replaceState({ r: next, d: cur }, ""));
  } else {
    navStack.push(next);
    hist(() => history.pushState({ r: next, d: cur + 1 }, ""));
  }
  showRoute(next);
}
window.addEventListener("popstate", e => {
  if(pendingNav){
    const { next, idx } = pendingNav; pendingNav = null;
    navStack.length = idx + 1; navStack[idx] = next;
    hist(() => history.replaceState({ r: next, d: idx }, ""));
    showRoute(next);
    return;
  }
  const s = e.state || { r: { view:"home" }, d: 0 };
  navStack.length = Math.min(navStack.length, s.d + 1);
  navStack[s.d] = s.r;
  showRoute(s.r);
});
// The plugin's built-in handler does nothing once history runs out, so take
// over: step back while there is history, close the app from home.
(function(){
  const AppPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!AppPlugin || !AppPlugin.addListener) return;
  AppPlugin.addListener("backButton", ({ canGoBack }) => {
    if(canGoBack) history.back(); else AppPlugin.exitApp();
  });
})();

      <label class="field-label" for="fPass2">Confirm password</label>
      <input type="password" id="fPass2" class="nick-input" autocomplete="new-password" />
      <p class="rule-explain small">By creating an account you agree to the <a href="https://safar.homilabs.org/terms-and-conditions.html" target="_blank" rel="noopener">Terms</a> and <a href="https://safar.homilabs.org/privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>. Your practice progress on this device is kept.</p>
      <div class="btn-row"><button class="btn primary" id="submitBtn">Create account</button></div>
      <p class="auth-switch">Already have an account? <button class="link-btn" id="toSignIn">Sign in</button></p>`;
  } else if(mode === "forgot"){
    form = `
      <p class="rule-explain">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
      <label class="field-label" for="fEmail">Email</label>
      <input type="email" id="fEmail" class="nick-input" autocomplete="email" />
      <div class="btn-row"><button class="btn primary" id="submitBtn">Send reset link</button></div>
      <p class="auth-switch"><button class="link-btn" id="toSignIn">Back to sign in</button></p>`;
  } else {
    form = `
      <label class="field-label" for="fEmail">Email</label>
      <input type="email" id="fEmail" class="nick-input" autocomplete="email" />
      <label class="field-label" for="fPass">Password</label>
      <input type="password" id="fPass" class="nick-input" autocomplete="current-password" />
      <p class="auth-switch" style="text-align:right;margin-top:6px;"><button class="link-btn" id="toForgot">Forgot password?</button></p>
      <div class="btn-row"><button class="btn primary" id="submitBtn">Sign in</button></div>
      <p class="auth-switch">New here? <button class="link-btn" id="toSignUp">Create an account</button></p>`;
  }
  app.innerHTML = `
    <div class="back-row"><button class="back-btn" id="backBtn">&larr; Back</button></div>
    <div class="topic-head"><span class="ur-title ur">${ur}</span><span class="en-title">${title}</span></div>
    <div class="card auth-card">
      ${form}
      <p class="form-msg" id="formMsg" role="alert"></p>
    </div>
  `;
  const msg = document.getElementById("formMsg");
  const say = (text, good)=>{ msg.textContent = text; msg.className = "form-msg " + (good ? "good" : "bad"); };
  document.getElementById("backBtn").addEventListener("click", ()=> go(back));
  const sw = (id, view)=>{ const el = document.getElementById(id); if(el) el.addEventListener("click", ()=> go({ view, next })); };
  sw("toSignIn", "signin"); sw("toSignUp", "signup"); sw("toForgot", "forgot");
  const submit = document.getElementById("submitBtn");
  const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  const run = async ()=>{
    const email = val("fEmail").trim();
    if(!email){ say("Enter your email address."); return; }
    if(mode === "signup"){
      const name = cleanName(val("fName"), 20);
      const p1 = val("fPass"), p2 = val("fPass2");
      if(name.length < 2){ say("Choose a display name of at least 2 characters."); return; }
      if(p1.length < 6){ say("Your password needs at least 6 characters."); return; }
      if(p1 !== p2){ say("The two passwords don't match."); return; }
      submit.disabled = true; say("Creating your account…", true);
      try{ await signUp(email, p1, name); go(next); }
      catch(e){ submit.disabled = false; say(authErrorText(e, mode)); }
    } else if(mode === "forgot"){
      submit.disabled = true;
      try{ await sendReset(email); }catch(e){ if(e && e.code === "auth/invalid-email"){ submit.disabled = false; say(authErrorText(e, mode)); return; } }
      // Same message whether or not the account exists, so the form can't
      // be used to discover which emails are registered.
      say("If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).", true);
    } else {
      const pass = val("fPass");
      if(!pass){ say("Enter your password."); return; }
      submit.disabled = true; say("Signing in…", true);
      try{ await logIn(email, pass); go(next); }
      catch(e){ submit.disabled = false; say(authErrorText(e, mode)); }
    }
  };
  submit.addEventListener("click", run);
  app.querySelectorAll(".auth-card input").forEach(el => el.addEventListener("keydown", e=>{ if(e.key === "Enter") run(); }));
}

  const tags = (opts && opts.ownerUid === r.id) ? ` <span class="owner-tag">owner</span>` : "";

  return `
    <div class="lb-row ${me ? 'me' : ''}">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name">${name}${me ? ' (you)' : ''}${tags}</span>
      <span class="lb-medals">🥇${r.gold||0}&nbsp;🥈${r.silver||0}&nbsp;🥉${r.bronze||0}</span>

}

async function drawGroupMembers(groupId, known){
  const host = document.getElementById("memberHost");
  let res;
  try{ res = await fetchGroup(groupId); }
  catch(e){
    if(host.isConnected) host.innerHTML = `<div class="card"><p class="rule-explain">Couldn't load the group — check your internet connection.</p><div class="btn-row"><button class="btn" id="retryBtn">Try again</button></div></div>`;
    const rb = document.getElementById("retryBtn");
    if(rb) rb.addEventListener("click", ()=> drawGroupMembers(groupId, known));
    return;
  }
  if(!host.isConnected) return;
  if(!res){
    dropPlayerGroup(groupId);
    host.innerHTML = `<div class="card"><p class="rule-explain">This group is no longer available — it was deleted, or the owner removed you. It's been taken off your list.</p><div class="btn-row"><button class="btn primary" id="okBtn">OK</button></div></div>`;
    document.getElementById("okBtn").addEventListener("click", ()=> go({ view:"leaderboard" }));
    return;
  }
  const { group } = res;
  if(group.name && group.name !== known.name){
    setPlayerGroups(playerGroups().map(g => g.groupId === groupId ? Object.assign({}, g, { name: group.name }) : g));
  }
  const isOwner = group.ownerUid === fbUser.uid;
  const members = res.members.filter(m => (group.memberUids||[]).includes(m.id));
  host.innerHTML = `
    <div class="card">
      <div class="rule-title" style="font-size:15px;margin-bottom:6px;">Members <span class="hint">(${members.length})</span></div>
      ${members.map((m,i)=> lbRowHtml(m, i, { ownerUid: group.ownerUid, canRemove: isOwner })).join("")}
      <div class="btn-row"><button class="btn" id="refreshBtn">Refresh</button></div>
    </div>
    <div class="card">
      <div class="btn-row">
        <button class="btn" id="leaveBtn">Leave group</button>
        ${isOwner ? `<button class="btn danger" id="deleteGroupBtn">Delete group</button>` : ""}
      </div>
      ${isOwner ? `<p class="rule-explain small">You're the owner: you can remove members, or delete the group for everyone.</p>` : ""}
    </div>
  `;
  document.getElementById("refreshBtn").addEventListener("click", ()=> drawGroupMembers(groupId, known));
  document.getElementById("leaveBtn").addEventListener("click", async ()=>{
    const msg = isOwner && members.length > 1
      ? `Leave "${group.name}"? You're the owner — the group will carry on without an owner, so nobody will be able to remove members. To close it instead, use Delete group.`
      : `Leave "${group.name}"?`;
    if(!window.confirm(msg)) return;
    const lb = document.getElementById("leaveBtn"); lb.disabled = true; lb.textContent = "Leaving…";
    await leaveGroup(groupId);
    go({ view:"leaderboard" });
  });
  const del = document.getElementById("deleteGroupBtn");
  if(del) del.addEventListener("click", async ()=>{
    if(!window.confirm(`Delete "${group.name}" for everyone? Members' scores in this group will be removed. This can't be undone.`)) return;
    del.disabled = true; del.textContent = "Deleting…";
    try{ await deleteGroup(groupId); go({ view:"leaderboard" }); }
    catch(e){ del.disabled = false; del.textContent = "Delete group"; window.alert("Couldn't delete the group — check your connection and try again."); }
  });
  host.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", async ()=>{
    if(!window.confirm(`Remove ${btn.dataset.name} from the group?`)) return;
    btn.disabled = true; btn.textContent = "removing…";
    try{ await removeMember(groupId, btn.dataset.remove); drawGroupMembers(groupId, known); }
    catch(e){ window.alert("Couldn't remove the member — check your connection and try again."); }
  }));
}

function runSkillQuiz(host, skill){
  const qs = skill.practice;
  let qi = 0, correct = 0;
  function drawQ(){
    if(qi >= qs.length){
      renderSkillSummary(host, skill, correct, qs.length, ()=>runSkillQuiz(host, skill));
      return;
    }
    const q = qs[qi];
    host.innerHTML = `
      ${dotsHtml(qs.length, qi)}
      <div class="card">
        <div class="qmeta"><span>Question ${qi+1} of ${qs.length}</span><span>Practice</span></div>
        <div class="prompt-ur ur">${q.q}</div>
        <div class="options">
          ${q.opts.map((o,idx)=>`<button class="opt ur" data-idx="${idx}">${o}</button>`).join("")}
        </div>
        <div id="fb"></div>
      </div>
    `;
    host.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = Number(btn.dataset.idx);
        const ok = idx === q.a;
        if(ok) correct++;
        host.querySelectorAll(".opt").forEach((b,bi)=>{
          b.disabled = true;
          if(bi===q.a) b.classList.add("correct");
          else if(bi===idx) b.classList.add("wrong");
        });
        document.getElementById("fb").innerHTML = `<div class="feedback ${ok?'good':'bad'}">${ok?'Correct!':'Correct answer: '+q.opts[q.a]}</div>`;
        setTimeout(()=>{ qi++; drawQ(); }, 900);
      });
    });
  }
  drawQ();
}

function runVocabFlashcards(host){
  const all = allVocabWords();
  let due = all.filter(srsIsDue).sort((a,b)=> srsBox(a)-srsBox(b));
  if(due.length === 0) due = all.slice().sort(()=>Math.random()-0.5);
  const batch = due.slice(0, Math.min(15, due.length));
  let i = 0, flipped = false;

  function draw(){
    if(i >= batch.length){
      host.innerHTML = `
        <div class="card summary">
          <h2>Session complete</h2>
          <p>Reviewed ${batch.length} word${batch.length===1?'':'s'}. ${srsMasteredCount()}/${all.length} words fully mastered so far.</p>
          <div class="btn-row"><button class="btn primary" id="doneBtn">Back to Vocabulary</button></div>
        </div>
      `;
      document.getElementById("doneBtn").addEventListener("click", ()=> go({ view:"home", homeTab:"vocab" }));
      return;
    }
    const w = batch[i];
    const topicTitle = (TOPICS.find(t=>t.id===w.topicId) || {}).en || "";
    host.innerHTML = `
      ${dotsHtml(batch.length, i)}
      <div class="flash-wrap">
        <div class="flashcard" id="card">
          ${flipped ? `
            <div class="back-en">${w.en}</div>
            <div class="example ur">${w.ex_ur}</div>
            <div class="example-en">${w.ex_en}</div>
            ${w.syn ? `<div class="syn-line ur"><span class="lab" style="direction:ltr;">Synonym (مترادف)</span>${w.syn}</div>` : ''}
          ` : `
            <div class="front-ur ur">${w.ur}</div>
            <div class="hint">From "${topicTitle}" — tap to reveal</div>
          `}
        </div>
        ${flipped ? `
          <div class="btn-row">
            <button class="btn" id="stillLearning">Still learning</button>
            <button class="btn primary" id="gotIt">Got it &#10003;</button>
          </div>
        ` : `<div class="btn-row"><button class="btn primary" id="flip">Flip card</button></div>`}
      </div>
    `;
    document.getElementById("card").addEventListener("click", ()=>{ flipped=!flipped; draw(); });
    const flipBtn = document.getElementById("flip");
    if(flipBtn) flipBtn.addEventListener("click", ()=>{ flipped=true; draw(); });
    const stillBtn = document.getElementById("stillLearning");
    if(stillBtn) stillBtn.addEventListener("click", ()=>{ srsMark(w,false); i++; flipped=false; draw(); });
    const gotBtn = document.getElementById("gotIt");
    if(gotBtn) gotBtn.addEventListener("click", ()=>{ srsMark(w,true); i++; flipped=false; draw(); });
  }
  draw();
}

function runVocabWordQuiz(host){
  const pool = allVocabWords();
  const QUIZ_COUNT = Math.min(12, pool.length);
  const shuffled = pool.slice().sort(()=>Math.random()-0.5).slice(0, QUIZ_COUNT);
  const meaningItems = shuffled.map((w,n)=>{
    const urToEn = n % 2 === 0;
    const distractors = pool.filter(x=>x.ur!==w.ur).sort(()=>Math.random()-0.5).slice(0,3);
    const opts = distractors.concat([w]).sort(()=>Math.random()-0.5);
    return {
      kind:"meaning", urToEn,
      prompt: urToEn ? w.ur : w.en,
      opts: opts.map(o => urToEn ? o.en : o.ur),
      answer: urToEn ? w.en : w.ur,
      label: urToEn ? "What does this mean?" : "Which word means this?"
    };
  });
  const synPool = pool.filter(w=>w.syn);
  const synItems = [];
  if(synPool.length >= 2){
    synPool.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(6, synPool.length)).forEach((w,n)=>{
      const wordToSyn = n % 2 === 0;
      const distractors = synPool.filter(x=>x.ur!==w.ur).sort(()=>Math.random()-0.5).slice(0,3);
      const opts = distractors.concat([w]).sort(()=>Math.random()-0.5);
      synItems.push({
        kind:"syn", wordToSyn,
        prompt: wordToSyn ? w.ur : w.syn,
        opts: opts.map(o => wordToSyn ? o.syn : o.ur),
        answer: wordToSyn ? w.syn : w.ur,
        label: wordToSyn ? "Which word is a synonym (مترادف) of this?" : "This is a synonym — which word does it belong to?"
      });
    });
  }
  const items = meaningItems.concat(synItems);
  let qi=0, correct=0;
  function drawQ(){
    if(qi>=items.length){ drawVpQuizResult(host, "wordquiz", correct, items.length, ()=>runVocabWordQuiz(host)); return; }
    const it = items[qi];
    const promptCls = it.kind==="meaning" ? (it.urToEn ? "ur" : "") : "ur";
    const optCls = it.kind==="meaning" ? (it.urToEn ? "en" : "ur") : "ur";
    host.innerHTML = `
      ${dotsHtml(items.length, qi)}
      <div class="card">
        <div class="qmeta"><span>Question ${qi+1} of ${items.length}</span><span>${it.kind==='syn' ? 'Synonyms' : 'Meaning'}</span></div>
        <div class="prompt-ur ${promptCls}">${it.prompt}</div>
        <div class="translation-hint" style="direction:ltr;">${it.label}</div>
        <div class="options" id="opts">
          ${it.opts.map((o,idx)=>`<button class="opt ${optCls}" data-idx="${idx}">${o}</button>`).join("")}
        </div>
        <div id="fb"></div>
      </div>
    `;
    host.querySelectorAll("#opts .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const chosen = it.opts[btn.dataset.idx];
        const ok = chosen === it.answer;
        if(ok) correct++;
        host.querySelectorAll("#opts .opt").forEach(b=>{
          b.disabled = true;
          if(b.textContent===it.answer) b.classList.add("correct");
          else if(b===btn) b.classList.add("wrong");
        });
        document.getElementById("fb").innerHTML = `<div class="feedback ${ok?'good':'bad'}">${ok? 'Correct!' : 'Correct answer: '+it.answer}</div>`;
        setTimeout(()=>{ qi++; drawQ(); }, 900);
      });
    });
  }
  drawQ();
}

function runIdiomsQuiz(host){
  const pool = IDIOMS;
  const QUIZ_COUNT = Math.min(10, pool.length);
  const items = pool.slice().sort(()=>Math.random()-0.5).slice(0, QUIZ_COUNT).map((idm,n)=>{
    const idiomToMeaning = n % 2 === 0;
    const distractors = pool.filter(x=>x.id!==idm.id).sort(()=>Math.random()-0.5).slice(0,3);
    const opts = distractors.concat([idm]).sort(()=>Math.random()-0.5);
    return {
      idiomToMeaning,
      prompt: idiomToMeaning ? idm.ur : idm.meaning_en,
      opts: opts.map(o => idiomToMeaning ? o.meaning_en : o.ur),
      answer: idiomToMeaning ? idm.meaning_en : idm.ur,
      label: idiomToMeaning ? "What does this idiom mean?" : "Which idiom means this?"
    };
  });
  let qi=0, correct=0;
  function drawQ(){
    if(qi>=items.length){ drawVpQuizResult(host, "idioms", correct, items.length, ()=>runIdiomsQuiz(host)); return; }
    const it = items[qi];
    const promptCls = it.idiomToMeaning ? "ur" : "";
    const optCls = it.idiomToMeaning ? "" : "ur";
    host.innerHTML = `
      ${dotsHtml(items.length, qi)}
      <div class="card">
        <div class="qmeta"><span>Question ${qi+1} of ${items.length}</span><span>Idioms</span></div>
        <div class="prompt-ur ${promptCls}">${it.prompt}</div>
        <div class="translation-hint" style="direction:ltr;">${it.label}</div>
        <div class="options" id="opts">
          ${it.opts.map((o,idx)=>`<button class="opt ${optCls}" data-idx="${idx}">${o}</button>`).join("")}
        </div>
        <div id="fb"></div>
      </div>
    `;
    host.querySelectorAll("#opts .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const chosen = it.opts[btn.dataset.idx];
        const ok = chosen === it.answer;
        if(ok) correct++;
        host.querySelectorAll("#opts .opt").forEach(b=>{
          b.disabled = true;
          if(b.textContent===it.answer) b.classList.add("correct");
          else if(b===btn) b.classList.add("wrong");
        });
        document.getElementById("fb").innerHTML = `<div class="feedback ${ok?'good':'bad'}">${ok? 'Correct!' : 'Correct answer: '+it.answer}</div>`;
        setTimeout(()=>{ qi++; drawQ(); }, 900);
      });
    });
  }
  drawQ();
}

            <div class="bank" style="direction:ltr;justify-content:flex-start;">
