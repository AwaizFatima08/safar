<title>Urdu Safar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#F1E6CC;
    --paper-dim:#E6D6A9;
    --card:#F8EFDA;
    --ink:#1E3A34;
    --ink-soft:#54685F;
    --ink-faint:#8A9089;
    --rule:#C9B679;
    --marigold:#C97A17;
    --marigold-ink:#3A2205;
    --maroon:#8F3232;
    --emerald:#2F7A54;
    --shadow: 0 1px 0 rgba(30,58,52,.06), 0 6px 16px -8px rgba(30,58,52,.25);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12211D;
      --paper-dim:#1A2E27;
      --card:#182B25;
      --ink:#EAD9AF;
      --ink-soft:#B7AB86;
      --ink-faint:#7C8579;
      --rule:#3B4E42;
      --marigold:#EBA13E;
      --marigold-ink:#241300;
      --maroon:#E08484;
      --emerald:#5FBE8F;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12211D;
    --paper-dim:#1A2E27;
    --card:#182B25;
    --ink:#EAD9AF;
    --ink-soft:#B7AB86;
    --ink-faint:#7C8579;
    --rule:#3B4E42;
    --marigold:#EBA13E;
    --marigold-ink:#241300;
    --maroon:#E08484;
    --emerald:#5FBE8F;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  .ur{
    font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',serif;
    direction:rtl;
    unicode-bidi:isolate;
    line-height:2.1;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',Georgia,serif;
    text-wrap:balance;
    margin:0;
  }
  ::selection{ background:var(--marigold); color:var(--marigold-ink); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--marigold); outline-offset:2px; border-radius:6px; }

  /* ============ SHELL ============ */
  #app{ max-width:760px; margin:0 auto; padding:20px 18px 64px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:10px 2px 18px; border-bottom:2px solid var(--rule); margin-bottom:22px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .en{ font-size:26px; font-weight:600; letter-spacing:.2px; }
  .brand .ur-mark{ font-size:22px; color:var(--marigold); }
  .tagline{ font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; }

  /* ============ OVERALL PROGRESS ============ */
  .overall{
    display:flex; align-items:center; gap:16px;
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:26px; box-shadow:var(--shadow);
  }
  .overall-stat{ text-align:center; min-width:56px; }
  .overall-stat .num{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--marigold); display:block; }
  .overall-stat .lab{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.07em; }
  .overall-div{ width:1px; align-self:stretch; background:var(--rule); }
  .overall-msg{ flex:1; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }

  /* ============ PLAYER ROW / SIGN-UP / LEADERBOARD ============ */
  .player-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .player-name{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .link-btn{ background:none; border:none; padding:0; margin:0; font-size:11.5px; color:var(--marigold); text-decoration:underline; cursor:pointer; font-weight:600; }
  .lb-btn{ padding:8px 14px; font-size:12.5px; }
  .signup-card{ max-width:420px; margin:10vh auto 0; text-align:center; }
  .signup-card .rule-explain{ direction:ltr; text-align:center; margin-bottom:16px; }
  .nick-input{
    width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid var(--rule);
    background:var(--paper); color:var(--ink); font-size:16px; font-family:'Karla',sans-serif; margin-bottom:14px;
  }
  .medal-badge{ font-size:15px; font-weight:700; margin:6px 0 4px; }
  .lb-row{
    display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--rule);
    font-size:14px;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row.me{ background:color-mix(in srgb, var(--marigold) 12%, transparent); border-radius:8px; }
  .lb-rank{ width:22px; text-align:center; font-weight:700; color:var(--ink-faint); }
  .lb-name{ flex:1; font-weight:600; }
  .lb-medals{ font-size:12.5px; direction:ltr; white-space:nowrap; }
  .group-card{ margin-bottom:16px; }
  .group-caveat{ font-size:11.5px; color:var(--ink-faint); margin-top:12px; padding-top:10px; border-top:1px solid var(--rule); }

  /* ============ TOPIC GRID ============ */
  .section-label{
    font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);
    margin:0 0 10px 2px; font-weight:600;
  }
  .section-label .ur{ text-transform:none; letter-spacing:0; font-size:15px; margin-inline-start:6px; }
  .topic-grid{ display:grid; gap:14px; grid-template-columns:1fr; }
  @media(min-width:560px){ .topic-grid{ grid-template-columns:1fr 1fr; } }

  .topic-card{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:18px 18px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:right;
    position:relative; overflow:hidden; transition:transform .12s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .topic-card:hover{ transform:translateY(-2px); }
  .topic-card:active{ transform:translateY(0); }
  .topic-card .ur-title{ font-size:26px; font-weight:700; color:var(--ink); }
  .topic-card .en-title{ font-size:12.5px; color:var(--ink-soft); text-align:left; letter-spacing:.02em; }
  .topic-stars{ display:flex; gap:5px; justify-content:flex-start; direction:ltr; }
  .star{ font-size:15px; color:var(--rule); }
  .star.on{ color:var(--marigold); }
  .mastered-seal{
    position:absolute; top:10px; left:-30px; transform:rotate(-18deg);
    background:var(--emerald); color:var(--card); font-size:10px; font-weight:700;
    letter-spacing:.05em; padding:3px 34px; text-transform:uppercase; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  /* ============ TOPIC VIEW ============ */
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    background:none; border:1px solid var(--rule); color:var(--ink);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .back-btn:hover{ background:var(--paper-dim); }
  .topic-head{ margin-bottom:16px; }
  .topic-head .ur-title{ font-size:30px; font-weight:700; display:block; }
  .topic-head .en-title{ color:var(--ink-soft); font-size:13.5px; }

  .tabbar{ display:flex; gap:6px; border-bottom:2px solid var(--rule); margin-bottom:20px; }
  .tab{
    flex:1; background:none; border:none; padding:10px 6px 12px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:3px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--marigold); }
  .tab .tab-stars{ font-size:9px; letter-spacing:1px; direction:ltr; color:var(--marigold); }

  /* home-tabbar scrolls horizontally so more top-level areas can be added
     later without squeezing every tab down to fit one screen width. */
  .home-tabbar{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .home-tabbar::-webkit-scrollbar{ display:none; }
  .home-tabbar .tab{ flex:0 0 auto; padding-left:16px; padding-right:16px; white-space:nowrap; }

  /* ============ VOCABULARY PRACTICE ============ */
  .vp-card-title{ font-size:16px; font-weight:700; color:var(--ink); text-align:left; }
  .vp-card-desc{ font-size:12px; color:var(--ink-soft); text-align:left; letter-spacing:.01em; }
  .vp-view-title{ font-size:22px; font-weight:700; color:var(--ink); }

  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow); margin-bottom:16px;
  }

  .progress-dots{ display:flex; gap:6px; margin-bottom:16px; direction:ltr; }
  .dot{ height:5px; flex:1; background:var(--rule); border-radius:3px; }
  .dot.done{ background:var(--marigold); }
  .dot.now{ background:var(--ink-soft); }

  /* ============ FLASHCARD ============ */
  .flash-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .flashcard{
    width:100%; max-width:420px; min-height:200px; border-radius:16px;
    background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; cursor:pointer; text-align:center; gap:10px;
  }
  .flashcard .front-ur{ font-size:40px; font-weight:700; }
  .flashcard .hint{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .flashcard .back-en{ font-size:20px; font-weight:600; color:var(--marigold); }
  .flashcard .example{ font-size:20px; margin-top:6px; }
  .flashcard .example-en{ font-size:12.5px; color:var(--ink-soft); direction:ltr; }
  .flashcard .syn-line{ font-size:15px; color:var(--marigold); margin-top:8px; padding-top:8px; border-top:1px dashed var(--rule); }
  .flashcard .syn-line .lab{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:2px; }

  /* ============ BUTTON ROW ============ */
  .btn-row{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  .btn{
    border:none; border-radius:10px; padding:11px 20px; font-size:14px; font-weight:600;
    cursor:pointer; background:var(--paper-dim); color:var(--ink); border:1px solid var(--rule);
  }
  .btn:hover{ background:var(--rule); }
  .btn.primary{ background:var(--marigold); color:var(--marigold-ink); border-color:var(--marigold); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ background:#fff; color:#B3261E; border-color:#B3261E; }
  .btn.danger:hover{ background:#FBEAE9; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ============ MCQ ============ */
  .prompt-ur{ font-size:24px; font-weight:700; margin-bottom:16px; text-align:center; }
  .prompt-en{ font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:16px; direction:ltr;}
  .options{ display:grid; gap:10px; }
  .opt{
    display:block; width:100%; text-align:right; background:var(--paper-dim); border:1.5px solid var(--rule);
    border-radius:10px; padding:13px 16px; font-size:17px; cursor:pointer; color:var(--ink);
  }
  .opt.en{ text-align:left; direction:ltr; font-size:15px; font-family:'Karla',sans-serif; }
  .opt:hover{ border-color:var(--marigold); }
  .opt.correct{ background:color-mix(in srgb, var(--emerald) 22%, var(--card)); border-color:var(--emerald); }
  .opt.wrong{ background:color-mix(in srgb, var(--maroon) 22%, var(--card)); border-color:var(--maroon); }
  .opt:disabled{ cursor:default; }

  .feedback{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; font-weight:600; display:flex; gap:8px; align-items:center; }
  .feedback.good{ background:color-mix(in srgb, var(--emerald) 18%, transparent); color:var(--emerald); }
  .feedback.bad{ background:color-mix(in srgb, var(--maroon) 18%, transparent); color:var(--maroon); }

  /* ============ READING PASSAGE ============ */
  .passage{ font-size:23px; margin-bottom:6px; }
  .passage-cap{ text-align:right; font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
  .skill-meta{ font-size:10.5px; color:var(--ink-faint); margin-top:6px; }
  .sample-block{ margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
  .sample-block:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .sample-cap{ font-size:11.5px; color:var(--ink-faint); font-weight:700; margin-bottom:6px; direction:ltr; text-align:left; }
  .sample-text{ font-size:18px; line-height:1.9; white-space:pre-line; }

  /* ============ WORD BANK (sentence building) ============ */
  .answer-strip{
    min-height:56px; border:1.5px dashed var(--rule); border-radius:10px; background:var(--paper-dim);
    display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; padding:10px 12px;
    direction:rtl; margin-bottom:16px;
  }
  .answer-strip .placeholder{ color:var(--ink-faint); font-size:13px; direction:ltr; }
  .tile{
    background:var(--card); border:1.5px solid var(--rule); border-radius:8px; padding:9px 14px;
    font-size:19px; cursor:pointer;
  }
  .tile.used{ opacity:.35; cursor:default; }
  .tile.placed{ background:var(--marigold); color:var(--marigold-ink); border-color:var(--marigold); }
  .bank{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; direction:rtl; margin-bottom:6px; }
  .translation-hint{ font-size:12px; color:var(--ink-soft); text-align:center; direction:ltr; margin-bottom:10px; }

  /* ============ GRAMMAR ============ */
  .rule-title{ font-size:20px; font-weight:700; margin-bottom:10px; }
  .rule-explain{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; direction:ltr; }
  table.ex{ width:100%; border-collapse:collapse; margin-bottom:6px; }
  table.ex th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); text-align:right; padding:6px 8px; border-bottom:2px solid var(--rule); }
  table.ex td{ padding:9px 8px; border-bottom:1px solid var(--rule); font-size:18px; text-align:right; }
  table.ex td.gloss{ font-size:12px; color:var(--ink-soft); direction:ltr; text-align:left; font-family:'Karla',sans-serif; }

  /* ============ SUMMARY ============ */
  .summary{ text-align:center; padding:30px 10px; }
  .summary .big-stars{ font-size:38px; letter-spacing:8px; margin:10px 0 6px; direction:ltr; }
  .summary h2{ font-size:24px; margin-bottom:6px; }
  .summary p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }

  .qmeta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; direction:ltr; }

  /* ============ LEVEL SELECTOR ============ */
  .level-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .level-label{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .level-bar{ display:flex; gap:5px; background:var(--paper-dim); border:1px solid var(--rule); border-radius:10px; padding:3px; }
  .level-btn{
    border:none; background:none; padding:6px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer;
  }
  .level-btn.active{ background:var(--marigold); color:var(--marigold-ink); }

  /* ============ FACTOID ============ */
  .factoid{
    display:flex; gap:10px; align-items:flex-start; background:var(--paper-dim); border:1px dashed var(--rule);
    border-radius:12px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.55;
  }
  .factoid .mark{ font-family:'Fraunces',serif; font-weight:700; color:var(--marigold); font-size:16px; flex-shrink:0; }

  /* ============ CREATIVE CORNER ============ */
  .creative-ta{
    width:100%; font-size:20px; padding:14px; border-radius:10px; border:1.5px solid var(--rule);
    background:var(--paper-dim); color:var(--ink); resize:vertical; min-height:110px; font-family:'Noto Nastaliq Urdu',serif;
  }
  .checklist{ font-size:12.5px; color:var(--ink-soft); margin:14px 0 4px; padding-inline-start:20px; line-height:1.7; }
  .creative-badge{
    display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--emerald); border:1px solid var(--emerald); border-radius:20px; padding:3px 10px; margin-bottom:12px;
  }

  footer.note{ text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:36px; line-height:1.6; }

</style>

یرے","بہت","سی","ہیں"],"answer":["میرے","فون","میں","بہت","سی","مفید","خصوصیات","ہیں"]}],"passage":{"en":"Modern technology has transformed the way people communicate and share information. With just a smartphone and an internet connection, a person can send a message, make a video call, or search for information from anywhere in the world within seconds. Social media platforms allow people to stay connected with friends and family, even when they live far apart. Businesses also rely heavily on technology to reach customers, advertise products, and manage their daily operations. However, using technology responsibly is extremely important. People should never share personal information with strangers online, and they should always use strong passwords to protect their accounts. Parents and teachers have a duty to guide children about safe internet habits from an early age. When used wisely, technology can be one of the most powerful tools for learning, communication, and progress in the modern world.","modelUr":"جدید ٹیکنالوجی نے لوگوں کے رابطے اور معلومات کے تبادلے کے انداز کو یکسر بدل دیا ہے۔ صرف ایک سمارٹ فون اور انٹرنیٹ کنکشن کی مدد سے کوئی بھی شخص چند سیکنڈوں میں دنیا کے کسی بھی کونے سے پیغام بھیج سکتا ہے، ویڈیو کال کر سکتا ہے یا معلومات تلاش کر سکتا ہے۔ سوشل میڈیا پلیٹ فارمز لوگوں کو دور رہنے کے باوجود دوستوں اور خاندان سے جڑے رہنے میں مدد دیتے ہیں۔ کاروبار بھی گاہکوں تک پہنچنے، مصنوعات کی تشہیر کرنے اور روزمرہ کے کاموں کو سنبھالنے کے لیے ٹیکنالوجی پر بہت انحصار کرتے ہیں۔ تاہم، ٹیکنالوجی کا ذمہ دارانہ استعمال انتہائی ضروری ہے۔ لوگوں کو کبھی بھی اجنبیوں کے ساتھ آن لائن ذاتی معلومات شیئر نہیں کرنی چاہییں، اور انہیں ہمیشہ اپنے اکاؤنٹس کی حفاظت کے لیے مضبوط پاس ورڈ استعمال کرنے چاہییں۔ والدین اور اساتذہ کی ذمہ داری ہے کہ وہ بچوں کو بچپن ہی سے انٹرنیٹ کی محفوظ عادات کے بارے میں رہنمائی دیں۔ عقلمندی سے استعمال کیا جائے تو ٹیکنالوجی سیکھنے، رابطے اور جدید دنیا میں ترقی کے لیے ایک انتہائی طاقتور ذریعہ بن سکتی ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"elephants","ur":"ہاتھیوں کی زندگی","en":"Life of Elephants","warmup":[{"en":"The elephant is a very large animal.","bank":["بڑا","ایک","بہت","ہاتھی","جانور","ہے"],"answer":["ہاتھی","ایک","بہت","بڑا","جانور","ہے"]},{"en":"Elephants live in the forest.","bank":["میں","رہتے","ہاتھی","جنگل","ہیں"],"answer":["ہاتھی","جنگل","میں","رہتے","ہیں"]},{"en":"We should protect wild animals.","bank":["کرنی","جنگلی","چاہیے","حفاظت","ہمیں","جانوروں","کی"],"answer":["ہمیں","جنگلی","جانوروں","کی","حفاظت","کرنی","چاہیے"]},{"en":"Hunters kill many elephants every year.","bank":["ہاتھی","بہت","شکاری","ہر","سے","سال","ہلاک","کر","دیتے","ہیں"],"answer":["شکاری","ہر","سال","بہت","سے","ہاتھی","ہلاک","کر","دیتے","ہیں"]},{"en":"This sanctuary is safe for elephants.","bank":["محفوظ","کے","ہاتھیوں","سینکچوری","یہ","لیے","ہے"],"answer":["یہ","سینکچوری","ہاتھیوں","کے","لیے","محفوظ","ہے"]}],"passage":{"en":"The elephant is one of the most magnificent creatures on Earth, admired for its intelligence, strength, and gentle nature. Unfortunately, the world's elephant population has been declining rapidly due to illegal hunting and the destruction of their natural habitats. Poachers kill elephants for their valuable ivory tusks, which are sold illegally in various markets around the world. This cruel practice has pushed several elephant species toward extinction. To address this serious problem, many countries have established wildlife sanctuaries and passed strict laws against poaching. Conservationists work tirelessly to protect elephants, monitor their health, and educate local communities about the importance of preserving these animals. Schools and media campaigns also play an important role in raising public awareness about elephant conservation. If people around the world work together, it may still be possible to save this remarkable species for future generations to admire and enjoy.","modelUr":"ہاتھی زمین پر پائی جانے والی سب سے شاندار مخلوقات میں سے ایک ہے، جسے اس کی ذہانت، طاقت اور نرم مزاجی کی وجہ سے سراہا جاتا ہے۔ بدقسمتی سے، غیر قانونی شکار اور قدرتی مسکن کی تباہی کی وجہ سے دنیا بھر میں ہاتھیوں کی آبادی تیزی سے کم ہو رہی ہے۔ شکاری ہاتھیوں کو ان کے قیمتی ہاتھی دانت کے لیے ہلاک کرتے ہیں، جنہیں دنیا بھر کی مختلف منڈیوں میں غیر قانونی طور پر فروخت کیا جاتا ہے۔ اس ظالمانہ عمل نے کئی ہاتھیوں کی اقسام کو معدومیت کے قریب پہنچا دیا ہے۔ اس سنگین مسئلے سے نمٹنے کے لیے، بہت سے ممالک نے جنگلی حیات کی سینکچوریز قائم کی ہیں اور شکار کے خلاف سخت قوانین بنائے ہیں۔ ماہرینِ فطرت ہاتھیوں کی حفاظت، ان کی صحت کی نگرانی اور مقامی برادریوں کو ان جانوروں کے تحفظ کی اہمیت کے بارے میں آگاہی دینے کے لیے انتھک محنت کرتے ہیں۔ سکول اور میڈیا مہمات بھی ہاتھیوں کے تحفظ کے بارے میں عوامی شعور اجاگر کرنے میں اہم کردار ادا کرتی ہیں۔ اگر دنیا بھر کے لوگ مل کر کوشش کریں تو ممکن ہے کہ اس شاندار نسل کو آنے والی نسلوں کے لیے بچایا جا سکے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"cricket","ur":"کرکٹ","en":"Cricket","warmup":[{"en":"Our team won the match.","bank":["میچ","گئی","جیت","ٹیم","ہماری"],"answer":["ہماری","ٹیم","میچ","جیت","گئی"]},{"en":"The players practise every day.","bank":["پریکٹس","کھلاڑی","روزانہ","کرتے","ہیں"],"answer":["کھلاڑی","روزانہ","پریکٹس","کرتے","ہیں"]},{"en":"The captain makes good decisions.","bank":["فیصلے","کپتان","کرتا","اچھے","ہے"],"answer":["کپتان","اچھے","فیصلے","کرتا","ہے"]},{"en":"Thousands of people watched the final.","bank":["دیکھا","لوگوں","فائنل","ہزاروں","نے"],"answer":["ہزاروں","لوگوں","نے","فائنل","دیکھا"]},{"en":"This is the most important match.","bank":["اہم","سب","یہ","میچ","سے","ہے"],"answer":["یہ","سب","سے","اہم","میچ","ہے"]}],"passage":{"en":"Cricket is one of the most popular sports in Pakistan, followed passionately by millions of fans across the country. The sport requires not only physical skill but also mental strength, teamwork, and strategic thinking. Young cricketers spend years practising their batting, bowling, and fielding techniques before they get a chance to represent their school, city, or country. A good captain plays a vital role in a team's success, making important decisions during the match and keeping the players motivated, especially during difficult situations. Winning a match often depends on how well the players work together as a team rather than relying on individual performance alone. Cricket tournaments, whether at the school level or international level, bring communities together and create a sense of excitement and unity among supporters. For many young players, cricket is not just a game but a dream they hope to pursue as a career.","modelUr":"کرکٹ پاکستان کے مقبول ترین کھیلوں میں سے ایک ہے، جسے ملک بھر میں لاکھوں شائقین جوش و خروش سے فالو کرتے ہیں۔ اس کھیل کے لیے نہ صرف جسمانی مہارت بلکہ ذہنی مضبوطی، ٹیم ورک اور حکمتِ عملی بھی درکار ہوتی ہے۔ نوجوان کرکٹرز اپنے سکول، شہر یا ملک کی نمائندگی کرنے کا موقع ملنے سے پہلے برسوں تک اپنی بیٹنگ، باؤلنگ اور فیلڈنگ کی تکنیکوں پر مشق کرتے ہیں۔ ایک اچھا کپتان ٹیم کی کامیابی میں اہم کردار ادا کرتا ہے، میچ کے دوران اہم فیصلے کرتا ہے اور خاص طور پر مشکل حالات میں کھلاڑیوں کا حوصلہ بلند رکھتا ہے۔ میچ جیتنا اکثر اس بات پر منحصر ہوتا ہے کہ کھلاڑی ایک ٹیم کے طور پر کتنی اچھی طرح مل کر کام کرتے ہیں، نہ کہ صرف انفرادی کارکردگی پر۔ کرکٹ ٹورنامنٹ، چاہے سکول کی سطح پر ہوں یا بین الاقوامی سطح پر، برادریوں کو اکٹھا کرتے ہیں اور حامیوں میں جوش اور اتحاد کا احساس پیدا کرتے ہیں۔ بہت سے نوجوان کھلاڑیوں کے لیے کرکٹ محض ایک کھیل نہیں بلکہ ایک خواب ہے جسے وہ بطور کیریئر اپنانا چاہتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"environment-seasons","ur" ری بھی ہوتی ہے، جبکہ گرمیوں میں شدید گرمی آتی ہے جسے بہت سے شہروں میں برداشت کرنا مشکل ہو جاتا ہے۔ مون سون کا موسم زراعت کے لیے ضروری بارش لاتا ہے، اگرچہ کبھی کبھار یہ نشیبی علاقوں میں سیلاب کا باعث بھی بنتا ہے۔ بہار، جسے بہت سے لوگ سب سے خوشگوار موسم سمجھتے ہیں، کھلتے پھول اور معتدل، آرام دہ درجہ حرارت لاتی ہے۔ تاہم، حالیہ برسوں میں موسمیاتی تبدیلی نے ان قدرتی نمونوں کو نمایاں طور پر متاثر کرنا شروع کر دیا ہے۔ گرمیاں زیادہ گرم اور طویل ہو گئی ہیں، جبکہ بارشیں غیر متوقع ہوتی جا رہی ہیں، کبھی شدید سیلاب اور کبھی طویل خشک سالی کے درمیان۔ سائنسدانوں کا انتباہ ہے کہ اگر یہ تبدیلیاں مناسب اقدامات کے بغیر جاری رہیں تو ملک بھر میں زراعت، پانی کی فراہمی اور روزمرہ زندگی کو سنگین مشکلات کا سامنا کرنا پڑ سکتا ہے۔ زیادہ درخت لگانا اور آلودگی کم کرنا دو سادہ اقدامات ہیں جو آنے والی نسلوں کے لیے ماحول کے تحفظ میں مدد دے سکتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"margalla-hills","ur":"مارگلہ کی پہاڑیاں","en":"The Margalla Hills","warmup":[{"en":"We went hiking in the mountains.","bank":["گئے","میں","کرنے","ہائیکنگ","ہم","پہاڑوں"],"answer":["ہم","پہاڑوں","میں","ہائیکنگ","کرنے","گئے"]},{"en":"The view from the top was beautiful.","bank":["خوبصورت","سے","نظارہ","چوٹی","تھا"],"answer":["چوٹی","سے","نظارہ","خوبصورت","تھا"]},{"en":"We should carry water on the trail.","bank":["پانی","ہمیں","چاہیے","پر","رکھنا","ٹریل","ساتھ"],"answer":["ہمیں","ٹریل","پر","پانی","ساتھ","رکھنا","چاہیے"]},{"en":"The guide showed us the correct path.","bank":["دکھایا","نے","راستہ","گائیڈ","ہمیں","صحیح"],"answer":["گائیڈ","نے","ہمیں","صحیح","راستہ","دکھایا"]},{"en":"This trail is more difficult than that one.","bank":["مشکل","زیادہ","ٹریل","اس","یہ","سے","ہے"],"answer":["یہ","ٹریل","اس","سے","زیادہ","مشکل","ہے"]}],"passage":{"en":"The Margalla Hills, located on the edge of Islamabad, offer some of the most popular hiking trails answer":["قائدِ اعظم","ایک","عظیم","رہنما","تھے"]},{"en":"He worked hard for Pakistan.","bank":["نے","پاکستان","انہوں","سخت","محنت","کے","کی","لیے"],"answer":["انہوں","نے","پاکستان","کے","لیے","سخت","محنت","کی"]},{"en":"We respect his sacrifices.","bank":["ان","احترام","قربانیوں","کی","ہم","کرتے","کا","ہیں"],"answer":["ہم","ان","کی","قربانیوں","کا","احترام","کرتے","ہیں"]},{"en":"Pakistan became free in 1947.","bank":["1947","پاکستان","میں","ہوا","آزاد"],"answer":["پاکستان","1947","میں","آزاد","ہوا"]},{"en":"His life teaches us many lessons.","bank":["سکھاتی","زندگی","بہت","ان","ہمیں","کی","سے","سبق","ہے"],"answer":["ان","کی","زندگی","ہمیں","بہت","سے","سبق","سکھاتی","ہے"]}],"passage":{"en":"Muhammad Ali Jinnah, known respectfully as Quaid-e-Azam, is remembered as one of the most important leaders in the history of South Asia. Born in Karachi in 1876, he trained as a lawyer in England before returning home to practice law successfully. He later became deeply involved in politics, eventually leading the All-India Muslim League and dedicating his life to securing a separate homeland for the Muslims of the subcontinent. His discipline, determination, and honesty earned him deep respect from people across all walks of life. After years of tireless struggle, Pakistan finally came into existence on 14 August 1947, and Jinnah became its first Governor-General. Even though he passed away just over a year later, his vision and leadership continue to inspire millions of Pakistanis today, reminding them that dedication and hard work can achieve even the most difficult goals.","modelUr":"محمد علی جناح، جنہیں احتراماً قائدِ اعظم کہا جاتا ہے، جنوبی ایشیا کی تاریخ کے اہم ترین رہنماؤں میں سے ایک کے طور پر یاد کیے جاتے ہیں۔ 1876 میں کراچی میں پیدا ہونے والے انہوں نے انگلستان میں وکالت کی تربیت حاصل کی اور واپس آ کر کامیابی سے وکالت کی۔ بعد میں وہ سیاست میں گہرائی سے شامل ہو گئے، بالآخر آل انڈیا مسلم لیگ کی قیادت کی اور برصغیر کے مسلمانوں کے لیے ایک الگ وطن حاصل کرنے کے لیے اپنی زندگی وقف کر دی۔ ان کے نظم و ضبط، عزم اور ایمانداری نے انہیں زندگی کے ہر شعبے کے لوگوں سے گہری عزت دلائی۔ برسوں کی انتھک جدوجہد کے بعد، بالآخر 14 اگست 1947 کو پاکستان معرضِ وجود میں آیا اور جناح اس کے پہلے گورنر جنرل بنے۔ اگرچہ وہ اس کے صرف ایک سال بعد انتقال کر گئے، لیکن ان کا وژن اور قیادت آج بھی لاکھوں پاکستانیوں کو متاثر کرتی ہے، انہیں یاد دلاتی ہے کہ لگن اور محنت سے مشکل ترین اہداف بھی حاصل کیے جا سکتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"pyramids-egypt","ur":"مصر کے اہرام","en":"The Pyramids of Egypt","warmup":[{"en":"The pyramids are very old.","bank":["بہت","اہرام","پرانے","ہیں"],"answer":["اہرام","بہت","پرانے","ہیں"]},{"en":"Ancient Egyptians built the pyramids.","bank":["نے","مصریوں","اہرام","قدیم","تعمیر","کیے"],"answer":["قدیم","مصریوں","نے","اہرام","تعمیر","کیے"]},{"en":"Many tourists visit Egypt every year.","bank":["سیاح","ہر","بہت","سے","جاتے","سال","مصر","ہیں"],"answer":["ہر","سال","بہت","سے","سیاح","مصر","جاتے","ہیں"]},{"en":"This pyramid is very tall.","bank":["بلند","یہ","بہت","اہرام","ہے"],"answer":["یہ","اہرام","بہت","بلند","ہے"]},{"en":"We should respect ancient history.","bank":["کا","تاریخ","احترام","قدیم","ہمیں","کرنا","چاہیے"],"answer":["ہمیں","قدیم","تاریخ","کا","احترام","کرنا","چاہیے"]}],"passage":{"en":"The pyramids of Egypt stand as one of the greatest architectural achievements in human history. Built thousands of years ago as tombs for powerful pharaohs, these massive stone structures continue to amaze historians, engineers, and tourists from around the world. The largest and most famous of these monuments, the Great Pyramid of Giza, was constructed for the Pharaoh Khufu and remained the tallest man-made structure on Earth for thousands of years. Building such enormous structures without modern machinery required extraordinary planning, mathematical precision, and the labor of thousands of skilled workers over many years. Ancient Egyptians believed strongly in life after death, which is why pharaohs were buried alongside valuable treasures meant to accompany them into the afterlife. Today, millions of visitors travel to Egypt each year specifically to witness these incredible monuments in person, making them one of the most important tourist attractions and historical treasures in the entire world.","modelUr":"مصر کے اہرام انسانی تاریخ کے عظیم ترین تعمیراتی کارناموں میں سے ایک کے طور پر کھڑے ہیں۔ ہزاروں سال پہلے طاقتور فرعونوں کے مقبروں کے طور پر تعمیر کیے گئے یہ عظیم پتھریلے ڈھانچے آج بھی دنیا بھر کے مورخین، انجینئرز اور سیاحوں کو حیران کرتے ہیں۔ ان یادگاروں میں سب سے بڑا اور مشہور، گیزا کا عظیم اہرام، فرعون خوفو کے لیے تعمیر کیا گیا تھا اور ہزاروں سال تک زمین پر سب سے بلند انسانی ساختہ ڈھانچہ رہا۔ جدید مشینری کے بغیر اتنے بڑے ڈھانچے بنانے کے لیے غیر معمولی منصوبہ بندی، ریاضیاتی درستگی اور برسوں تک ہزاروں ہنر مند مزدوروں کی محنت درکار تھی۔ قدیم مصری موت کے بعد زندگی پر شدت سے یقین رکھتے تھے، اسی لیے فرعونوں کو قیمتی خزانوں کے ساتھ دفن کیا جاتا تھا جو بعد کی زندگی میں ان کے ساتھ جانے تھے۔ آج، لاکھوں زائرین خاص طور پر ان حیرت انگیز یادگاروں کو ذاتی طور پر دیکھنے کے لیے ہر سال مصر کا سفر کرتے ہیں، جس سے یہ دنیا بھر میں سب سے اہم سیاحتی مقامات اور تاریخی خزانوں میں سے ایک بن گئے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"museum","ur":"میوزیم","en":"The Museum","warmup":[{"en":"We visited the museum yesterday.","bank":["کل","میوزیم","دورہ","کیا","نے","ہم","کا"],"answer":["ہم","نے","کل","میوزیم","کا","دورہ","کیا"]},{"en":"The guide explained the exhibits.","bank":["کی","گائیڈ","نمائشوں","وضاحت","نے","کی"],"answer":["گائیڈ","نے","نمائشوں","کی","وضاحت","کی"]},{"en":"Photography is not allowed here.","bank":["نہیں","کی","یہاں","تصویر","اجازت","کشی","ہے"],"answer":["یہاں","تصویر","کشی","کی","اجازت","نہیں","ہے"]},{"en":"Students learn a lot from museums.","bank":["سے","میوزیم","طلبہ","بہت","سیکھتے","کچھ","ہیں"],"answer":["طلبہ","میوزیم","سے","بہت","کچھ","سیکھتے","ہیں"]},{"en":"This exhibition is very interesting.","bank":["دلچسپ","یہ","بہت","نمائش","ہے"],"answer":["یہ","نمائش","بہت","دلچسپ","ہے"]}],"passage":{"en":"Museums serve as important centers of learning, allowing visitors to explore history, science, art, and culture in ways that textbooks alone cannot provide. Walking through a museum's galleries gives students and adults alike the opportunity to see real artifacts, fossils, and works of art up close, making abstract concepts feel more real and memorable. Natural history museums, in particular, help visitors understand the ancient past by displaying dinosaur skeletons, mineral collections, and models of the solar system. Many museums also offer guided tours and interactive workshops designed specifically for young learners, making the experience both educational and enjoyable. Schools frequently organize field trips to museums as part of the curriculum, recognizing that hands-on learning experiences often leave a stronger impression than classroom lessons alone. Despite their educational value, many museums struggle to attract visitors, which is why it is important for communities to support and regularly visit these valuable cultural institutions.","modelUr":"میوزیم سیکھنے کے اہم مراکز کے طور پر کام کرتے ہیں، جو زائرین کو تاریخ، سائنس، فن اور ثقافت کو ایسے طریقوں سے دریافت کرنے کا موقع دیتے ہیں جو صرف نصابی کتابیں فراہم نہیں کر سکتیں۔ میوزیم کی گیلریوں میں چلنا طلبہ اور بڑوں دونوں کو حقیقی نوادرات، فوسلز اور فن پاروں کو قریب سے دیکھنے کا موقع دیتا ہے، جس سے تجریدی تصورات زیادہ حقیقی اور یادگار محسوس ہوتے ہیں۔ خاص طور پر قدرتی تاریخ کے میوزیم ڈایناسور کے ڈھانچے، معدنیات کے ذخیرے اور نظامِ شمسی کے ماڈل دکھا کر زائرین کو قدیم ماضی سمجھنے میں مدد دیتے ہیں۔ بہت سے میوزیم نوجوان سیکھنے والوں کے لیے خاص طور پر ڈیزائن کیے گئے گائیڈڈ ٹور اور انٹرایکٹو ورکشاپس بھی پیش کرتے ہیں، جس سے تجربہ تعلیمی اور خوشگوار دونوں بن جاتا ہے۔ سکول اکثر نصاب کے حصے کے طور پر میوزیم کے تعلیمی دورے منظم کرتے ہیں، یہ تسلیم کرتے ہوئے کہ عملی سیکھنے کے تجربات اکثر کلاس روم کے اسباق سے زیادہ گہرا اثر چھوڑتے ہیں۔ اپنی تعلیمی اہمیت کے باوجود، بہت سے میوزیم زائرین کو راغب کرنے میں مشکلات کا شکار ہیں، اسی لیے کمیونٹیز کے لیے ان قیمتی ثقافتی اداروں کی حمایت اور باقاعدہ دورہ کرنا ضروری ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"our-games","ur":"ہمارے کھیل","en":"Our Games","warmup":[{"en":"We play traditional games at school.","bank":["سکول","کھیل","روایتی","ہم","کھیلتے","میں","ہیں"],"answer":["ہم","سکول","میں","روایتی","کھیل","کھیلتے","ہیں"]},{"en":"This game teaches teamwork.","bank":["سکھاتا","کھیل","ورک","یہ","ٹیم","ہے"],"answer":["یہ","کھیل","ٹیم","ورک","سکھاتا","ہے"]},{"en":"Children enjoy playing outdoors.","bank":["پسند","بچے","کھیلنا","باہر","کرتے","ہیں"],"answer":["بچے","باہر","کھیلنا","پسند","کرتے","ہیں"]},{"en":"Our team won the competition.","bank":["مقابلہ","گئی","جیت","ٹیم","ہماری"],"answer":["ہماری","ٹیم","مقابلہ","جیت","گئی"]},{"en":"These games are part of our culture.","bank":["ہیں","حصہ","کھیل","ثقافت","یہ","کا","ہماری"],"answer":["یہ","کھیل","ہماری","ثقافت","کا","حصہ","ہیں"]}],"passage":{"en":"Traditional games have been an important part of childhood in Pakistan for generations, bringing children together in neighborhoods and school playgrounds. Games such as gully danda, kokla chhupaki, and rassa kashi require little to no equipment, yet they teach valuable skills such as teamwork, patience, physical coordination, and social interaction. Unlike modern video games, which are often played alone or online, traditional games encourage face-to-face communication and build strong friendships among players. In recent years, however, these games have started disappearing from streets and playgrounds as children spend increasing amounts of time on smartphones and computer screens. Concerned parents, teachers, and community leaders have begun organizing events specifically to reintroduce traditional games to a new generation. Many schools now dedicate special days to these activities, and children who participate often report that they enjoy the physical activity and social connection just as much as their parents did decades earlier.","modelUr":"روایتی کھیل نسلوں سے پاکستان میں بچپن کا ایک اہم حصہ رہے ہیں، جو بچوں کو محلوں اور سکول کے کھیل کے میدانوں میں اکٹھا کرتے ہیں۔ گلی ڈنڈا، کوکلا چھپاکی اور رسہ کشی جیسے کھیلوں کے لیے بہت کم یا کوئی سامان درکار نہیں ہوتا، پھر بھی یہ ٹیم ورک، صبر، جسمانی ہم آہنگی اور سماجی میل جول جیسی قیمتی مہارتیں سکھاتے ہیں۔ جدید ویڈیو گیمز کے برعکس، جو اکثر اکیلے یا آن لائن کھیلے جاتے ہیں، روایتی کھیل آمنے سامنے بات چیت کی حوصلہ افزائی کرتے ہیں اور کھلاڑیوں کے درمیان مضبوط دوستیاں بناتے ہیں۔ تاہم، حالیہ برسوں میں یہ کھیل گلیوں اور کھیل کے میدانوں سے غائب ہونا شروع ہو گئے ہیں کیونکہ بچے سمارٹ فونز اور کمپیوٹر سکرینوں پر بڑھتا ہوا وقت گزار رہے ہیں۔ فکرمند والدین، اساتذہ اور کمیونٹی رہنماؤں نے نئی نسل کو روایتی کھیلوں سے دوبارہ متعارف کرانے کے لیے خصوصی طور پر تقریبات کا انعقاد شروع کر دیا ہے۔ بہت سے سکول اب ان سرگرمیوں کے لیے خصوصی دن مختص کرتے ہیں، اور حصہ لینے والے بچے اکثر بتاتے ہیں کہ وہ جسمانی سرگرمی اور سماجی رابطے سے اتنا ہی لطف اندوز ہوتے ہیں جتنا ان کے والدین دہائیوں پہلے ہوتے تھے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"village-city-life","ur":"دیہات اور شہر کی زندگی","en":"Village and City Life","warmup":[{"en":"Village life is peaceful and simple.","bank":["زندگی","پرسکون","دیہاتی","سادہ","اور","ہے"],"answer":["دیہاتی","زندگی","پرسکون","اور","سادہ","ہے"]},{"en":"Many people move to cities for work.","bank":["کے","شہروں","بہت","لیے","کام","کی","لوگ","طرف","منتقل","سے","ہوتے","ہیں"],"answer":["بہت","سے","لوگ","کام","کے","لیے","شہروں","کی","طرف","منتقل","ہوتے","ہیں"]},{"en":"Farmers work hard in the fields.","bank":["محنت","کھیتوں","کسان","سخت","میں","کرتے","ہیں"],"answer":["کسان","کھیتوں","میں","سخت","محنت","کرتے","ہیں"]},{"en":"Cities offer better schools and hospitals.","bank":["بہتر","ہسپتال","شہر","سکول","اور","فراہم","کرتے","ہیں"],"answer":["شہر","بہتر","سکول","اور","ہسپتال","فراہم","کرتے","ہیں"]},{"en":"We should value both village and city life.","bank":["اور","دیہاتی","شہری","دونوں","قدر","زندگیوں","ہمیں","کی","کرنی","چاہیے"],"answer":["ہمیں","دیہاتی","اور","شہری","دونوں","زندگیوں","کی","قدر","کرنی","چاہیے"]}],"passage":{"en":"The contrast between village and city life in Pakistan is significant, with each offering distinct advantages and challenges. Village life tends to be simpler and more peaceful, centered around farming, close family ties, and a strong sense of community, where neighbors often know and support one another. However, villages frequently lack access to quality education, advanced healthcare, and diverse employment opportunities, which pushes many young people toward cities in search of better prospects. City life, on the other hand, offers modern conveniences such as well-equipped hospitals, universities, and a wide range of job opportunities, but it also comes with challenges including pollution, traffic congestion, and a faster, often more stressful pace of life. Many people who move from villages to cities find themselves missing the fresh air and close relationships of their hometowns, even while enjoying the greater opportunities available in urban areas. Ultimately, both lifestyles have important value.","modelUr":"پاکستان میں دیہاتی اور شہری زندگی کے درمیان فرق نمایاں ہے، ہر ایک اپنے الگ فوائد اور چیلنجز پیش کرتا ہے۔ دیہاتی زندگی زیادہ سادہ اور پرسکون ہوتی ہے، جو کاشتکاری، قریبی خاندانی رشتوں اور کمیونٹی کے مضبوط احساس کے گرد گھومتی ہے، جہاں پڑوسی اکثر ایک دوسرے کو جانتے اور ایک دوسرے کی مدد کرتے ہیں۔ تاہم، دیہاتوں میں اکثر معیاری تعلیم، جدید طبی سہولیات اور متنوع روزگار کے مواقع تک رسائی نہیں ہوتی، جو بہت سے نوجوانوں کو بہتر مواقع کی تلاش میں شہروں کی طرف دھکیلتی ہے۔ دوسری طرف، شہری زندگی جدید سہولیات جیسے اچھی طرح لیس ہسپتال، یونیورسٹیاں اور ملازمت کے وسیع مواقع فراہم کرتی ہے، لیکن اس کے ساتھ آلودگی، ٹریفک جام اور تیز رفتار، اکثر زیادہ تناؤ والی زندگی جیسے چیلنجز بھی آتے ہیں۔ بہت سے لوگ جو دیہاتوں سے شہروں کی طرف منتقل ہوتے ہیں، شہری علاقوں میں دستیاب زیادہ مواقع سے لطف اندوز ہوتے ہوئے بھی اپنے آبائی علاقوں کی تازہ ہوا اور قریبی تعلقات کو یاد کرتے ہیں۔ بالآخر، دونوں طرزِ زندگی کی اپنی اہم قدر ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"journey-north","ur":"شمال کا سفر","en":"A Journey to the North","warmup":[{"en":"We travelled to the northern areas.","bank":["کی","علاقوں","طرف","شمالی","ہم","گئے"],"answer":["ہم","شمالی","علاقوں","کی","طرف","گئے"]},{"en":"The mountains were covered with snow.","bank":["برف","پہاڑ","سے","تھے","ڈھکے","ہوئے"],"answer":["پہاڑ","برف","سے","ڈھکے","ہوئے","تھے"]},{"en":"We stayed in a small hotel.","bank":["ہوٹل","چھوٹے","ٹھہرے","ہم","ایک","میں"],"answer":["ہم","ایک","چھوٹے","ہوٹل","میں","ٹھہرے"]},{"en":"The local people were very friendly.","bank":["دوستانہ","لوگ","بہت","مقامی","تھے"],"answer":["مقامی","لوگ","بہت","دوستانہ","تھے"]},{"en":"This was an unforgettable journey.","bank":["فراموش","ناقابلِ","یہ","سفر","ایک","تھا"],"answer":["یہ","ایک","ناقابلِ","فراموش","سفر","تھا"]}],"passage":{"en":"Pakistan's northern areas are widely regarded as some of the most breathtaking landscapes in the world, attracting travelers from across the country and beyond. The journey typically begins along the Karakoram Highway, an engineering marvel that winds through towering mountains, deep valleys, and alongside pristine rivers and lakes. Popular destinations such as Hunza and Skardu offer visitors a chance to experience unique local cultures, taste delicious fresh fruits, and explore historic sites like Altit Fort. Beyond the scenery, travelers often remember the warmth and hospitality of the local communities, who welcome visitors with genuine kindness. Camping under a clear night sky, far from city lights, allows visitors to see thousands of stars, an experience impossible in most urban areas. Despite the long and sometimes challenging journey, most travelers agree that a trip to the northern areas is well worth the effort, creating memories that last a lifetime.","modelUr":"پاکستان کے شمالی علاقہ جات کو دنیا کے سب سے دلکش مناظر میں سے ایک سمجھا جاتا ہے، جو ملک بھر اور اس سے باہر سے سیاحوں کو اپنی طرف کھینچتے ہیں۔ سفر عام طور پر شاہراہِ قراقرم کے ساتھ شروع ہوتا ہے، جو انجینئرنگ کا ایک شاہکار ہے اور بلند پہاڑوں، گہری وادیوں اور صاف دریاؤں اور جھیلوں کے کنارے سے گزرتی ہے۔ ہنزہ اور سکردو جیسے مقبول مقامات زائرین کو منفرد مقامی ثقافتوں کا تجربہ کرنے، لذیذ تازہ پھلوں کا ذائقہ چکھنے اور التت قلعہ جیسے تاریخی مقامات کی سیر کرنے کا موقع دیتے ہیں۔ مناظر کے علاوہ، سیاح اکثر مقامی برادریوں کی گرمجوشی اور مہمان نوازی کو یاد رکھتے ہیں، جو زائرین کا خلوص کے ساتھ استقبال کرتے ہیں۔ شہر کی روشنیوں سے دور، صاف رات کے آسمان تلے کیمپنگ کرنا زائرین کو ہزاروں ستارے دیکھنے کا موقع دیتا ہے، ایک ایسا تجربہ جو زیادہ تر شہری علاقوں میں ممکن نہیں۔ طویل اور بعض اوقات مشکل سفر کے باوجود، زیادہ تر سیاح متفق ہیں کہ شمالی علاقہ جات کا سفر محنت کے قابل ہے، جو زندگی بھر رہنے والی یادیں بناتا ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"plantation-drive","ur":"شجرکاری مہم","en":"A Tree Plantation Drive","warmup":[{"en":"We planted trees in the park.","bank":["درخت","پارک","ہم","میں","نے","لگائے"],"answer":["ہم","نے","پارک","میں","درخت","لگائے"]},{"en":"Trees give us clean air.","bank":["صاف","درخت","ہمیں","ہوا","دیتے","ہیں"],"answer":["درخت","ہمیں","صاف","ہوا","دیتے","ہیں"]},{"en":"Volunteers watered the young plants.","bank":["نے","پودوں","کو","نئے","رضاکاروں","پانی","دیا"],"answer":["رضاکاروں","نے","نئے","پودوں","کو","پانی","دیا"]},{"en":"Everyone should plant at least one tree.","bank":["ایک","کم","کو","از","درخت","ہر","لگانا","کم","ایک","چاہیے"],"answer":["ہر","ایک","کو","کم","از","کم","ایک","درخت","لگانا","چاہیے"]},{"en":"This campaign was very successful.","bank":["کامیاب","مہم","بہت","یہ","رہی"],"answer":["یہ","مہم","بہت","کامیاب","رہی"]}],"passage":{"en":"Tree plantation drives have become an increasingly important activity across Pakistan as communities work to combat pollution, deforestation, and the effects of climate change. These organized events typically bring together students, government employees, and ordinary citizens who volunteer their time to plant thousands of saplings in parks, schools, and along roadsides. Before planting begins, organizers usually provide brief training on proper planting techniques, including digging appropriately sized holes, positioning saplings correctly, and watering them adequately. After the event, responsibility for caring for the young trees is often assigned to schools, neighborhood committees, or individual volunteers who commit to regular watering and monitoring. Successful plantation drives have shown measurable results, including improved air quality and reduced temperatures in previously bare urban areas. Given these clear benefits, many cities have committed to holding plantation drives annually, encouraging citizens to take an active role in protecting their local environment.","modelUr":"شجرکاری مہمات پاکستان بھر میں ایک تیزی سے اہم سرگرمی بن چکی ہیں کیونکہ کمیونٹیز آلودگی، جنگلات کی کٹائی اور موسمیاتی تبدیلی کے اثرات کا مقابلہ کرنے کے لیے کام کر رہی ہیں۔ یہ منظم تقریبات عام طور پر طلبہ، سرکاری ملازمین اور عام شہریوں کو اکٹھا کرتی ہیں جو پارکوں، سکولوں اور سڑکوں کے کنارے ہزاروں پودے لگانے کے لیے اپنا وقت رضاکارانہ طور پر دیتے ہیں۔ لگانے سے پہلے، منتظمین عام طور پر صحیح طریقہ کار کے بارے میں مختصر تربیت فراہم کرتے ہیں، جس میں مناسب سائز کے گڑھے کھودنا، پودوں کو صحیح طریقے سے رکھنا اور انہیں مناسب پانی دینا شامل ہے۔ تقریب کے بعد، نئے پودوں کی دیکھ بھال کی ذمہ داری اکثر سکولوں، محلہ کمیٹیوں یا انفرادی رضاکاروں کو دی جاتی ہے جو باقاعدہ پانی دینے اور نگرانی کا عہد کرتے ہیں۔ کامیاب شجرکاری مہمات نے قابلِ پیمائش نتائج دکھائے ہیں، جن میں ہوا کے معیار میں بہتری اور پہلے ویران شہری علاقوں میں درجہ حرارت میں کمی شامل ہے۔ ان واضح فوائد کو دیکھتے ہوئے، بہت سے شہروں نے ہر سال شجرکاری مہمات منعقد کرنے کا عہد کیا ہے، جو شہریوں کو اپنے مقامی ماحول کے تحفظ میں فعال کردار ادا کرنے کی ترغیب دیتا ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"water-conservation","ur":"پانی کا تحفظ","en":"Water Conservation","warmup":[{"en":"We should not waste water.","bank":["نہیں","پانی","چاہیے","کرنا","ہمیں","ضائع"],"answer":["ہمیں","پانی","ضائع","نہیں","کرنا","چاہیے"]},{"en":"This tap is leaking.","bank":["ٹپک","نلکا","یہ","رہا","ہے"],"answer":["یہ","نلکا","ٹپک","رہا","ہے"]},{"en":"Clean water is necessary for life.","bank":["زندگی","ضروری","صاف","پانی","کے","ہے","لیے"],"answer":["صاف","پانی","زندگی","کے","لیے","ضروری","ہے"]},{"en":"We collected rainwater for the garden.","bank":["نے","بارش","باغ","کے","ہم","پانی","لیے","کا","جمع","کیا"],"answer":["ہم","نے","باغ","کے","لیے","بارش","کا","پانی","جمع","کیا"]},{"en":"Every family should save water.","bank":["پانی","چاہیے","خاندان","بچانا","ہر","کو"],"answer":["ہر","خاندان","کو","پانی","بچانا","چاہیے"]}],"passage":{"en":"Access to clean water is a basic human necessity, yet water scarcity has become an increasingly serious problem in many parts of the world, including Pakistan. Population growth, industrial development, and wasteful daily habits have placed enormous pressure on natural water resources, leaving many communities struggling to access sufficient clean drinking water. Simple household changes can make a significant difference in reducing water waste. Turning off taps while brushing teeth, promptly repairing leaking faucets, and running washing machines only when fully loaded are all effective ways to conserve water without much effort or expense. Collecting rainwater for garden use is another practical method that many families have begun adopting. Beyond individual households, industries must also treat and reuse water responsibly, while governments should enforce water conservation policies and run public awareness campaigns. If every citizen commits to these small changes, future generations can be assured access to this essential resource.","modelUr":"صاف پانی تک رسائی ایک بنیادی انسانی ضرورت ہے، پھر بھی دنیا کے بہت سے حصوں میں، بشمول پاکستان، پانی کی کمی ایک تیزی سے سنگین مسئلہ بن چکی ہے۔ آبادی میں اضافے، صنعتی ترقی اور فضول خرچ روزمرہ عادات نے قدرتی آبی وسائل پر زبردست دباؤ ڈالا ہے، جس سے بہت سی کمیونٹیز کو کافی صاف پینے کا پانی حاصل کرنے میں مشکلات کا سامنا ہے۔ گھریلو سطح پر سادہ تبدیلیاں پانی کے ضیاع کو کم کرنے میں نمایاں فرق پیدا کر سکتی ہیں۔ دانت صاف کرتے وقت نلکا بند رکھنا، ٹپکتے نلکوں کی فوری مرمت کروانا اور واشنگ مشین کو صرف مکمل بھرے ہونے پر چلانا، یہ سب زیادہ محنت یا خرچے کے بغیر پانی بچانے کے مؤثر طریقے ہیں۔ باغ کے استعمال کے لیے بارش کا پانی جمع کرنا ایک اور عملی طریقہ ہے جسے بہت سے خاندانوں نے اپنانا شروع کر دیا ہے۔ انفرادی گھرانوں کے علاوہ، صنعتوں کو بھی پانی کو ذمہ داری سے صاف اور دوبارہ استعمال کرنا چاہیے، جبکہ حکومتوں کو پانی کے تحفظ کی پالیسیاں نافذ کرنی چاہییں اور عوامی آگاہی مہمات چلانی چاہییں۔ اگر ہر شہری ان چھوٹی تبدیلیوں کا عہد کرے تو آنے والی نسلوں کے لیے اس اہم وسیلے تک رسائی یقینی بنائی جا سکتی ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}}];

قی اور غیر ذمہ دارانہ استعمال کی وجہ سے پانی کے قدرتی ذخائر پر دباؤ بڑھ رہا ہے۔ بہت سے علاقوں میں لوگوں کو پینے کے صاف پانی کے حصول میں شدید مشکلات کا سامنا ہے۔\n\nپانی کے ضیاع کو روکنے کے لیے ہمیں اپنی روزمرہ کی عادات میں تبدیلی لانی ہوگی۔ نلکے کو غیر ضروری طور پر کھلا نہ چھوڑیں، برتن دھوتے وقت پانی کا ضیاع کم کریں، اور خراب نلکوں کی فوری مرمت کروائیں۔ گھروں اور کھیتوں میں بارش کے پانی کو ذخیرہ کرنے کے طریقے اپنانا بھی ایک مؤثر قدم ہے۔\n\nصنعتوں کو بھی چاہیے کہ وہ پانی کو صاف کر کے دوبارہ استعمال کریں تاکہ قدرتی ذخائر پر بوجھ کم ہو۔ حکومت کی جانب سے پانی کے تحفظ سے متعلق قوانین بنانا اور عوام میں آگاہی مہمات چلانا بھی ضروری ہے۔ سکولوں میں بچوں کو بچپن ہی سے پانی کی اہمیت اور اس کے تحفظ کے بارے میں تعلیم دی جانی چاہیے۔\n\nاگر ہم سب مل کر ذمہ داری سے کام لیں تو آنے والی نسلوں کے لیے صاف پانی کی دستیابی یقینی بنائی جا سکتی ہے۔ پانی کا تحفظ صرف حکومت کی نہیں بلکہ ہر فرد کی ذمہ داری ہے۔","modelSummary":"صاف پانی کی کمی ایک سنگین مسئلہ ہے جو آبادی میں اضافے اور غیر ذمہ دارانہ استعمال سے بڑھ رہا ہے۔ اس کے تحفظ کے لیے نلکوں کا بے جا استعمال روکنا، برتن دھوتے وقت احتیاط کرنا اور بارش کے پانی کو ذخیرہ کرنا ضروری ہے۔ صنعتوں کو پانی دوبارہ استعمال کرنا چاہیے اور حکومت کو قوانین اور آگاہی مہمات چلانی چاہییں۔ اگر ہر فرد ذمہ داری سے کام لے تو آنے والی نسلوں کے لیے صاف پانی محفوظ رکھا جا سکتا ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے پانی کے تحفظ کے کم از کم تین طریقے شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"team-spirit","ur":"ٹیم ورک کی اہمیت","en":"The Importance of Teamwork","passage":"کھیلوں میں کامیابی کے لیے انفرادی صلاحیت کے ساتھ ساتھ ٹیم ورک بھی بہت ضروری ہے۔ کرکٹ ہو یا فٹ بال، کوئی بھی کھلاڑی اکیلے میچ نہیں جیت سکتا۔ ہر کھلاڑی کو اپنی ذمہ داری سمجھتے ہوئے ٹیم کے مفاد کو ذاتی خواہشات پر ترجیح دینی چاہیے۔\n\nاچھی ٹیم میں ہر رکن دوسرے کی مدد کرتا ہے اور مشکل وقت میں حوصلہ بڑھاتا ہے۔ کپتان کی ذمہ داری ہے کہ وہ ٹیم کو متحد رکھے اور ہر کھ حیح استعمال کے بارے میں رہنمائی فراہم کریں۔","modelSummary":"سوشل میڈیا نے رابطے اور معلومات کے حصول کو آسان بنا دیا ہے اور طلبہ کو تعلیمی مواد تک رسائی بھی دیتا ہے۔ لیکن زیادہ استعمال سے وقت کا ضیاع، حقیقی تعلقات میں کمی اور جھوٹی خبروں کا پھیلاؤ جیسے نقصانات بھی ہیں۔ اس لیے سوشل میڈیا کا متوازن اور ذمہ دارانہ استعمال ضروری ہے، اور والدین و اساتذہ کو بچوں کی رہنمائی کرنی چاہیے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے سوشل میڈیا کے کم از کم دو فوائد اور دو نقصانات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"margalla-hiking","ur":"مارگلہ کی سیر","en":"A Trip to the Margalla Hills","passage":"مارگلہ کی پہاڑیاں اسلام آباد کے قریب واقع ہیں اور سیاحوں کے لیے ایک مقبول مقام ہیں۔ یہاں کے راستے ہائیکنگ کے شوقین افراد کے لیے بہترین ہیں، جہاں وہ تازہ ہوا میں چہل قدمی کرتے ہوئے قدرتی مناظر سے لطف اندوز ہو سکتے ہیں۔\n\nپچھلے ہفتے ہمارا خاندان مارگلہ کی پہاڑیوں کی سیر کے لیے گیا۔ ہم نے صبح سویرے چڑھائی شروع کی تاکہ دن کی گرمی سے بچ سکیں۔ راستے میں ہمیں مختلف اقسام کے پرندے اور درخت نظر آئے۔ چوٹی تک پہنچنے میں تقریباً دو گھنٹے لگے، لیکن وہاں سے شہر کا نظارہ اتنا خوبصورت تھا کہ ساری تھکاوٹ دور ہو گئی۔\n\nراستے میں ہم نے کچرا نہ پھینکنے کا خیال رکھا اور دوسرے سیاحوں کو بھی صفائی کی اہمیت کے بارے میں بتایا۔ نیچے اترتے وقت ہم نے مقامی دکانداروں سے تازہ پھلوں کا رس خریدا۔\n\nیہ سفر ہمارے خاندان کے لیے یادگار تجربہ ثابت ہوا۔ اس سے ہم نے سیکھا کہ فطرت سے قربت انسان کو ذہنی سکون فراہم کرتی ہے اور ہمیں اپنے ماحول کی حفاظت کرنی چاہیے۔","modelSummary":"مارگلہ کی پہاڑیاں اسلام آباد کے قریب ایک مقبول سیاحتی مقام ہیں۔ خاندان نے صبح سویرے چڑھائی شروع کی، راستے میں پرندے اور درخت دیکھے، اور دو گھنٹے میں چوٹی پر پہنچ کر خوبصورت نظارہ دیکھا۔ انہوں نے صفائی کا خیال رکھا اور واپسی پر مقامی پھلوں کا رس خریدا۔ یہ سفر یادگار رہا اور فطرت سے قربت اور ماحول کی حفاظت کی اہمیت سکھا گیا۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے سفر کے کم از کم تین مراحل شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"quaid-e-azam-life","ur":"قائدِ اعظم کی زندگی","en":"The Life of Quaid-e-Azam","passage":"محمد علی جناح، جنہیں قائدِ اعظم کے نام سے جانا جاتا ہے، پاکستان کے بانی تھے۔ وہ 25 دسمبر 1876 کو کراچی میں پیدا ہوئے۔ انہوں نے انگلستان جا کر قانون کی تعلیم حاصل کی اور واپس آ کر ایک کامیاب وکیل کے طور پر کام کیا۔\n\nقائدِ اعظم نے مسلم لیگ کی قیادت سنبھالی اور برصغیر کے مسلمانوں کے حقوق کے لیے انتھک محنت کی۔ ان کی زندگی نظم و ضبط، ایمانداری اور محنت کی بہترین مثال تھی۔ انہوں نے مسلمانوں کو ایک الگ وطن کے حصول کے لیے متحد کیا اور \"اتحاد، ایمان، تنظیم\" کا نعرہ دیا۔\n\nطویل جدوجہد کے بعد، 14 اگست 1947 کو پاکستان ایک آزاد ریاست کے طور پر معرضِ وجود میں آیا اور قائدِ اعظم پاکستان کے پہلے گورنر جنرل بنے۔ بدقسمتی سے، وہ زیادہ عرصہ زندہ نہ رہ سکے اور 11 ستمبر 1948 کو انتقال کر گئے۔\n\nآج بھی قائدِ اعظم کی قیادت اور قربانیاں ہر پاکستانی کے لیے فخر اور تحریک کا باعث ہیں۔ ان کی زندگی ہمیں سکھاتی ہے کہ عزم اور محنت سے کوئی بھی مقصد حاصل کیا جا سکتا ہے۔","modelSummary":"محمد علی جناح، پاکستان کے بانی، 1876 میں کراچی میں پیدا ہوئے اور قانون کی تعلیم حاصل کی۔ انہوں نے مسلم لیگ کی قیادت کی اور مسلمانوں کو ایک الگ وطن کے حصول کے لیے متحد کیا۔ 14 اگست 1947 کو پاکستان آزاد ہوا اور وہ پہلے گورنر جنرل بنے۔ ان کا انتقال 1948 میں ہوا، لیکن ان کی قیادت آج بھی پاکستانیوں کے لیے فخر اور تحریک کا باعث ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے قائدِ اعظم کی زندگی کے کم از کم تین اہم واقعات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"pyramids-of-egypt","ur":"مصر کے اہرام","en":"The Pyramids of Egypt","passage":"مصر کے اہرام دنیا کے قدیم ترین اور حیرت انگیز تعمیراتی شاہکاروں میں شمار ہوتے ہیں۔ یہ اہرام تقریباً چار ہزار پانچ سو سال پہلے قدیم مصری بادشاہوں (فرعونوں) کے مقبروں کے طور پر تعمیر کیے گئے تھے۔ سب سے مشہ  اسے منانا اور محفوظ رکھنا ہر پاکستانی کی ذمہ داری ہے۔","modelSummary":"پاکستان مختلف ثقافتوں، زبانوں اور روایات کا حسین امتزاج ہے، جہاں ہر صوبے کی اپنی منفرد شناخت ہے۔ لوگ اپنے مقامی تہوار جوش سے مناتے ہیں جو موسیقی، رقص اور کھانوں کے ساتھ منسلک ہیں۔ اس تنوع کی قدر کرنے اور رواداری فروغ دینے کے لیے سکولوں کو آگاہی دینی چاہیے۔ یہ تنوع پاکستان کی طاقت ہے اور اسے محفوظ رکھنا ضروری ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے ثقافتی تنوع کے کم از کم دو نکات شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"mental-health-awareness","ur":"ذہنی صحت کی آگاہی","en":"Mental Health Awareness","passage":"جسمانی صحت کی طرح ذہنی صحت بھی ایک صحت مند زندگی کے لیے اتنی ہی اہم ہے، لیکن ہمارے معاشرے میں اس موضوع پر بات کرنا اب بھی مشکل سمجھا جاتا ہے۔ بہت سے لوگ ذہنی دباؤ، پریشانی یا اداسی کا شکار ہونے کے باوجود مدد لینے سے ہچکچاتے ہیں کیونکہ انہیں معاشرتی تنقید کا خوف ہوتا ہے۔\n\nنوجوانوں میں امتحانات کا دباؤ، سوشل میڈیا کا اثر اور مستقبل کی فکر ذہنی دباؤ کی عام وجوہات ہیں۔ ماہرین کا کہنا ہے کہ اگر ابتدائی مراحل میں ہی ذہنی دباؤ کو پہچان لیا جائے تو اس کا علاج کرنا آسان ہو جاتا ہے۔\n\nسکولوں اور خاندانوں کو چاہیے کہ وہ ایک ایسا ماحول فراہم کریں جہاں بچے اپنے جذبات کھل کر بیان کر سکیں بغیر کسی خوف کے۔ کھیلوں میں حصہ لینا، دوستوں سے بات کرنا اور کافی نیند لینا ذہنی صحت بہتر بنانے کے آسان طریقے ہیں۔\n\nمعاشرے کو ذہنی صحت کے بارے میں غلط فہمیوں کو دور کرنا ہوگا اور اسے جسمانی صحت جتنی ہی اہمیت دینی ہوگی، تاکہ لوگ بلا جھجک مدد حاصل کر سکیں۔","modelSummary":"ذہنی صحت جسمانی صحت جتنی ہی اہم ہے، لیکن معاشرے میں اس پر بات کرنا مشکل سمجھا جاتا ہے۔ نوجوانوں میں امتحانات اور سوشل میڈیا دباؤ کی عام وجوہات ہیں۔ سکولوں اور خاندانوں کو کھلا ماحول فراہم کرنا چاہیے۔ کھیل، دوستوں سے بات چیت اور نیند ذہنی صحت بہتر بناتے ہیں۔ معاشرے کو غلط فہمیاں دور کر کے ذہنی صحت کو اہمیت دینی چاہیے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے ذہنی دباؤ کی کم از کم دو وجوہات شامل کیں؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"saving-endangered-species","ur":"خطرے سے دوچار انواع کو بچانا","en":"Saving Endangered Species","passage":"دنیا بھر میں بہت سی جانوروں کی انواع، جیسے ہاتھی، شیر اور گینڈے، معدومیت کے خطرے سے دوچار ہیں۔ اس کی بڑی وجوہات جنگلات کی کٹائی، غیر قانونی شکار اور آب و ہوا کی تبدیلی ہیں۔ جیسے جیسے انسانی آبادی بڑھتی ہے، جنگلی جانوروں کے قدرتی مسکن سکڑتے جا رہے ہیں۔\n\nہاتھیوں کو خاص طور پر ان کے قیمتی دانتوں کی وجہ سے نشانہ بنایا جاتا ہے، جبکہ شیروں کا شکار ان کی کھال اور اعضاء کے لیے کیا جاتا ہے۔ اگر ان جانوروں کے تحفظ کے لیے سنجیدہ اقدامات نہ کیے گئے تو آنے والی نسلیں انہیں صرف تصاویر میں دیکھ پائیں گی۔\n\nکئی تنظیمیں اور حکومتیں سینکچوریز قائم کر رہی ہیں، سخت قوانین بنا رہی ہیں اور عوام میں آگاہی مہمات چلا رہی ہیں تاکہ ان جانوروں کو بچایا جا سکے۔ سکولوں میں بچوں کو چھوٹی عمر سے ہی ماحولیات اور جنگلی حیات کے تحفظ کی اہمیت سکھانا بھی ضروری ہے۔\n\nاگر پوری دنیا مل کر کوشش کرے تو ہم اپنی زمین کے ان شاندار مخلوقات کو معدومیت سے بچا سکتے ہیں۔","modelSummary":"جنگلات کی کٹائی، غیر قانونی شکار اور آب و ہوا کی تبدیلی کی وجہ سے ہاتھی اور شیر جیسی انواع معدومیت کے خطرے سے دوچار ہیں۔ ہاتھیوں کا شکار دانتوں کے لیے کیا جاتا ہے۔ حکومتیں اور تنظیمیں سینکچوریز اور قوانین کے ذریعے انہیں بچانے کی کوشش کر رہی ہیں۔ سکولوں میں بچوں کو ماحولیات کی اہمیت سکھانا بھی ضروری ہے تاکہ یہ مخلوقات معدوم نہ ہوں۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے معدومیت کی کم از کم دو وجوہات شامل کیں؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"cricket-and-national-unity","ur":"کرکٹ اور قومی اتحاد","en":"Cricket and National Unity","passage":"کرکٹ پاکستان میں محض ایک کھیل نہیں بلکہ قومی جذبات اور اتحاد کی علامت بن چکا ہے۔ جب پاکستانی ٹیم کوئی اہم میچ کھیلتی ہے تو پورا ملک، مذہب، زبان اور صوبے کے فرق کے بغیر، ایک ساتھ ٹیم کی حمایت کر /* ======================================================================
   DIFFICULTY
   Easy = fewer options + a hint, so a struggling learner still gets a win.
   Medium = the original v1 experience.
   Hard = more options, no hints, plus one open-ended "Creative Corner" or
   reflective task at the end (self-checked, not auto-graded — free Urdu
   writing can't be marked reliably by this app).
   ====================================================================== */
const LEVELS = [
  { key:"easy",   en:"Easy",   ur:"آسان" },
  { key:"medium", en:"Medium", ur:"درمیانہ" },
  { key:"hard",   en:"Hard",   ur:"مشکل" }
];
function levelCfg(level){
  if(level==="easy")   return { quizCount:4, optCount:2, hint:true,  creative:false };
  if(level==="hard")   return { quizCount:8, optCount:4, hint:false, creative:true  };
  return                      { quizCount:6, optCount:4, hint:false, creative:false }; // medium
}
// Trims an options array down to `count` choices while keeping the correct
// one in the set, and returns the correct answer's new index.
function sliceOptions(opts, correctIdx, count){
  if(count>=opts.length) return { opts:opts.slice(), a:correctIdx };
  const correctVal = opts[correctIdx];
  const others = opts.filter((_,i)=>i!==correctIdx).sort(()=>Math.random()-0.5).slice(0, Math.max(0,count-1));
  const finalOpts = others.concat([correctVal]).sort(()=>Math.random()-0.5);
  return { opts:finalOpts, a: finalOpts.indexOf(correctVal) };
}

/* ======================================================================
   PROGRESS  (localStorage — per-device, no login)
   ====================================================================== */
const STORE_KEY = "urdu-safar-progress-v1";
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(p){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();
function sectionStars(topicId, sectionKey){
  const p = progress[topicId] && progress[topicId][sectionKey];
  return p ? p.stars : 0;
}
function setSectionResult(topicId, sectionKey, correct, total){
  if(!progress[topicId]) progress[topicId] = {};
  const pct = total ? correct/total : 0;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  progress[topicId][sectionKey] = { correct, total, stars, done:true };
  saveProgress(progress);
  refreshPlayerLeaderboardEntry();
}
function topicTotalStars(topicId){
  return SECTIONS.reduce((s,sec)=> s + sectionStars(topicId, sec.key), 0);
}
function isTopicMastered(topicId){
  return SECTIONS.every(sec => sectionStars(topicId, sec.key) >= 2);
}
function overallStars(){
  return TOPICS.reduce((s,t)=> s + topicTotalStars(t.id), 0);
}
function masteredCount(){
  return TOPICS.filter(t=>isTopicMastered(t.id)).length;
}
// Writing-prompt completion, used only by the Skills feature (free-write
// prompts aren't auto-graded, so they're tracked as done/not-done, not stars).
function markPromptDone(skillId, idx){
  if(!progress[skillId]) progress[skillId] = {};
  if(!progress[skillId].prompts) progress[skillId].prompts = {};
  progress[skillId].prompts[idx] = true;
  saveProgress(progress);
}
function isPromptDone(skillId, idx){
  return !!(progress[skillId] && progress[skillId].prompts && progress[skillId].prompts[idx]);
}
function promptsDoneCount(skillId){
  const skill = SKILLS.find(s=>s.id===skillId);
  const n = skill ? skill.prompts.length : 0;
  let done = 0;
  for(let i=0;i<n;i++) if(isPromptDone(skillId,i)) done++;
  return done;
}

const PLAYER_KEY = "urdu-safar-player-v1";
function loadPlayer(){
  try{
    const raw = localStorage.getItem(PLAYER_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function savePlayer(p){
  try{ localStorage.setItem(PLAYER_KEY, JSON.stringify(p)); }catch(e){}
}
function newPlayerId(){
  try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  return "p" + Date.now() + "-" + Math.random().toString(36).slice(2);
}
let player = loadPlayer();

function medalForStars(stars){
  return stars===3 ? "gold" : stars===2 ? "silver" : stars===1 ? "bronze" : null;
}
function computeMedalTotals(){
  let gold=0, silver=0, bronze=0;
  TOPICS.forEach(t=> SECTIONS.forEach(sec=>{
    const m = medalForStars(sectionStars(t.id, sec.key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  SKILLS.forEach(s=>{
    const m = medalForStars(sectionStars(s.id, "practice"));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  ["wordquiz","idioms"].forEach(kind=>{
    const m = medalForStars(vpStars(kind));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  READING_SKILLS.forEach(t=> ["short","matching","notes"].forEach(key=>{
    const m = medalForStars(rsStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  GRAMMAR_LAB.forEach(t=> ["cloze","transform"].forEach(key=>{
    const m = medalForStars(glStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  TRANSLATION.forEach(t=> ["warmup","passage"].forEach(key=>{
    const m = medalForStars(trStars(t.id, key));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  }));
  SUMMARY_WRITING.forEach(t=>{
    const m = medalForStars(swStars(t.id));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  EXTENDED_WRITING.forEach(t=>{
    const m = medalForStars(ewStars(t.id));
    if(m==="gold") gold++; else if(m==="silver") silver++; else if(m==="bronze") bronze++;
  });
  return { gold, silver, bronze, score: gold*3 + silver*2 + bronze*1 };
}

// Lenient short-answer check: Urdu spelling varies, so accept an exact
// match after trimming punctuation/whitespace, or either string containing
// the other (handles "10 بجے" vs "صبح 10 بجے"-style acceptable variants).
function normalizeAnswer(s){
  return (s||"").trim().replace(/[۔،؟!.,?]/g,"").replace(/\s+/g," ").toLowerCase();
}
function isShortAnswerCorrect(given, acceptable){
  const g = normalizeAnswer(given);
  if(!g) return false;
  return acceptable.some(a=>{
    const na = normalizeAnswer(a);
    return g===na || g.includes(na) || na.includes(g);
  });
}

/* ======================================================================
   VOCABULARY PRACTICE — data layer
   A dedicated, cross-topic practice mode (not tied to any one Essay
   topic): spaced-repetition flashcards over every topic's vocab (170
   words, not scored — repetition is the point), a mixed word-match quiz
   drawn from all topics, and an idiom drill from a new idiom bank. Built
   first because "concentrate on vocabulary and skills practice" was the
   top-level ask — see docs/new-categories-design-3248.md. Reuses vocab
   already authored per topic; only the idiom bank is new content.
   ====================================================================== */
function allVocabWords(){
  const out = [];
  TOPICS.forEach(t=> t.vocab.forEach(w=> out.push(Object.assign({ topicId:t.id }, w))));
  return out;
}

// Leitner-style spaced repetition: box 0-3, each box a longer review gap.
// "Still learning" resets to box 0 (due immediately); "Got it" advances a
// box and pushes the next review further out.
const SRS_KEY = "urdu-safar-vocab-srs-v1";
const SRS_GAPS_MS = [0, 24*3600e3, 3*24*3600e3, 7*24*3600e3];
function loadSrs(){
  try{ const raw = localStorage.getItem(SRS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveSrs(s){ try{ localStorage.setItem(SRS_KEY, JSON.stringify(s)); }catch(e){} }
let srs = loadSrs();
function srsKeyFor(w){ return w.topicId + "|" + w.ur; }
function srsBox(w){ const e = srs[srsKeyFor(w)]; return e ? e.box : 0; }
function srsIsDue(w){
  const e = srs[srsKeyFor(w)];
  return !e || Date.now() >= e.dueAt;
}
function srsMark(w, knewIt){
  const key = srsKeyFor(w);
  const prevBox = srs[key] ? srs[key].box : 0;
  const box = knewIt ? Math.min(prevBox+1, SRS_GAPS_MS.length-1) : 0;
  srs[key] = { box, dueAt: Date.now() + SRS_GAPS_MS[box] };
  saveSrs(srs);
}
function srsMasteredCount(){
  return allVocabWords().filter(w=> srsBox(w) >= SRS_GAPS_MS.length-1).length;
}

// Vocabulary Practice's own progress bucket, separate from the per-topic
// TOPICS/SECTIONS bookkeeping above since it isn't tied to one topic.
function vpStars(kind){
  const p = progress["_vocabpractice"] && progress["_vocabpractice"][kind];
  return p ? p.stars : 0;
}
function setVpResult(kind, correct, total){
  if(!progress["_vocabpractice"]) progress["_vocabpractice"] = {};
  const pct = total ? correct/total : 0;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  progress["_vocabpractice"][kind] = { correct, total, stars, done:true };
  saveProgress(progress);
  refreshPlayerLeaderboardEntry();
}

const LB_KEY = "urdu-safar-leaderboard-v1";
function loadLocalLeaderboard(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveLocalLeaderboard(list){
  try{ localStorage.setItem(LB_KEY, JSON.stringify(list)); }catch(e){}
}
function upsertLocalLeaderboard(entry){
  const list = loadLocalLeaderboard();
  const i = list.findIndex(x=>x.id===entry.id);
  if(i>=0) list[i] = entry; else list.push(entry);
  saveLocalLeaderboard(list);
}

/* ======================================================================
   ACCOUNTS + FRIEND GROUPS (Firebase Auth + Firestore)
   Optional layer on top of the always-available local guest mode above.
   Design + security-rules rationale: docs/accounts-friends-leaderboard-design.md.
   Signing in is never required to use the app — every practice feature
   and the on-device leaderboard work fully offline as a guest. Signing
   in (email + password) additionally lets you create/join ONE real
   friend group at a time, whose members' medal totals sync through
   Cloud Firestore so the group leaderboard works across devices.
   ====================================================================== */
let fbUser = null;
function fbAuth(){ try{ return (typeof firebase !== "undefined") ? firebase.auth() : null; }catch(e){ return null; } }
function fbFirestore(){ try{ return (typeof firebase !== "undefined") ? firebase.firestore() : null; }catch(e){ return null; } }

function initFirebaseAuthListener(){
  const auth = fbAuth();
  if(!auth) return;
  auth.onAuthStateChanged(async (u)=>{
    fbUser = u;
    if(u) await loadAccountFromFirestore();
    if(route.view === "account" || route.view === "leaderboard") render();
  });
}

async function loadAccountFromFirestore(){
  const fs = fbFirestore();
  if(!fs || !fbUser) return;
  try{
    const snap = await fs.collection("users").doc(fbUser.uid).get();
    const data = snap.exists ? snap.data() : {};
    if(!player) player = { id: fbUser.uid, nickname: data.displayName || (fbUser.email||"").split("@")[0] };
    player.id = fbUser.uid;
    if(data.displayName) player.nickname = data.displayName;
    player.group = data.group || null;
    savePlayer(player);
    refreshPlayerLeaderboardEntry();
  }catch(e){ /* offline — local state stays as-is */ }
}

async function signUp(email, password, nickname){
  const auth = fbAuth();
  if(!auth) throw new Error("offline");
  const cred = await auth.createUserWithEmailAndPassword(email, password);
  const fs = fbFirestore();
  await fs.collection("users").doc(cred.user.uid).set({ email, displayName: nickname, createdAt: Date.now() });
  player = { id: cred.user.uid, nickname, group: null };
  savePlayer(player);
  refreshPlayerLeaderboardEntry();
}
async function logIn(email, password){
  const auth = fbAuth();
  if(!auth) throw new Error("offline");
  await auth.signInWithEmailAndPassword(email, password);
}
async function logOut(){
  const auth = fbAuth();
  if(auth) await auth.signOut();
  fbUser = null;
}
// Firebase requires a *recent* sign-in for account deletion; callers should
// catch auth/requires-recent-login and re-prompt for the password.
async function deleteAccountEverywhere(password){
  const auth = fbAuth();
  const fs = fbFirestore();
  if(!auth || !auth.currentUser) throw new Error("not signed in");
  const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, password);
  await auth.currentUser.reauthenticateWithCredential(cred);
  if(player && player.group && player.group.groupId){
    await leaveGroup(player.group.groupId).catch(()=>{});
  }
  await fs.collection("users").doc(auth.currentUser.uid).delete().catch(()=>{});
  await auth.currentUser.delete();
  fbUser = null;
  if(player){ player.group = null; savePlayer(player); }
}

const INVITE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O/1/I — easy to read aloud
function randomInviteCode(){
  let s = "";
  for(let i=0;i<6;i++) s += INVITE_ALPHABET[Math.floor(Math.random()*INVITE_ALPHABET.length)];
  return s;
}
async function createGroup(name){
  const fs = fbFirestore();
  if(!fs || !fbUser) throw new Error("sign in required");
  const groupName = (name || "").trim().slice(0,30) || "My Group";
  const code = randomInviteCode();
  const groupRef = fs.collection("groups").doc();
  const totals = computeMedalTotals();
  await groupRef.set({ name: groupName, ownerUid: fbUser.uid, inviteCode: code, memberUids: [fbUser.uid], createdAt: Date.now() });
  await fs.collection("groupLookup").doc(code).set({ groupId: groupRef.id, ownerUid: fbUser.uid });
  await groupRef.collection("members").doc(fbUser.uid).set({
    displayName: player.nickname, gold: totals.gold, silver: totals.silver, bronze: totals.bronze, score: totals.score, updatedAt: Date.now()
  });
  player.group = { groupId: groupRef.id, name: groupName, inviteCode: code };
  savePlayer(player);
  await fs.collection("users").doc(fbUser.uid).set({ group: player.group }, { merge:true });
}
async function joinGroupByCode(rawCode){
  const code = normalizeGroupCode(rawCode);
  if(!code) throw new Error("empty");
  const fs = fbFirestore();
  if(!fs || !fbUser) throw new Error("sign in required");
  const lookupSnap = await fs.collection("groupLookup").doc(code).get();
  if(!lookupSnap.exists) throw new Error("not-found");
  const { groupId } = lookupSnap.data();
  const groupRef = fs.collection("groups").doc(groupId);
  await groupRef.update({ memberUids: firebase.firestore.FieldValue.arrayUnion(fbUser.uid) });
  const totals = computeMedalTotals();
  await groupRef.collection("members").doc(fbUser.uid).set({
    displayName: player.nickname, gold: totals.gold, silver: totals.silver, bronze: totals.bronze, score: totals.score, updatedAt: Date.now()
  });
  let groupName = "Friend Group";
  try{ const gs = await groupRef.get(); if(gs.exists) groupName = gs.data().name || groupName; }catch(e){}
  player.group = { groupId, name: groupName, inviteCode: code };
  savePlayer(player);
  await fs.collection("users").doc(fbUser.uid).set({ group: player.group }, { merge:true });
}
async function leaveGroup(groupId){
  const fs = fbFirestore();
  if(!fs || !fbUser || !groupId) return;
  const groupRef = fs.collection("groups").doc(groupId);
  await groupRef.collection("members").doc(fbUser.uid).delete().catch(()=>{});
  await groupRef.update({ memberUids: firebase.firestore.FieldValue.arrayRemove(fbUser.uid) }).catch(()=>{});
  player.group = null;
  savePlayer(player);
  await fs.collection("users").doc(fbUser.uid).set({ group: null }, { merge:true }).catch(()=>{});
}
async function fetchGroupLeaderboard(groupId){
  const fs = fbFirestore();
  if(!fs || !groupId) return [];
  try{
    const snap = await fs.collection("groups").doc(groupId).collection("members").get();
    return snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
  }catch(e){ return []; }
}

function medalHtml(stars){
  const m = medalForStars(stars);
  if(!m) return '';
  const emoji = m==="gold" ? "🥇" : m==="silver" ? "🥈" : "🥉";
  const label = m==="gold" ? "Gold medal" : m==="silver" ? "Silver medal" : "Bronze medal";
  return `<div class="medal-badge">${emoji} ${label}</div>`;
}
function refreshPlayerLeaderboardEntry(){
  if(!player) return;
  const totals = computeMedalTotals();
  const entry = {
    id: player.id, nickname: player.nickname, group: player.group ? player.group.groupId : null,
    gold: totals.gold, silver: totals.silver, bronze: totals.bronze, score: totals.score,
    updatedAt: Date.now()
  };
  upsertLocalLeaderboard(entry);
  if(fbUser){
    const fs = fbFirestore();
    if(fs){
      fs.collection("users").doc(fbUser.uid).set({ displayName: player.nickname }, { merge:true }).catch(()=>{});
      if(player.group && player.group.groupId){
        fs.collection("groups").doc(player.group.groupId).collection("members").doc(fbUser.uid).set({
          displayName: player.nickname, gold: totals.gold, silver: totals.silver, bronze: totals.bronze, score: totals.score, updatedAt: Date.now()
        }).catch(()=>{});
      }
    }
  }
}

// Invite codes are typed by hand, so be forgiving about case/punctuation.
function normalizeGroupCode(raw){
  return (raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
}

  if(leaveBtn) leaveBtn.addEventListener("click", async ()=>{
    leaveBtn.disabled = true;

    renderLeaderboard();
  });
  drawLeaderboard();
}

async function drawLeaderboard(){
  const host = document.getElementById("lbHost");
  let rows, scopeNote;
  if(fbUser && player.group && player.group.groupId){
    rows = await fetchGroupLeaderboard(player.group.groupId);
    scopeNote = `Showing "${player.group.name}" — everyone in your friend group.`;
  } else {
    rows = loadLocalLeaderboard();
    scopeNote = "This leaderboard is saved on this device — it shows everyone who has used Urdu Safar here.";
  }
  rows.sort((a,b)=> (b.score||0) - (a.score||0));
  host.innerHTML = `
    <div class="card">
      <p class="rule-explain">${scopeNote}</p>
      ${rows.length ? rows.map((r,i)=>`
        <div class="lb-row ${player && r.id===player.id ? 'me':''}">
          <span class="lb-rank">${i+1}</span>
          <span class="lb-name">${r.nickname||r.displayName}${player && r.id===player.id ? ' (you)' : ''}</span>
          <span class="lb-medals">🥇${r.gold||0}&nbsp;🥈${r.silver||0}&nbsp;🥉${r.bronze||0}</span>
        </div>
      `).join("") : `<p class="rule-explain">No medals earned yet — finish a quiz to appear here.</p>`}
    </div>
  `;
}
