answer":["قائدِ اعظم","ایک","عظیم","رہنما","تھے"]},{"en":"He worked hard for Pakistan.","bank":["نے","پاکستان","انہوں","سخت","محنت","کے","کی","لیے"],"answer":["انہوں","نے","پاکستان","کے","لیے","سخت","محنت","کی"]},{"en":"We respect his sacrifices.","bank":["ان","احترام","قربانیوں","کی","ہم","کرتے","کا","ہیں"],"answer":["ہم","ان","کی","قربانیوں","کا","احترام","کرتے","ہیں"]},{"en":"Pakistan became free in 1947.","bank":["1947","پاکستان","میں","ہوا","آزاد"],"answer":["پاکستان","1947","میں","آزاد","ہوا"]},{"en":"His life teaches us many lessons.","bank":["سکھاتی","زندگی","بہت","ان","ہمیں","کی","سے","سبق","ہے"],"answer":["ان","کی","زندگی","ہمیں","بہت","سے","سبق","سکھاتی","ہے"]}],"passage":{"en":"Muhammad Ali Jinnah, known respectfully as Quaid-e-Azam, is remembered as one of the most important leaders in the history of South Asia. Born in Karachi in 1876, he trained as a lawyer in England before returning home to practice law successfully. He later became deeply involved in politics, eventually leading the All-India Muslim League and dedicating his life to securing a separate homeland for the Muslims of the subcontinent. His discipline, determination, and honesty earned him deep respect from people across all walks of life. After years of tireless struggle, Pakistan finally came into existence on 14 August 1947, and Jinnah became its first Governor-General. Even though he passed away just over a year later, his vision and leadership continue to inspire millions of Pakistanis today, reminding them that dedication and hard work can achieve even the most difficult goals.","modelUr":"محمد علی جناح، جنہیں احتراماً قائدِ اعظم کہا جاتا ہے، جنوبی ایشیا کی تاریخ کے اہم ترین رہنماؤں میں سے ایک کے طور پر یاد کیے جاتے ہیں۔ 1876 میں کراچی میں پیدا ہونے والے انہوں نے انگلستان میں وکالت کی تربیت حاصل کی اور واپس آ کر کامیابی سے وکالت کی۔ بعد میں وہ سیاست میں گہرائی سے شامل ہو گئے، بالآخر آل انڈیا مسلم لیگ کی قیادت کی اور برصغیر کے مسلمانوں کے لیے ایک الگ وطن حاصل کرنے کے لیے اپنی زندگی وقف کر دی۔ ان کے نظم و ضبط، عزم اور ایمانداری نے انہیں زندگی کے ہر شعبے کے لوگوں سے گہری عزت دلائی۔ برسوں کی انتھک جدوجہد کے بعد، بالآخر 14 اگست 1947 کو پاکستان معرضِ وجود میں آیا اور جناح اس کے پہلے گورنر جنرل بنے۔ اگرچہ وہ اس کے صرف ایک سال بعد انتقال کر گئے، لیکن ان کا وژن اور قیادت آج بھی لاکھوں پاکستانیوں کو متاثر کرتی ہے، انہیں یاد دلاتی ہے کہ لگن اور محنت سے مشکل ترین اہداف بھی حاصل کیے جا سکتے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"pyramids-egypt","ur":"مصر کے اہرام","en":"The Pyramids of Egypt","warmup":[{"en":"The pyramids are very old.","bank":["بہت","اہرام","پرانے","ہیں"],"answer":["اہرام","بہت","پرانے","ہیں"]},{"en":"Ancient Egyptians built the pyramids.","bank":["نے","مصریوں","اہرام","قدیم","تعمیر","کیے"],"answer":["قدیم","مصریوں","نے","اہرام","تعمیر","کیے"]},{"en":"Many tourists visit Egypt every year.","bank":["سیاح","ہر","بہت","سے","جاتے","سال","مصر","ہیں"],"answer":["ہر","سال","بہت","سے","سیاح","مصر","جاتے","ہیں"]},{"en":"This pyramid is very tall.","bank":["بلند","یہ","بہت","اہرام","ہے"],"answer":["یہ","اہرام","بہت","بلند","ہے"]},{"en":"We should respect ancient history.","bank":["کا","تاریخ","احترام","قدیم","ہمیں","کرنا","چاہیے"],"answer":["ہمیں","قدیم","تاریخ","کا","احترام","کرنا","چاہیے"]}],"passage":{"en":"The pyramids of Egypt stand as one of the greatest architectural achievements in human history. Built thousands of years ago as tombs for powerful pharaohs, these massive stone structures continue to amaze historians, engineers, and tourists from around the world. The largest and most famous of these monuments, the Great Pyramid of Giza, was constructed for the Pharaoh Khufu and remained the tallest man-made structure on Earth for thousands of years. Building such enormous structures without modern machinery required extraordinary planning, mathematical precision, and the labor of thousands of skilled workers over many years. Ancient Egyptians believed strongly in life after death, which is why pharaohs were buried alongside valuable treasures meant to accompany them into the afterlife. Today, millions of visitors travel to Egypt each year specifically to witness these incredible monuments in person, making them one of the most important tourist attractions and historical treasures in the entire world.","modelUr":"مصر کے اہرام انسانی تاریخ کے عظیم ترین تعمیراتی کارناموں میں سے ایک کے طور پر کھڑے ہیں۔ ہزاروں سال پہلے طاقتور فرعونوں کے مقبروں کے طور پر تعمیر کیے گئے یہ عظیم پتھریلے ڈھانچے آج بھی دنیا بھر کے مورخین، انجینئرز اور سیاحوں کو حیران کرتے ہیں۔ ان یادگاروں میں سب سے بڑا اور مشہور، گیزا کا عظیم اہرام، فرعون خوفو کے لیے تعمیر کیا گیا تھا اور ہزاروں سال تک زمین پر سب سے بلند انسانی ساختہ ڈھانچہ رہا۔ جدید مشینری کے بغیر اتنے بڑے ڈھانچے بنانے کے لیے غیر معمولی منصوبہ بندی، ریاضیاتی درستگی اور برسوں تک ہزاروں ہنر مند مزدوروں کی محنت درکار تھی۔ قدیم مصری موت کے بعد زندگی پر شدت سے یقین رکھتے تھے، اسی لیے فرعونوں کو قیمتی خزانوں کے ساتھ دفن کیا جاتا تھا جو بعد کی زندگی میں ان کے ساتھ جانے تھے۔ آج، لاکھوں زائرین خاص طور پر ان حیرت انگیز یادگاروں کو ذاتی طور پر دیکھنے کے لیے ہر سال مصر کا سفر کرتے ہیں، جس سے یہ دنیا بھر میں سب سے اہم سیاحتی مقامات اور تاریخی خزانوں میں سے ایک بن گئے ہیں۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"museum","ur":"میوزیم","en":"The Museum","warmup":[{"en":"We visited the museum yesterday.","bank":["کل","میوزیم","دورہ","کیا","نے","ہم","کا"],"answer":["ہم","نے","کل","میوزیم","کا","دورہ","کیا"]},{"en":"The guide explained the exhibits.","bank":["کی","گائیڈ","نمائشوں","وضاحت","نے","کی"],"answer":["گائیڈ","نے","نمائشوں","کی","وضاحت","کی"]},{"en":"Photography is not allowed here.","bank":["نہیں","کی","یہاں","تصویر","اجازت","کشی","ہے"],"answer":["یہاں","تصویر","کشی","کی","اجازت","نہیں","ہے"]},{"en":"Students learn a lot from museums.","bank":["سے","میوزیم","طلبہ","بہت","سیکھتے","کچھ","ہیں"],"answer":["طلبہ","میوزیم","سے","بہت","کچھ","سیکھتے","ہیں"]},{"en":"This exhibition is very interesting.","bank":["دلچسپ","یہ","بہت","نمائش","ہے"],"answer":["یہ","نمائش","بہت","دلچسپ","ہے"]}],"passage":{"en":"Museums serve as important centers of learning, allowing visitors to explore history, science, art, and culture in ways that textbooks alone cannot provide. Walking through a museum's galleries gives students and adults alike the opportunity to see real artifacts, fossils, and works of art up close, making abstract concepts feel more real and memorable. Natural history museums, in particular, help visitors understand the ancient past by displaying dinosaur skeletons, mineral collections, and models of the solar system. Many museums also offer guided tours and interactive workshops designed specifically for young learners, making the experience both educational and enjoyable. Schools frequently organize field trips to museums as part of the curriculum, recognizing that hands-on learning experiences often leave a stronger impression than classroom lessons alone. Despite their educational value, many museums struggle to attract visitors, which is why it is important for communities to support and regularly visit these valuable cultural institutions.","modelUr":"میوزیم سیکھنے کے اہم مراکز کے طور پر کام کرتے ہیں، جو زائرین کو تاریخ، سائنس، فن اور ثقافت کو ایسے طریقوں سے دریافت کرنے کا موقع دیتے ہیں جو صرف نصابی کتابیں فراہم نہیں کر سکتیں۔ میوزیم کی گیلریوں میں چلنا طلبہ اور بڑوں دونوں کو حقیقی نوادرات، فوسلز اور فن پاروں کو قریب سے دیکھنے کا موقع دیتا ہے، جس سے تجریدی تصورات زیادہ حقیقی اور یادگار محسوس ہوتے ہیں۔ خاص طور پر قدرتی تاریخ کے میوزیم ڈایناسور کے ڈھانچے، معدنیات کے ذخیرے اور نظامِ شمسی کے ماڈل دکھا کر زائرین کو قدیم ماضی سمجھنے میں مدد دیتے ہیں۔ بہت سے میوزیم نوجوان سیکھنے والوں کے لیے خاص طور پر ڈیزائن کیے گئے گائیڈڈ ٹور اور انٹرایکٹو ورکشاپس بھی پیش کرتے ہیں، جس سے تجربہ تعلیمی اور خوشگوار دونوں بن جاتا ہے۔ سکول اکثر نصاب کے حصے کے طور پر میوزیم کے تعلیمی دورے منظم کرتے ہیں، یہ تسلیم کرتے ہوئے کہ عملی سیکھنے کے تجربات اکثر کلاس روم کے اسباق سے زیادہ گہرا اثر چھوڑتے ہیں۔ اپنی تعلیمی اہمیت کے باوجود، بہت سے میوزیم زائرین کو راغب کرنے میں مشکلات کا شکار ہیں، اسی لیے کمیونٹیز کے لیے ان قیمتی ثقافتی اداروں کی حمایت اور باقاعدہ دورہ کرنا ضروری ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"our-games","ur":"ہمارے کھیل","en":"Our Games","warmup":[{"en":"We play traditional games at school.","bank":["سکول","کھیل","روایتی","ہم","کھیلتے","میں","ہیں"],"answer":["ہم","سکول","میں","روایتی","کھیل","کھیلتے","ہیں"]},{"en":"This game teaches teamwork.","bank":["سکھاتا","کھیل","ورک","یہ","ٹیم","ہے"],"answer":["یہ","کھیل","ٹیم","ورک","سکھاتا","ہے"]},{"en":"Children enjoy playing outdoors.","bank":["پسند","بچے","کھیلنا","باہر","کرتے","ہیں"],"answer":["بچے","باہر","کھیلنا","پسند","کرتے","ہیں"]},{"en":"Our team won the competition.","bank":["مقابلہ","گئی","جیت","ٹیم","ہماری"],"answer":["ہماری","ٹیم","مقابلہ","جیت","گئی"]},{"en":"These games are part of our culture.","bank":["ہیں","حصہ","کھیل","ثقافت","یہ","کا","ہماری"],"answer":["یہ","کھیل","ہماری","ثقافت","کا","حصہ","ہیں"]}],"passage":{"en":"Traditional games have been an important part of childhood in Pakistan for generations, bringing children together in neighborhoods and school playgrounds. Games such as gully danda, kokla chhupaki, and rassa kashi require little to no equipment, yet they teach valuable skills such as teamwork, patience, physical coordination, and social interaction. Unlike modern video games, which are often played alone or online, traditional games encourage face-to-face communication and build strong friendships among players. In recent years, however, these games have started disappearing from streets and playgrounds as children spend increasing amounts of time on smartphones and computer screens. Concerned parents, teachers, and community leaders have begun organizing events specifically to reintroduce traditional games to a new generation. Many schools now dedicate special days to these activities, and children who participate often report that they enjoy the physical activity and social connection just as much as their parents did decades earlier.","modelUr":"روایتی کھیل نسلوں سے پاکستان میں بچپن کا ایک اہم حصہ رہے ہیں، جو بچوں کو محلوں اور سکول کے کھیل کے میدانوں میں اکٹھا کرتے ہیں۔ گلی ڈنڈا، کوکلا چھپاکی اور رسہ کشی جیسے کھیلوں کے لیے بہت کم یا کوئی سامان درکار نہیں ہوتا، پھر بھی یہ ٹیم ورک، صبر، جسمانی ہم آہنگی اور سماجی میل جول جیسی قیمتی مہارتیں سکھاتے ہیں۔ جدید ویڈیو گیمز کے برعکس، جو اکثر اکیلے یا آن لائن کھیلے جاتے ہیں، روایتی کھیل آمنے سامنے بات چیت کی حوصلہ افزائی کرتے ہیں اور کھلاڑیوں کے درمیان مضبوط دوستیاں بناتے ہیں۔ تاہم، حالیہ برسوں میں یہ کھیل گلیوں اور کھیل کے میدانوں سے غائب ہونا شروع ہو گئے ہیں کیونکہ بچے سمارٹ فونز اور کمپیوٹر سکرینوں پر بڑھتا ہوا وقت گزار رہے ہیں۔ فکرمند والدین، اساتذہ اور کمیونٹی رہنماؤں نے نئی نسل کو روایتی کھیلوں سے دوبارہ متعارف کرانے کے لیے خصوصی طور پر تقریبات کا انعقاد شروع کر دیا ہے۔ بہت سے سکول اب ان سرگرمیوں کے لیے خصوصی دن مختص کرتے ہیں، اور حصہ لینے والے بچے اکثر بتاتے ہیں کہ وہ جسمانی سرگرمی اور سماجی رابطے سے اتنا ہی لطف اندوز ہوتے ہیں جتنا ان کے والدین دہائیوں پہلے ہوتے تھے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"village-city-life","ur":"دیہات اور شہر کی زندگی","en":"Village and City Life","warmup":[{"en":"Village life is peaceful and simple.","bank":["زندگی","پرسکون","دیہاتی","سادہ","اور","ہے"],"answer":["دیہاتی","زندگی","پرسکون","اور","سادہ","ہے"]},{"en":"Many people move to cities for work.","bank":["کے","شہروں","بہت","لیے","کام","کی","لوگ","طرف","منتقل","سے","ہوتے","ہیں"],"answer":["بہت","سے","لوگ","کام","کے","لیے","شہروں","کی","طرف","منتقل","ہوتے","ہیں"]},{"en":"Farmers work hard in the fields.","bank":["محنت","کھیتوں","کسان","سخت","میں","کرتے","ہیں"],"answer":["کسان","کھیتوں","میں","سخت","محنت","کرتے","ہیں"]},{"en":"Cities offer better schools and hospitals.","bank":["بہتر","ہسپتال","شہر","سکول","اور","فراہم","کرتے","ہیں"],"answer":["شہر","بہتر","سکول","اور","ہسپتال","فراہم","کرتے","ہیں"]},{"en":"We should value both village and city life.","bank":["اور","دیہاتی","شہری","دونوں","قدر","زندگیوں","ہمیں","کی","کرنی","چاہیے"],"answer":["ہمیں","دیہاتی","اور","شہری","دونوں","زندگیوں","کی","قدر","کرنی","چاہیے"]}],"passage":{"en":"The contrast between village and city life in Pakistan is significant, with each offering distinct advantages and challenges. Village life tends to be simpler and more peaceful, centered around farming, close family ties, and a strong sense of community, where neighbors often know and support one another. However, villages frequently lack access to quality education, advanced healthcare, and diverse employment opportunities, which pushes many young people toward cities in search of better prospects. City life, on the other hand, offers modern conveniences such as well-equipped hospitals, universities, and a wide range of job opportunities, but it also comes with challenges including pollution, traffic congestion, and a faster, often more stressful pace of life. Many people who move from villages to cities find themselves missing the fresh air and close relationships of their hometowns, even while enjoying the greater opportunities available in urban areas. Ultimately, both lifestyles have important value.","modelUr":"پاکستان میں دیہاتی اور شہری زندگی کے درمیان فرق نمایاں ہے، ہر ایک اپنے الگ فوائد اور چیلنجز پیش کرتا ہے۔ دیہاتی زندگی زیادہ سادہ اور پرسکون ہوتی ہے، جو کاشتکاری، قریبی خاندانی رشتوں اور کمیونٹی کے مضبوط احساس کے گرد گھومتی ہے، جہاں پڑوسی اکثر ایک دوسرے کو جانتے اور ایک دوسرے کی مدد کرتے ہیں۔ تاہم، دیہاتوں میں اکثر معیاری تعلیم، جدید طبی سہولیات اور متنوع روزگار کے مواقع تک رسائی نہیں ہوتی، جو بہت سے نوجوانوں کو بہتر مواقع کی تلاش میں شہروں کی طرف دھکیلتی ہے۔ دوسری طرف، شہری زندگی جدید سہولیات جیسے اچھی طرح لیس ہسپتال، یونیورسٹیاں اور ملازمت کے وسیع مواقع فراہم کرتی ہے، لیکن اس کے ساتھ آلودگی، ٹریفک جام اور تیز رفتار، اکثر زیادہ تناؤ والی زندگی جیسے چیلنجز بھی آتے ہیں۔ بہت سے لوگ جو دیہاتوں سے شہروں کی طرف منتقل ہوتے ہیں، شہری علاقوں میں دستیاب زیادہ مواقع سے لطف اندوز ہوتے ہوئے بھی اپنے آبائی علاقوں کی تازہ ہوا اور قریبی تعلقات کو یاد کرتے ہیں۔ بالآخر، دونوں طرزِ زندگی کی اپنی اہم قدر ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"journey-north","ur":"شمال کا سفر","en":"A Journey to the North","warmup":[{"en":"We travelled to the northern areas.","bank":["کی","علاقوں","طرف","شمالی","ہم","گئے"],"answer":["ہم","شمالی","علاقوں","کی","طرف","گئے"]},{"en":"The mountains were covered with snow.","bank":["برف","پہاڑ","سے","تھے","ڈھکے","ہوئے"],"answer":["پہاڑ","برف","سے","ڈھکے","ہوئے","تھے"]},{"en":"We stayed in a small hotel.","bank":["ہوٹل","چھوٹے","ٹھہرے","ہم","ایک","میں"],"answer":["ہم","ایک","چھوٹے","ہوٹل","میں","ٹھہرے"]},{"en":"The local people were very friendly.","bank":["دوستانہ","لوگ","بہت","مقامی","تھے"],"answer":["مقامی","لوگ","بہت","دوستانہ","تھے"]},{"en":"This was an unforgettable journey.","bank":["فراموش","ناقابلِ","یہ","سفر","ایک","تھا"],"answer":["یہ","ایک","ناقابلِ","فراموش","سفر","تھا"]}],"passage":{"en":"Pakistan's northern areas are widely regarded as some of the most breathtaking landscapes in the world, attracting travelers from across the country and beyond. The journey typically begins along the Karakoram Highway, an engineering marvel that winds through towering mountains, deep valleys, and alongside pristine rivers and lakes. Popular destinations such as Hunza and Skardu offer visitors a chance to experience unique local cultures, taste delicious fresh fruits, and explore historic sites like Altit Fort. Beyond the scenery, travelers often remember the warmth and hospitality of the local communities, who welcome visitors with genuine kindness. Camping under a clear night sky, far from city lights, allows visitors to see thousands of stars, an experience impossible in most urban areas. Despite the long and sometimes challenging journey, most travelers agree that a trip to the northern areas is well worth the effort, creating memories that last a lifetime.","modelUr":"پاکستان کے شمالی علاقہ جات کو دنیا کے سب سے دلکش مناظر میں سے ایک سمجھا جاتا ہے، جو ملک بھر اور اس سے باہر سے سیاحوں کو اپنی طرف کھینچتے ہیں۔ سفر عام طور پر شاہراہِ قراقرم کے ساتھ شروع ہوتا ہے، جو انجینئرنگ کا ایک شاہکار ہے اور بلند پہاڑوں، گہری وادیوں اور صاف دریاؤں اور جھیلوں کے کنارے سے گزرتی ہے۔ ہنزہ اور سکردو جیسے مقبول مقامات زائرین کو منفرد مقامی ثقافتوں کا تجربہ کرنے، لذیذ تازہ پھلوں کا ذائقہ چکھنے اور التت قلعہ جیسے تاریخی مقامات کی سیر کرنے کا موقع دیتے ہیں۔ مناظر کے علاوہ، سیاح اکثر مقامی برادریوں کی گرمجوشی اور مہمان نوازی کو یاد رکھتے ہیں، جو زائرین کا خلوص کے ساتھ استقبال کرتے ہیں۔ شہر کی روشنیوں سے دور، صاف رات کے آسمان تلے کیمپنگ کرنا زائرین کو ہزاروں ستارے دیکھنے کا موقع دیتا ہے، ایک ایسا تجربہ جو زیادہ تر شہری علاقوں میں ممکن نہیں۔ طویل اور بعض اوقات مشکل سفر کے باوجود، زیادہ تر سیاح متفق ہیں کہ شمالی علاقہ جات کا سفر محنت کے قابل ہے، جو زندگی بھر رہنے والی یادیں بناتا ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"plantation-drive","ur":"شجرکاری مہم","en":"A Tree Plantation Drive","warmup":[{"en":"We planted trees in the park.","bank":["درخت","پارک","ہم","میں","نے","لگائے"],"answer":["ہم","نے","پارک","میں","درخت","لگائے"]},{"en":"Trees give us clean air.","bank":["صاف","درخت","ہمیں","ہوا","دیتے","ہیں"],"answer":["درخت","ہمیں","صاف","ہوا","دیتے","ہیں"]},{"en":"Volunteers watered the young plants.","bank":["نے","پودوں","کو","نئے","رضاکاروں","پانی","دیا"],"answer":["رضاکاروں","نے","نئے","پودوں","کو","پانی","دیا"]},{"en":"Everyone should plant at least one tree.","bank":["ایک","کم","کو","از","درخت","ہر","لگانا","کم","ایک","چاہیے"],"answer":["ہر","ایک","کو","کم","از","کم","ایک","درخت","لگانا","چاہیے"]},{"en":"This campaign was very successful.","bank":["کامیاب","مہم","بہت","یہ","رہی"],"answer":["یہ","مہم","بہت","کامیاب","رہی"]}],"passage":{"en":"Tree plantation drives have become an increasingly important activity across Pakistan as communities work to combat pollution, deforestation, and the effects of climate change. These organized events typically bring together students, government employees, and ordinary citizens who volunteer their time to plant thousands of saplings in parks, schools, and along roadsides. Before planting begins, organizers usually provide brief training on proper planting techniques, including digging appropriately sized holes, positioning saplings correctly, and watering them adequately. After the event, responsibility for caring for the young trees is often assigned to schools, neighborhood committees, or individual volunteers who commit to regular watering and monitoring. Successful plantation drives have shown measurable results, including improved air quality and reduced temperatures in previously bare urban areas. Given these clear benefits, many cities have committed to holding plantation drives annually, encouraging citizens to take an active role in protecting their local environment.","modelUr":"شجرکاری مہمات پاکستان بھر میں ایک تیزی سے اہم سرگرمی بن چکی ہیں کیونکہ کمیونٹیز آلودگی، جنگلات کی کٹائی اور موسمیاتی تبدیلی کے اثرات کا مقابلہ کرنے کے لیے کام کر رہی ہیں۔ یہ منظم تقریبات عام طور پر طلبہ، سرکاری ملازمین اور عام شہریوں کو اکٹھا کرتی ہیں جو پارکوں، سکولوں اور سڑکوں کے کنارے ہزاروں پودے لگانے کے لیے اپنا وقت رضاکارانہ طور پر دیتے ہیں۔ لگانے سے پہلے، منتظمین عام طور پر صحیح طریقہ کار کے بارے میں مختصر تربیت فراہم کرتے ہیں، جس میں مناسب سائز کے گڑھے کھودنا، پودوں کو صحیح طریقے سے رکھنا اور انہیں مناسب پانی دینا شامل ہے۔ تقریب کے بعد، نئے پودوں کی دیکھ بھال کی ذمہ داری اکثر سکولوں، محلہ کمیٹیوں یا انفرادی رضاکاروں کو دی جاتی ہے جو باقاعدہ پانی دینے اور نگرانی کا عہد کرتے ہیں۔ کامیاب شجرکاری مہمات نے قابلِ پیمائش نتائج دکھائے ہیں، جن میں ہوا کے معیار میں بہتری اور پہلے ویران شہری علاقوں میں درجہ حرارت میں کمی شامل ہے۔ ان واضح فوائد کو دیکھتے ہوئے، بہت سے شہروں نے ہر سال شجرکاری مہمات منعقد کرنے کا عہد کیا ہے، جو شہریوں کو اپنے مقامی ماحول کے تحفظ میں فعال کردار ادا کرنے کی ترغیب دیتا ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"water-conservation","ur":"پانی کا تحفظ","en":"Water Conservation","warmup":[{"en":"We should not waste water.","bank":["نہیں","پانی","چاہیے","کرنا","ہمیں","ضائع"],"answer":["ہمیں","پانی","ضائع","نہیں","کرنا","چاہیے"]},{"en":"This tap is leaking.","bank":["ٹپک","نلکا","یہ","رہا","ہے"],"answer":["یہ","نلکا","ٹپک","رہا","ہے"]},{"en":"Clean water is necessary for life.","bank":["زندگی","ضروری","صاف","پانی","کے","ہے","لیے"],"answer":["صاف","پانی","زندگی","کے","لیے","ضروری","ہے"]},{"en":"We collected rainwater for the garden.","bank":["نے","بارش","باغ","کے","ہم","پانی","لیے","کا","جمع","کیا"],"answer":["ہم","نے","باغ","کے","لیے","بارش","کا","پانی","جمع","کیا"]},{"en":"Every family should save water.","bank":["پانی","چاہیے","خاندان","بچانا","ہر","کو"],"answer":["ہر","خاندان","کو","پانی","بچانا","چاہیے"]}],"passage":{"en":"Access to clean water is a basic human necessity, yet water scarcity has become an increasingly serious problem in many parts of the world, including Pakistan. Population growth, industrial development, and wasteful daily habits have placed enormous pressure on natural water resources, leaving many communities struggling to access sufficient clean drinking water. Simple household changes can make a significant difference in reducing water waste. Turning off taps while brushing teeth, promptly repairing leaking faucets, and running washing machines only when fully loaded are all effective ways to conserve water without much effort or expense. Collecting rainwater for garden use is another practical method that many families have begun adopting. Beyond individual households, industries must also treat and reuse water responsibly, while governments should enforce water conservation policies and run public awareness campaigns. If every citizen commits to these small changes, future generations can be assured access to this essential resource.","modelUr":"صاف پانی تک رسائی ایک بنیادی انسانی ضرورت ہے، پھر بھی دنیا کے بہت سے حصوں میں، بشمول پاکستان، پانی کی کمی ایک تیزی سے سنگین مسئلہ بن چکی ہے۔ آبادی میں اضافے، صنعتی ترقی اور فضول خرچ روزمرہ عادات نے قدرتی آبی وسائل پر زبردست دباؤ ڈالا ہے، جس سے بہت سی کمیونٹیز کو کافی صاف پینے کا پانی حاصل کرنے میں مشکلات کا سامنا ہے۔ گھریلو سطح پر سادہ تبدیلیاں پانی کے ضیاع کو کم کرنے میں نمایاں فرق پیدا کر سکتی ہیں۔ دانت صاف کرتے وقت نلکا بند رکھنا، ٹپکتے نلکوں کی فوری مرمت کروانا اور واشنگ مشین کو صرف مکمل بھرے ہونے پر چلانا، یہ سب زیادہ محنت یا خرچے کے بغیر پانی بچانے کے مؤثر طریقے ہیں۔ باغ کے استعمال کے لیے بارش کا پانی جمع کرنا ایک اور عملی طریقہ ہے جسے بہت سے خاندانوں نے اپنانا شروع کر دیا ہے۔ انفرادی گھرانوں کے علاوہ، صنعتوں کو بھی پانی کو ذمہ داری سے صاف اور دوبارہ استعمال کرنا چاہیے، جبکہ حکومتوں کو پانی کے تحفظ کی پالیسیاں نافذ کرنی چاہییں اور عوامی آگاہی مہمات چلانی چاہییں۔ اگر ہر شہری ان چھوٹی تبدیلیوں کا عہد کرے تو آنے والی نسلوں کے لیے اس اہم وسیلے تک رسائی یقینی بنائی جا سکتی ہے۔","checklist":["کیا آپ نے ہر جملے کا مفہوم درست طور پر بیان کیا؟","کیا فعل کی صیغہ سازی (زمانہ اور جنس) درست ہے؟","کیا آپ نے مناسب الفاظ اور محاورہ استعمال کیا؟","کیا رموزِ اوقاف اور جملے کی ساخت درست ہیں؟"]}},{"id":"kalash-valley","ur":"کیلاش کی وادیاں","en":"The Kalash Valleys","warmup":[{"en":"The Kalash valleys are in Chitral.","bank":["چترال","ہیں","وادیاں","کیلاش","میں","کی"],"answer":["کیلاش","کی","وادیاں","چترال","میں","ہیں"]},{"en":"Tourists come here every year.","bank":["آتے","یہاں","ہر","ہیں","سیاح","سال"],"answer":["ہر","سال","سیاح","یہاں","آتے","ہیں"]},{"en":"Their dresses are very colourful.","bank":["رنگین","لباس","ہیں","ان","بہت","کے"],"answer":["ان","کے","لباس","بہت","رنگین","ہیں"]},{"en":"We should respect other cultures.","bank":["احترام","ہمیں","چاہیے","ثقافتوں","کرنا","دوسری","کا"],"answer":["ہمیں","دوسری","ثقافتوں","کا","احترام","کرنا","چاہیے"]},{"en":"This festival is celebrated in spring.","bank":["منایا","بہار","ہے","یہ","جاتا","تہوار","میں"],"answer":["یہ","تہوار","بہار","میں","منایا","جاتا","ہے"]}],"passage":{"en":"The Kalash people live in three small valleys in the Chitral district of Khyber Pakhtunkhwa. Their culture, language and festivals are very different from those of the surrounding areas, which is why visitors from Pakistan and abroad travel there every year. The women wear long black dresses decorated with bright embroidery, and on special occasions they wear headdresses covered in shells and beads. The Kalash celebrate several festivals during the year; the spring festival, held in May, is the most famous. Tourism has brought jobs to the valleys, but it has also created problems such as litter. Visitors should always ask before taking photographs and should treat local customs with respect, so that this unique culture can be preserved for future generations.","modelUr":"کیلاش لوگ خیبر پختونخوا کے ضلع چترال کی تین چھوٹی وادیوں میں رہتے ہیں۔ ان کی ثقافت، زبان اور تہوار اردگرد کے علاقوں سے بہت مختلف ہیں، یہی وجہ ہے کہ پاکستان اور بیرونِ ملک سے سیاح ہر سال وہاں جاتے ہیں۔ خواتین لمبے کالے لباس پہنتی ہیں جن پر شوخ رنگوں کی کڑھائی ہوتی ہے، اور خاص مواقع پر وہ سیپیوں اور موتیوں سے ڈھکی ٹوپیاں پہنتی ہیں۔ کیلاش لوگ سال بھر میں کئی تہوار مناتے ہیں؛ مئی میں منایا جانے والا بہار کا تہوار سب سے مشہور ہے۔ سیاحت نے وادیوں میں روزگار تو پیدا کیا ہے، لیکن اس سے کچرے جیسے مسائل بھی پیدا ہوئے ہیں۔ سیاحوں کو چاہیے کہ تصویر لینے سے پہلے ہمیشہ اجازت لیں اور مقامی رسم و رواج کا احترام کریں، تاکہ یہ منفرد ثقافت آنے والی نسلوں کے لیے محفوظ رہ سکے۔","checklist":["کیا آپ نے خیبر پختونخوا، چترال اور تین وادیوں کا ذکر درست ترجمہ کیا؟","کیا ‘embroidery’ اور ‘headdresses’ کے لیے مناسب اردو الفاظ (کڑھائی، ٹوپیاں) استعمال کیے؟","کیا فعل کی جنس اور تعداد درست ہے (خواتین پہنتی ہیں، تہوار مناتے ہیں)؟","کیا ترجمہ لفظ بہ لفظ کے بجائے رواں اور فطری اردو میں ہے؟"]}},{"id":"mohenjo-daro","ur":"موئن جو دڑو","en":"Mohenjo-daro","warmup":[{"en":"Mohenjo-daro is in Sindh.","bank":["میں","سندھ","موئن جو دڑو","ہے"],"answer":["موئن جو دڑو","سندھ","میں","ہے"]},{"en":"The city was very well planned.","bank":["بہت","منصوبہ بندی","کی","شہر","اچھی","تھی"],"answer":["شہر","کی","منصوبہ بندی","بہت","اچھی","تھی"]},{"en":"The houses were made of bricks.","bank":["تھے","اینٹوں","گھر","بنے","سے"],"answer":["گھر","اینٹوں","سے","بنے","تھے"]},{"en":"Many seals were found here.","bank":["ملیں","مہریں","سی","یہاں","بہت"],"answer":["یہاں","بہت","سی","مہریں","ملیں"]},{"en":"We must protect our heritage.","bank":["حفاظت","ہمیں","کی","ورثے","اپنے","چاہیے","کرنی"],"answer":["ہمیں","اپنے","ورثے","کی","حفاظت","کرنی","چاہیے"]}],"passage":{"en":"Mohenjo-daro, in the Larkana district of Sindh, was one of the largest cities of the ancient world. It was built about 4,500 years ago by the people of the Indus Valley civilisation. What surprises visitors most is how carefully the city was planned. Its streets were straight, its houses were made of baked bricks, and almost every home was connected to a system of covered drains. Archaeologists have found pottery, jewellery and hundreds of small stone seals, but nobody has yet been able to read the writing on them. In 1980 the site was declared a World Heritage Site. Today salt and rising groundwater are slowly damaging the walls, and experts warn that the ruins must be protected before it is too late.","modelUr":"سندھ کے ضلع لاڑکانہ میں واقع موئن جو دڑو قدیم دنیا کے سب سے بڑے شہروں میں سے ایک تھا۔ یہ تقریباً ساڑھے چار ہزار سال پہلے وادیٔ سندھ کی تہذیب کے لوگوں نے تعمیر کیا تھا۔ سیاحوں کو سب سے زیادہ حیرت اس بات پر ہوتی ہے کہ یہ شہر کتنی احتیاط سے منصوبہ بندی کے ساتھ بنایا گیا تھا۔ اس کی گلیاں سیدھی تھیں، گھر پکی اینٹوں سے بنے تھے، اور تقریباً ہر گھر ڈھکی ہوئی نالیوں کے نظام سے جڑا ہوا تھا۔ ماہرینِ آثارِ قدیمہ کو یہاں سے مٹی کے برتن، زیورات اور پتھر کی سینکڑوں چھوٹی مہریں ملی ہیں، لیکن ان پر لکھی تحریر ابھی تک کوئی نہیں پڑھ سکا۔ 1980ء میں اس مقام کو عالمی ورثہ قرار دیا گیا۔ آج نمک اور زیرِ زمین پانی کی بلند ہوتی سطح دیواروں کو آہستہ آہستہ نقصان پہنچا رہی ہے، اور ماہرین خبردار کرتے ہیں کہ دیر ہونے سے پہلے ان کھنڈرات کی حفاظت ضروری ہے۔","checklist":["کیا آپ نے ‘was built’ اور ‘was declared’ جیسی مجہول ساختوں کا درست ترجمہ کیا (تعمیر کیا گیا، قرار دیا گیا)؟","کیا ‘archaeologists’ اور ‘World Heritage Site’ کے لیے مناسب اردو اصطلاحات استعمال کیں؟","کیا ‘nobody has yet been able to read’ کا مفہوم درست منتقل ہوا؟","کیا جملے رواں اردو میں ہیں اور انگریزی ترتیب کی نقل نہیں؟"]}},{"id":"lahore-fort","ur":"شاہی قلعہ لاہور","en":"The Lahore Fort","warmup":[{"en":"The fort is in Lahore.","bank":["میں","ہے","قلعہ","لاہور"],"answer":["قلعہ","لاہور","میں","ہے"]},{"en":"Emperor Akbar had it built.","bank":["اسے","اکبر","بنوایا","نے","شہنشاہ"],"answer":["شہنشاہ","اکبر","نے","اسے","بنوایا"]},{"en":"The walls are very strong.","bank":["مضبوط","دیواریں","ہیں","بہت"],"answer":["دیواریں","بہت","مضبوط","ہیں"]},{"en":"We visited the Sheesh Mahal.","bank":["سیر","شیش محل","کی","نے","ہم","کی"],"answer":["ہم","نے","شیش محل","کی","سیر","کی"]},{"en":"The fort is being repaired.","bank":["رہی","مرمت","ہے","کی","قلعے","کی جا"],"answer":["قلعے","کی","مرمت","کی جا","رہی","ہے"]}],"passage":{"en":"The Lahore Fort stands in the north-western corner of the old walled city. Although a fort existed here long before the Mughals, most of what visitors see today was built on the orders of Emperor Akbar in the sixteenth century. Later emperors added palaces, gardens and halls, each trying to make the fort more magnificent than before. The most famous of these is the Sheesh Mahal, or Palace of Mirrors, whose walls are covered with thousands of tiny pieces of glass. When a single candle is lit inside, the whole room seems to sparkle like the night sky. In 1981 the fort was declared a World Heritage Site. Today experts are working hard to repair its old walls, but they need the help of visitors, who must not touch or damage these fragile buildings.","modelUr":"شاہی قلعہ لاہور کے پرانے فصیل بند شہر کے شمال مغربی کونے میں واقع ہے۔ اگرچہ یہاں مغلوں سے بہت پہلے بھی ایک قلعہ موجود تھا، لیکن آج سیاح جو کچھ دیکھتے ہیں اس کا بیشتر حصہ سولہویں صدی میں شہنشاہ اکبر کے حکم پر تعمیر کیا گیا تھا۔ بعد کے بادشاہوں نے اس میں محلات، باغات اور ایوان شامل کیے، اور ہر ایک نے قلعے کو پہلے سے زیادہ شاندار بنانے کی کوشش کی۔ ان میں سب سے مشہور شیش محل ہے، جس کی دیواریں شیشے کے ہزاروں ننھے ٹکڑوں سے ڈھکی ہوئی ہیں۔ جب اس کے اندر ایک موم بتی جلائی جاتی ہے تو پورا کمرہ رات کے آسمان کی طرح جگمگانے لگتا ہے۔ 1981ء میں اس قلعے کو عالمی ورثہ قرار دیا گیا۔ آج ماہرین اس کی پرانی دیواروں کی مرمت کے لیے سخت محنت کر رہے ہیں، لیکن انہیں سیاحوں کے تعاون کی بھی ضرورت ہے، جنہیں ان نازک عمارتوں کو نہ چھونا چاہیے اور نہ ہی نقصان پہنچانا چاہیے۔","checklist":["کیا آپ نے ‘was built on the orders of’ کا ترجمہ مجہول یا بالواسطہ ساخت (حکم پر تعمیر کیا گیا / بنوایا) سے کیا؟","کیا ‘walled city’ اور ‘Palace of Mirrors’ کے لیے مناسب الفاظ (فصیل بند شہر، شیش محل) استعمال کیے؟","کیا ‘sparkle like the night sky’ والی تشبیہ رواں اردو میں ادا ہوئی؟","کیا ترجمہ مکمل ہے اور کوئی جملہ چھوٹا نہیں؟"]}},{"id":"karakoram-highway","ur":"شاہراہِ قراقرم","en":"The Karakoram Highway","warmup":[{"en":"The road goes through the mountains.","bank":["ہے","سے","گزرتی","سڑک","پہاڑوں"],"answer":["سڑک","پہاڑوں","سے","گزرتی","ہے"]},{"en":"It was very cold at Khunjerab.","bank":["سردی","پر","بہت","تھی","خنجراب"],"answer":["خنجراب","پر","بہت","سردی","تھی"]},{"en":"The road was closed because of the rain.","bank":["تھی","سے","بند","وجہ","سڑک","کی","بارش"],"answer":["بارش","کی","وجہ","سے","سڑک","بند","تھی"]},{"en":"We saw a beautiful lake.","bank":["دیکھی","جھیل","ہم","خوبصورت","ایک","نے"],"answer":["ہم","نے","ایک","خوبصورت","جھیل","دیکھی"]},{"en":"Trade between the two countries increased.","bank":["بڑھی","میں","تجارت","ملکوں","دونوں"],"answer":["دونوں","ملکوں","میں","تجارت","بڑھی"]}],"passage":{"en":"The Karakoram Highway is one of the most remarkable roads in the world. It links Pakistan with China and climbs through some of the highest mountains on Earth before crossing the border at the Khunjerab Pass. Building it was extremely dangerous: workers had to cut through solid rock in freezing temperatures, and hundreds of them lost their lives. Today the highway is busy with trucks carrying goods between the two countries, as well as tourists who come to enjoy the breathtaking scenery. Travellers should be prepared, however, because landslides often block the road after heavy rain. Before setting off, it is wise to check the weather, carry warm clothes and keep enough fuel, since petrol stations are few and far between in the higher valleys.","modelUr":"شاہراہِ قراقرم دنیا کی سب سے حیرت انگیز سڑکوں میں سے ایک ہے۔ یہ پاکستان کو چین سے ملاتی ہے اور درۂ خنجراب پر سرحد عبور کرنے سے پہلے زمین کے بلند ترین پہاڑوں میں سے کچھ کے بیچ سے گزرتی ہوئی اوپر چڑھتی ہے۔ اس کی تعمیر انتہائی خطرناک تھی: مزدوروں کو جما دینے والی سردی میں ٹھوس چٹانیں کاٹنی پڑیں، اور ان میں سے سینکڑوں نے اپنی جانیں گنوا دیں۔ آج یہ شاہراہ دونوں ملکوں کے درمیان سامان لے جانے والے ٹرکوں کے ساتھ ساتھ اُن سیاحوں سے بھی آباد رہتی ہے جو یہاں کے دم بخود کر دینے والے مناظر سے لطف اندوز ہونے آتے ہیں۔ البتہ مسافروں کو تیار رہنا چاہیے، کیونکہ تیز بارش کے بعد اکثر لینڈ سلائیڈ سے سڑک بند ہو جاتی ہے۔ روانگی سے پہلے موسم معلوم کر لینا، گرم کپڑے ساتھ رکھنا اور مناسب ایندھن رکھنا عقلمندی ہے، کیونکہ اونچی وادیوں میں پیٹرول پمپ بہت کم اور ایک دوسرے سے دور ہیں۔","checklist":["کیا آپ نے ‘remarkable’ اور ‘breathtaking scenery’ کے لیے موزوں اردو الفاظ چنے؟","کیا ‘lost their lives’ کا ترجمہ مناسب محاورے (جانیں گنوانا / جاں بحق ہونا) سے کیا؟","کیا ‘however’ اور ‘since’ جیسے ربط کے الفاظ کا درست ترجمہ ہوا (البتہ، کیونکہ)؟","کیا ترجمہ رواں ہے اور انگریزی جملوں کی ترتیب کی نقل نہیں؟"]}},{"id":"deosai-plains","ur":"دیوسائی","en":"Deosai","warmup":[{"en":"Deosai is very high.","bank":["ہے","بلند","دیوسائی","بہت"],"answer":["دیوسائی","بہت","بلند","ہے"]},{"en":"Do not feed the animals.","bank":["کھانا","دیں","جانوروں","نہ","کو"],"answer":["جانوروں","کو","کھانا","نہ","دیں"]},{"en":"Flowers bloom in summer.","bank":["کھلتے","میں","پھول","گرمیوں","ہیں"],"answer":["گرمیوں","میں","پھول","کھلتے","ہیں"]},{"en":"We saw a brown bear.","bank":["ریچھ","دیکھا","ہم نے","بھورا","ایک"],"answer":["ہم نے","ایک","بھورا","ریچھ","دیکھا"]},{"en":"The road is closed in winter.","bank":["رہتا","بند","راستہ","میں","ہے","سردیوں"],"answer":["سردیوں","میں","راستہ","بند","رہتا","ہے"]}],"passage":{"en":"Deosai is a high plateau in Gilgit-Baltistan, lying between Skardu and Astore. For most of the year it is buried under deep snow, and the road is open only from June to September. During these few months the plain turns green, and millions of wildflowers cover the ground in shades of yellow, purple and white. Deosai is best known as the home of the Himalayan brown bear. Because the bears were once hunted almost to extinction here, the area was made a national park in 1993, and their number has slowly increased since then. Visitors can camp beside the clear streams or by Sheosar Lake, but they must follow the park rules: they should not hunt, light fires or leave any rubbish behind.","modelUr":"دیوسائی گلگت بلتستان میں سکردو اور استور کے درمیان واقع ایک بلند سطح مرتفع ہے۔ سال کے بیشتر حصے میں یہ گہری برف تلے دبا رہتا ہے، اور راستہ صرف جون سے ستمبر تک کھلتا ہے۔ ان چند مہینوں میں میدان سرسبز ہو جاتا ہے اور لاکھوں جنگلی پھول پیلے، جامنی اور سفید رنگوں میں زمین کو ڈھانپ لیتے ہیں۔ دیوسائی سب سے زیادہ ہمالیائی بھورے ریچھ کے مسکن کے طور پر مشہور ہے۔ چونکہ کبھی یہاں ریچھوں کا اتنا شکار کیا گیا کہ وہ تقریباً ختم ہو گئے تھے، اس لیے 1993ء میں اس علاقے کو قومی پارک بنا دیا گیا، اور تب سے ان کی تعداد آہستہ آہستہ بڑھی ہے۔ سیاح صاف شفاف ندیوں کے کنارے یا شیوسر جھیل کے پاس خیمے لگا سکتے ہیں، لیکن انہیں پارک کے قواعد کی پابندی کرنی چاہیے: وہ نہ شکار کریں، نہ آگ جلائیں اور نہ ہی کوئی کچرا پیچھے چھوڑیں۔","checklist":["کیا آپ نے ‘plateau’ اور ‘national park’ کے لیے درست اصطلاحات (سطح مرتفع، قومی پارک) استعمال کیں؟","کیا ‘hunted almost to extinction’ کا مفہوم رواں اردو میں ادا ہوا؟","کیا آخری جملے میں ممانعت کو ‘نہ … نہ …’ یا اسی طرح کی ساخت سے ظاہر کیا؟","کیا ترجمہ مکمل اور فطری اردو میں ہے؟"]}},{"id":"cholistan-desert","ur":"صحرائے چولستان","en":"The Cholistan Desert","warmup":[{"en":"The desert is very hot.","bank":["ہے","گرم","صحرا","بہت"],"answer":["صحرا","بہت","گرم","ہے"]},{"en":"People keep camels here.","bank":["پالتے","اونٹ","یہاں","لوگ","ہیں"],"answer":["یہاں","لوگ","اونٹ","پالتے","ہیں"]},{"en":"They used to collect rainwater.","bank":["کرتے","جمع","وہ","پانی","تھے","بارش کا"],"answer":["وہ","بارش کا","پانی","جمع","کرتے","تھے"]},{"en":"The fort has forty towers.","bank":["برج","ہیں","کے","قلعے","چالیس"],"answer":["قلعے","کے","چالیس","برج","ہیں"]},{"en":"Thousands of people watch the rally.","bank":["ہیں","لوگ","ریلی","دیکھتے","ہزاروں"],"answer":["ہزاروں","لوگ","ریلی","دیکھتے","ہیں"]}],"passage":{"en":"The Cholistan Desert stretches across the south of Punjab, near the city of Bahawalpur. Life here has never been easy. Summer temperatures can reach almost fifty degrees, and it rains only a few times a year. For centuries the people of Cholistan have depended on their animals, especially camels, which can survive for days without water. Families collect rainwater in shallow ponds called tobas, and when these dry up they move with their herds towards the canal areas. In the middle of the desert stands Derawar Fort, whose forty towers can be seen from miles away. Every February the area comes alive with the famous jeep rally, when thousands of visitors arrive to watch the race, enjoy folk music and buy colourful local handicrafts.","modelUr":"صحرائے چولستان جنوبی پنجاب میں بہاولپور شہر کے قریب پھیلا ہوا ہے۔ یہاں کی زندگی کبھی آسان نہیں رہی۔ گرمیوں میں درجہ حرارت تقریباً پچاس ڈگری تک پہنچ سکتا ہے، اور سال میں صرف چند بار بارش ہوتی ہے۔ صدیوں سے چولستان کے لوگ اپنے جانوروں، خاص طور پر اونٹوں پر انحصار کرتے آئے ہیں، جو کئی دن تک پانی کے بغیر زندہ رہ سکتے ہیں۔ گھرانے بارش کا پانی کم گہرے تالابوں میں جمع کرتے ہیں جنہیں ٹوبے کہا جاتا ہے، اور جب یہ خشک ہو جاتے ہیں تو وہ اپنے ریوڑوں کے ساتھ نہری علاقوں کی طرف چلے جاتے ہیں۔ صحرا کے بیچ دراوڑ کا قلعہ کھڑا ہے، جس کے چالیس برج میلوں دور سے دیکھے جا سکتے ہیں۔ ہر سال فروری میں مشہور جیپ ریلی کے موقع پر یہ علاقہ جاگ اٹھتا ہے، جب ہزاروں سیاح ریس دیکھنے، لوک موسیقی سے لطف اٹھانے اور رنگ برنگی مقامی دستکاریاں خریدنے آتے ہیں۔","checklist":["کیا آپ نے ‘have depended on’ کا ترجمہ ‘انحصار کرتے آئے ہیں’ جیسی ساخت سے کیا؟","کیا ‘herds’ اور ‘handicrafts’ کے لیے مناسب اردو الفاظ (ریوڑ، دستکاریاں) استعمال کیے؟","کیا ‘comes alive’ کا مفہوم (جاگ اٹھنا / رونق آ جانا) فطری انداز میں ادا ہوا؟","کیا ترجمہ مکمل ہے اور جملے رواں ہیں؟"]}},{"id":"markhor","ur":"مارخور","en":"The Markhor","warmup":[{"en":"The markhor lives in the mountains.","bank":["میں","رہتا","مارخور","ہے","پہاڑوں"],"answer":["مارخور","پہاڑوں","میں","رہتا","ہے"]},{"en":"Its horns are twisted.","bank":["سینگ","ہیں","کے","پیچ دار","اس"],"answer":["اس","کے","سینگ","پیچ دار","ہیں"]},{"en":"Hunting is now forbidden.","bank":["ہے","شکار","ممنوع","اب"],"answer":["اب","شکار","ممنوع","ہے"]},{"en":"Local people protect the animals.","bank":["کرتے","مقامی","کی","حفاظت","جانوروں","لوگ","ہیں"],"answer":["مقامی","لوگ","جانوروں","کی","حفاظت","کرتے","ہیں"]},{"en":"The markhor is our national animal.","bank":["جانور","ہے","ہمارا","مارخور","قومی"],"answer":["مارخور","ہمارا","قومی","جانور","ہے"]}],"passage":{"en":"The markhor, Pakistan's national animal, is a large wild goat famous for its long, spiral horns. It lives on steep, rocky mountainsides in the north of the country and in parts of Balochistan. By the end of the last century the markhor was in serious danger, because hunters were killing it for its horns and its habitat was shrinking. Instead of simply banning all hunting, Pakistan tried a different approach. A small number of old males could be hunted each year by people who paid a very high fee, and most of that money went to the villages nearby. With these funds, communities built schools and water supplies, and they began guarding the animals themselves. Thanks to this plan, the number of markhors has increased, and conservationists around the world now study Pakistan's success.","modelUr":"مارخور، جو پاکستان کا قومی جانور ہے، ایک بڑا جنگلی بکرا ہے جو اپنے لمبے اور پیچ دار سینگوں کی وجہ سے مشہور ہے۔ یہ ملک کے شمال میں اور بلوچستان کے کچھ حصوں میں کھڑی اور پتھریلی پہاڑی ڈھلوانوں پر رہتا ہے۔ پچھلی صدی کے آخر تک مارخور شدید خطرے میں تھا، کیونکہ شکاری اس کے سینگوں کے لیے اسے مار رہے تھے اور اس کا مسکن سکڑ رہا تھا۔ ہر قسم کے شکار پر صرف پابندی لگانے کے بجائے پاکستان نے ایک مختلف طریقہ آزمایا۔ ہر سال چند بوڑھے نر مارخوروں کا شکار وہ لوگ کر سکتے تھے جو بہت زیادہ فیس ادا کرتے، اور اس رقم کا بیشتر حصہ قریبی دیہات کو ملتا۔ ان فنڈز سے مقامی آبادیوں نے اسکول اور پانی کی سہولتیں بنائیں، اور خود جانوروں کی نگرانی شروع کر دی۔ اس منصوبے کی بدولت مارخوروں کی تعداد بڑھ گئی ہے، اور اب دنیا بھر کے ماہرینِ تحفظ پاکستان کی اس کامیابی کا مطالعہ کرتے ہیں۔","checklist":["کیا آپ نے ‘spiral horns’ اور ‘habitat’ کے لیے درست الفاظ (پیچ دار سینگ، مسکن) استعمال کیے؟","کیا ‘Instead of simply banning’ کا مفہوم ‘صرف پابندی لگانے کے بجائے’ جیسی ساخت سے ادا ہوا؟","کیا آپ نے جمع مغیرہ درست استعمال کی (مارخوروں، دیہات، جانوروں)؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"indus-dolphin","ur":"دریائے سندھ کی ڈولفن","en":"The Indus River Dolphin","warmup":[{"en":"The dolphin lives in the river.","bank":["رہتی","میں","ڈولفن","ہے","دریا"],"answer":["ڈولفن","دریا","میں","رہتی","ہے"]},{"en":"It cannot see well.","bank":["سکتی","نہیں","یہ","دیکھ","ٹھیک سے"],"answer":["یہ","ٹھیک سے","نہیں","دیکھ","سکتی"]},{"en":"The team rescued the dolphin.","bank":["بچایا","نے","کو","ٹیم","ڈولفن"],"answer":["ٹیم","نے","ڈولفن","کو","بچایا"]},{"en":"Do not throw rubbish in the river.","bank":["کچرا","پھینکیں","میں","نہ","دریا"],"answer":["دریا","میں","کچرا","نہ","پھینکیں"]},{"en":"Their number is increasing slowly.","bank":["ہے","تعداد","آہستہ آہستہ","ان کی","رہی","بڑھ"],"answer":["ان کی","تعداد","آہستہ آہستہ","بڑھ","رہی","ہے"]}],"passage":{"en":"The Indus river dolphin is found nowhere else in the world except Pakistan. Because it lives in muddy water, it has almost lost its eyesight, and instead it finds fish by sending out sounds and listening for their echoes. Like all dolphins, it must come to the surface regularly to breathe. Over the past century its numbers fell sharply. Barrages divided the river into separate sections, pollution from farms and factories entered the water, and many dolphins became trapped in irrigation canals. In recent years, however, there has been some good news. Part of the river has been declared a protected reserve, and teams of volunteers rescue dolphins from the canals and return them to the river. If people continue to support these efforts, this unique animal may survive for generations to come.","modelUr":"دریائے سندھ کی ڈولفن پاکستان کے سوا دنیا میں کہیں اور نہیں پائی جاتی۔ چونکہ یہ گدلے پانی میں رہتی ہے، اس لیے اس کی بینائی تقریباً ختم ہو چکی ہے، اور اس کے بجائے یہ آوازیں نکال کر اور ان کی گونج سن کر مچھلیاں تلاش کرتی ہے۔ دوسری تمام ڈولفنوں کی طرح اسے بھی سانس لینے کے لیے باقاعدگی سے سطح پر آنا پڑتا ہے۔ گزشتہ صدی کے دوران اس کی تعداد میں تیزی سے کمی آئی۔ بیراجوں نے دریا کو الگ الگ حصوں میں تقسیم کر دیا، کھیتوں اور فیکٹریوں کی آلودگی پانی میں شامل ہوئی، اور بہت سی ڈولفنیں آبپاشی کی نہروں میں پھنس گئیں۔ تاہم حالیہ برسوں میں کچھ اچھی خبریں بھی آئی ہیں۔ دریا کے ایک حصے کو محفوظ علاقہ قرار دیا گیا ہے، اور رضاکاروں کی ٹیمیں نہروں سے ڈولفنوں کو بچا کر واپس دریا میں چھوڑتی ہیں۔ اگر لوگ ان کوششوں کی حمایت جاری رکھیں تو یہ منفرد جانور آنے والی کئی نسلوں تک زندہ رہ سکتا ہے۔","checklist":["کیا ‘found nowhere else … except’ کا ترجمہ ‘کے سوا کہیں اور نہیں’ جیسی ساخت سے ہوا؟","کیا ‘irrigation canals’ اور ‘protected reserve’ کے لیے مناسب الفاظ (آبپاشی کی نہریں، محفوظ علاقہ) استعمال کیے؟","کیا ‘however’ کا ترجمہ ‘تاہم’ یا ‘البتہ’ سے کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"khewra-salt-mine","ur":"کھیوڑہ کی کان","en":"The Khewra Mine","warmup":[{"en":"The mine is very old.","bank":["ہے","پرانی","کان","بہت"],"answer":["کان","بہت","پرانی","ہے"]},{"en":"It was cold inside the tunnel.","bank":["ٹھنڈ","تھی","کے اندر","سرنگ"],"answer":["سرنگ","کے اندر","ٹھنڈ","تھی"]},{"en":"We rode the small train.","bank":["سواری","کی","ریل گاڑی","ہم نے","کی","چھوٹی"],"answer":["ہم نے","چھوٹی","ریل گاڑی","کی","سواری","کی"]},{"en":"The salt is sent abroad.","bank":["بھیجا","نمک","بیرونِ ملک","ہے","جاتا"],"answer":["نمک","بیرونِ ملک","بھیجا","جاتا","ہے"]},{"en":"Patients breathe the salty air.","bank":["سانس","ہوا میں","مریض","لیتے","نمکین","ہیں"],"answer":["مریض","نمکین","ہوا میں","سانس","لیتے","ہیں"]}],"passage":{"en":"The Khewra Salt Mine, in the Jhelum district, is said to be the second-largest salt mine in the world. According to a well-known legend, it was discovered more than two thousand years ago when the horses of Alexander the Great's army began licking the rocks. Today the mine stretches for many kilometres beneath the hills, and millions of tonnes of salt are taken out of it every year. Much of this pink salt is exported to other countries. The mine has also become a popular tourist attraction. Visitors ride a small train into the tunnels, where they can see a mosque made entirely of salt bricks and a bridge over a pool of salty water. Because the air inside is believed to be good for breathing, a clinic for asthma patients has been set up there too.","modelUr":"ضلع جہلم میں واقع کھیوڑہ کی نمک کی کان کے بارے میں کہا جاتا ہے کہ یہ دنیا کی دوسری سب سے بڑی نمک کی کان ہے۔ ایک مشہور روایت کے مطابق یہ دو ہزار سال سے بھی زیادہ پہلے اس وقت دریافت ہوئی جب سکندرِ اعظم کی فوج کے گھوڑوں نے چٹانیں چاٹنا شروع کر دیں۔ آج یہ کان پہاڑیوں کے نیچے کئی کلومیٹر تک پھیلی ہوئی ہے، اور ہر سال اس سے لاکھوں ٹن نمک نکالا جاتا ہے۔ اس گلابی نمک کا بڑا حصہ دوسرے ممالک کو برآمد کیا جاتا ہے۔ یہ کان سیاحوں کی ایک مقبول جگہ بھی بن چکی ہے۔ سیاح ایک چھوٹی ریل گاڑی میں بیٹھ کر سرنگوں کے اندر جاتے ہیں، جہاں وہ مکمل طور پر نمک کی اینٹوں سے بنی ایک مسجد اور نمکین پانی کے تالاب پر بنا ایک پل دیکھ سکتے ہیں۔ چونکہ اندر کی ہوا سانس کے لیے مفید سمجھی جاتی ہے، اس لیے وہاں دمے کے مریضوں کے لیے ایک کلینک بھی قائم کیا گیا ہے۔","checklist":["کیا آپ نے ‘is said to be’ اور ‘is believed to be’ کا ترجمہ ‘کہا جاتا ہے / سمجھی جاتی ہے’ سے کیا؟","کیا ‘according to a legend’ کا ترجمہ ‘ایک روایت کے مطابق’ ہوا؟","کیا مجہول جملے درست ہیں (نکالا جاتا ہے، برآمد کیا جاتا ہے، قائم کیا گیا ہے)؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"amazon-rainforest","ur":"ایمیزون کا جنگل","en":"The Amazon Rainforest","warmup":[{"en":"The Amazon is a very big forest.","bank":["جنگل","ہے","ایمیزون","بڑا","بہت"],"answer":["ایمیزون","بہت","بڑا","جنگل","ہے"]},{"en":"It rains here all year.","bank":["سال بھر","ہوتی","بارش","یہاں","ہے"],"answer":["یہاں","سال بھر","بارش","ہوتی","ہے"]},{"en":"Millions of animals live here.","bank":["رہتے","یہاں","جانور","ہیں","لاکھوں"],"answer":["یہاں","لاکھوں","جانور","رہتے","ہیں"]},{"en":"We must save the forests.","bank":["چاہییں","جنگلات","بچانے","ہمیں"],"answer":["ہمیں","جنگلات","بچانے","چاہییں"]},{"en":"Fires destroy many trees.","bank":["ہے","کر دیتی","آگ","درختوں کو","تباہ","بہت سے"],"answer":["آگ","بہت سے","درختوں کو","تباہ","کر دیتی","ہے"]}],"passage":{"en":"The Amazon is the largest tropical rainforest on Earth, covering parts of nine countries in South America. It is home to an astonishing variety of life: scientists believe that about one in ten of all known species lives there. Its billions of trees absorb huge amounts of carbon dioxide, which helps to slow down global warming, and many important medicines have been developed from its plants. Sadly, the forest is shrinking. Large areas are cleared every year to make room for cattle, crops, mines and roads, and fires destroy even more. As a result, animals are losing their homes and indigenous tribes are being forced off their land. Experts warn that if the destruction continues, the effects will be felt by everyone on the planet, not only by the people of South America.","modelUr":"ایمیزون زمین کا سب سے بڑا استوائی برساتی جنگل ہے، جو جنوبی امریکہ کے نو ممالک کے کچھ حصوں پر پھیلا ہوا ہے۔ یہ زندگی کی حیرت انگیز اقسام کا گھر ہے: سائنس دانوں کا خیال ہے کہ تمام معلوم انواع میں سے تقریباً ہر دس میں سے ایک یہاں رہتی ہے۔ اس کے اربوں درخت بہت بڑی مقدار میں کاربن ڈائی آکسائیڈ جذب کرتے ہیں، جو عالمی حدت کی رفتار کم کرنے میں مدد دیتی ہے، اور اس کے پودوں سے بہت سی اہم دوائیں تیار کی گئی ہیں۔ افسوس کہ یہ جنگل سکڑ رہا ہے۔ ہر سال بڑے بڑے رقبے مویشیوں، فصلوں، کانوں اور سڑکوں کے لیے صاف کیے جاتے ہیں، اور آگ اس سے بھی زیادہ تباہی پھیلاتی ہے۔ نتیجتاً جانور اپنے گھروں سے محروم ہو رہے ہیں اور مقامی قبائل کو ان کی زمینوں سے بے دخل کیا جا رہا ہے۔ ماہرین خبردار کرتے ہیں کہ اگر یہ تباہی جاری رہی تو اس کے اثرات صرف جنوبی امریکہ کے لوگ ہی نہیں بلکہ زمین پر بسنے والا ہر شخص محسوس کرے گا۔","checklist":["کیا آپ نے ‘one in ten’ کا ترجمہ ‘ہر دس میں سے ایک’ کیا؟","کیا ‘global warming’ اور ‘indigenous tribes’ کے لیے درست اصطلاحات (عالمی حدت، مقامی قبائل) استعمال کیں؟","کیا ‘As a result’ اور ‘not only … but’ کا ترجمہ ‘نتیجتاً’ اور ‘نہ صرف … بلکہ’ سے کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"helen-keller","ur":"ہیلن کیلر","en":"Helen Keller","warmup":[{"en":"Helen could not see.","bank":["سکتی","دیکھ","ہیلن","تھیں","نہیں"],"answer":["ہیلن","دیکھ","نہیں","سکتی","تھیں"]},{"en":"Her teacher was very patient.","bank":["صابر","استانی","تھیں","ان کی","بہت"],"answer":["ان کی","استانی","بہت","صابر","تھیں"]},{"en":"She learned through touch.","bank":["سیکھا","لمس","انہوں نے","کے ذریعے"],"answer":["انہوں نے","لمس","کے ذریعے","سیکھا"]},{"en":"She wrote many books.","bank":["لکھیں","کتابیں","کئی","انہوں نے"],"answer":["انہوں نے","کئی","کتابیں","لکھیں"]},{"en":"Nothing is impossible.","bank":["ناممکن","ہے","کچھ","نہیں","بھی"],"answer":["کچھ","بھی","ناممکن","نہیں","ہے"]}],"passage":{"en":"Helen Keller was born in the United States in 1880. When she was a baby, a serious illness left her unable to see or hear. For several years she lived in a silent, dark world and could not communicate with anyone. Everything changed when a young teacher called Anne Sullivan came to live with her family. Anne spelled words into Helen's hand with her fingers, and one day, as cold water poured over Helen's other hand, she suddenly understood that the letters meant ‘water’. From that moment Helen was eager to learn the name of everything. She went on to learn Braille, to speak and to graduate from college. Later she travelled around the world, encouraging people to give disabled children the same chances as everyone else.","modelUr":"ہیلن کیلر 1880ء میں امریکہ میں پیدا ہوئیں۔ جب وہ ابھی بچی تھیں تو ایک سنگین بیماری کی وجہ سے وہ دیکھنے اور سننے کے قابل نہ رہیں۔ کئی سال تک وہ ایک خاموش اور اندھیری دنیا میں رہیں اور کسی سے بات چیت نہیں کر سکتی تھیں۔ سب کچھ اس وقت بدل گیا جب این سلیوان نامی ایک نوجوان استانی ان کے خاندان کے ساتھ رہنے آئیں۔ این انگلیوں سے ہیلن کے ہاتھ پر الفاظ کے ہجے کرتیں، اور ایک دن جب ہیلن کے دوسرے ہاتھ پر ٹھنڈا پانی بہہ رہا تھا تو انہیں اچانک سمجھ آ گیا کہ ان حروف کا مطلب ‘پانی’ ہے۔ اس لمحے سے ہیلن ہر چیز کا نام جاننے کے لیے بے تاب ہو گئیں۔ آگے چل کر انہوں نے بریل سیکھی، بولنا سیکھا اور کالج سے ڈگری حاصل کی۔ بعد میں انہوں نے دنیا بھر کا سفر کیا اور لوگوں کو ترغیب دی کہ وہ معذور بچوں کو بھی دوسروں جیسے مواقع دیں۔","checklist":["کیا ‘left her unable to see or hear’ کا مفہوم ‘دیکھنے اور سننے کے قابل نہ رہیں’ جیسی ساخت سے ادا ہوا؟","کیا ‘spelled words into Helen's hand’ کا ترجمہ فطری انداز میں ہوا؟","کیا آپ نے ہیلن کے لیے احتراماً جمع کا صیغہ (رہیں، سیکھی، کیا) مستقل استعمال کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"patras-bokhari","ur":"پطرس بخاری","en":"Patras Bokhari","warmup":[{"en":"Patras was a famous writer.","bank":["مصنف","تھے","پطرس","مشہور","ایک"],"answer":["پطرس","ایک","مشہور","مصنف","تھے"]},{"en":"His essays are very funny.","bank":["مزاحیہ","مضامین","ہیں","ان کے","بہت"],"answer":["ان کے","مضامین","بہت","مزاحیہ","ہیں"]},{"en":"He taught English at college.","bank":["پڑھائی","انگریزی","انہوں نے","میں","کالج"],"answer":["انہوں نے","کالج","میں","انگریزی","پڑھائی"]},{"en":"The old bicycle made a lot of noise.","bank":["شور","سائیکل","پرانی","تھی","بہت","کرتی"],"answer":["پرانی","سائیکل","بہت","شور","کرتی","تھی"]},{"en":"We laughed while reading.","bank":["ہنسے","پڑھتے ہوئے","ہم"],"answer":["ہم","پڑھتے ہوئے","ہنسے"]}],"passage":{"en":"Patras Bokhari is remembered as one of the greatest humorists in Urdu literature, even though he wrote surprisingly little. Born in Peshawar in 1898, he studied in Lahore and at Cambridge, and later taught English at Government College Lahore, where he eventually became principal. His only collection of humorous writing contains just a handful of essays, yet readers still laugh at them almost a century later. In one essay he describes an old bicycle that rattles, squeaks and groans so loudly that the whole street turns to look. What makes his humour special is that he usually laughs at himself rather than at others. Patras was also a talented broadcaster and diplomat, and after the creation of Pakistan he represented his country at the United Nations.","modelUr":"پطرس بخاری کو اردو ادب کے عظیم ترین مزاح نگاروں میں سے ایک کے طور پر یاد کیا جاتا ہے، حالانکہ انہوں نے حیرت انگیز حد تک کم لکھا۔ 1898ء میں پشاور میں پیدا ہونے والے پطرس نے لاہور اور کیمبرج میں تعلیم حاصل کی، اور بعد میں گورنمنٹ کالج لاہور میں انگریزی پڑھائی، جہاں آخرکار وہ پرنسپل بنے۔ ان کی مزاحیہ تحریروں کے واحد مجموعے میں صرف چند مضامین ہیں، پھر بھی تقریباً ایک صدی بعد بھی قارئین انہیں پڑھ کر ہنستے ہیں۔ ایک مضمون میں وہ ایک پرانی سائیکل کا حال بیان کرتے ہیں جو اتنی زور سے کھڑکھڑاتی، چوں چوں کرتی اور کراہتی ہے کہ پوری گلی مڑ کر دیکھنے لگتی ہے۔ ان کے مزاح کی خاص بات یہ ہے کہ وہ عموماً دوسروں کے بجائے اپنا ہی مذاق اڑاتے ہیں۔ پطرس ایک باصلاحیت براڈکاسٹر اور سفارت کار بھی تھے، اور قیامِ پاکستان کے بعد انہوں نے اقوامِ متحدہ میں اپنے ملک کی نمائندگی کی۔","checklist":["کیا آپ نے ‘even though’ اور ‘yet’ کا ترجمہ ‘حالانکہ’ اور ‘پھر بھی’ سے کیا؟","کیا ‘rattles, squeaks and groans’ کے لیے مناسب آوازوں والے الفاظ (کھڑکھڑانا، چوں چوں کرنا، کراہنا) چنے؟","کیا ‘rather than’ کا ترجمہ ‘کے بجائے’ ہوا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"earthquake-safety","ur":"زلزلے سے بچاؤ","en":"Earthquake Safety","warmup":[{"en":"Stay calm during an earthquake.","bank":["رہیں","زلزلے","پرسکون","کے دوران"],"answer":["زلزلے","کے دوران","پرسکون","رہیں"]},{"en":"Hide under a strong table.","bank":["چھپ جائیں","کے نیچے","میز","مضبوط"],"answer":["مضبوط","میز","کے نیچے","چھپ جائیں"]},{"en":"Do not use the lift.","bank":["استعمال","لفٹ","نہ","کریں"],"answer":["لفٹ","استعمال","نہ","کریں"]},{"en":"Keep an emergency bag ready.","bank":["رکھیں","بیگ","تیار","ہنگامی"],"answer":["ہنگامی","بیگ","تیار","رکھیں"]},{"en":"Many buildings fell in 2005.","bank":["گریں","عمارتیں","میں","2005ء","بہت سی"],"answer":["2005ء","میں","بہت سی","عمارتیں","گریں"]}],"passage":{"en":"Earthquakes cannot be predicted, but their damage can be reduced if people know what to do. Pakistan lies in an area where earthquakes are common, and the disaster of October 2005 showed how dangerous weak buildings can be. During an earthquake, the safest thing to do is to drop to the ground, take cover under a strong table and hold on until the shaking stops. People should stay away from windows and heavy furniture, and they should never use a lift. Once the tremors are over, everyone should leave the building calmly by the stairs and move to an open space, because smaller shocks often follow. Every family should keep an emergency bag with water, a torch, medicine and important documents, and schools should practise earthquake drills regularly.","modelUr":"زلزلوں کی پیش گوئی نہیں کی جا سکتی، لیکن اگر لوگ جانتے ہوں کہ کیا کرنا ہے تو ان سے ہونے والا نقصان کم کیا جا سکتا ہے۔ پاکستان ایسے علاقے میں واقع ہے جہاں زلزلے عام ہیں، اور اکتوبر 2005ء کی تباہی نے دکھا دیا کہ کمزور عمارتیں کتنی خطرناک ہو سکتی ہیں۔ زلزلے کے دوران سب سے محفوظ طریقہ یہ ہے کہ زمین پر جھک جائیں، کسی مضبوط میز کے نیچے پناہ لیں اور جھٹکے رکنے تک اسے تھامے رہیں۔ لوگوں کو کھڑکیوں اور بھاری فرنیچر سے دور رہنا چاہیے، اور لفٹ ہرگز استعمال نہیں کرنی چاہیے۔ جھٹکے ختم ہونے کے بعد سب کو سیڑھیوں کے ذریعے سکون سے عمارت سے نکل کر کسی کھلی جگہ پر چلے جانا چاہیے، کیونکہ اکثر چھوٹے جھٹکے بعد میں بھی آتے ہیں۔ ہر خاندان کو پانی، ٹارچ، دواؤں اور اہم کاغذات پر مشتمل ہنگامی بیگ رکھنا چاہیے، اور اسکولوں کو باقاعدگی سے زلزلے کی مشقیں کروانی چاہییں۔","checklist":["کیا آپ نے ‘cannot be predicted’ کا ترجمہ مجہول ساخت (پیش گوئی نہیں کی جا سکتی) سے کیا؟","کیا ‘drop, take cover and hold on’ کے تینوں مراحل درست ترتیب میں ترجمہ ہوئے؟","کیا ‘never use a lift’ میں ‘ہرگز’ جیسا تاکیدی لفظ استعمال کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"heatwave","ur":"گرمی کی لہر","en":"Heatwave","warmup":[{"en":"It is very hot today.","bank":["گرمی","ہے","آج","بہت"],"answer":["آج","بہت","گرمی","ہے"]},{"en":"Drink water every hour.","bank":["پئیں","گھنٹے","پانی","ہر"],"answer":["ہر","گھنٹے","پانی","پئیں"]},{"en":"Do not go out in the sun.","bank":["نکلیں","میں","نہ","دھوپ"],"answer":["دھوپ","میں","نہ","نکلیں"]},{"en":"Wear light cotton clothes.","bank":["پہنیں","کپڑے","سوتی","ہلکے"],"answer":["ہلکے","سوتی","کپڑے","پہنیں"]},{"en":"Trees keep the city cool.","bank":["رکھتے ہیں","ٹھنڈا","شہر کو","درخت"],"answer":["درخت","شہر کو","ٹھنڈا","رکھتے ہیں"]}],"passage":{"en":"Every summer, large parts of Pakistan suffer from heatwaves, and temperatures in some cities rise above 45 degrees. In June 2015, a severe heatwave in Karachi took hundreds of lives, most of them elderly people and labourers. Doctors say that the greatest danger in such weather is dehydration. People should drink water regularly, even if they do not feel thirsty, and they should avoid going out between noon and four o'clock. Light, loose cotton clothes help the body stay cool. If someone feels dizzy or stops sweating, they should be moved into the shade at once and given first aid. In the long run, planting trees and building parks can make our cities cooler and safer.","modelUr":"ہر سال گرمیوں میں پاکستان کے بڑے حصے گرمی کی لہروں کا شکار ہوتے ہیں، اور بعض شہروں میں درجۂ حرارت 45 ڈگری سے بھی اوپر چلا جاتا ہے۔ جون 2015ء میں کراچی میں گرمی کی ایک شدید لہر نے سینکڑوں جانیں لے لیں، جن میں زیادہ تر بزرگ اور مزدور تھے۔ ڈاکٹروں کا کہنا ہے کہ ایسے موسم میں سب سے بڑا خطرہ پانی کی کمی ہے۔ لوگوں کو باقاعدگی سے پانی پینا چاہیے، چاہے انہیں پیاس محسوس نہ ہو، اور دوپہر بارہ سے چار بجے تک باہر نکلنے سے پرہیز کرنا چاہیے۔ ہلکے اور ڈھیلے سوتی کپڑے جسم کو ٹھنڈا رکھنے میں مدد دیتے ہیں۔ اگر کسی کو چکر آئیں یا اس کا پسینہ رک جائے تو اسے فوراً سائے میں لے جانا چاہیے اور ابتدائی طبی امداد دینی چاہیے۔ طویل مدت میں درخت لگا کر اور پارک بنا کر ہم اپنے شہروں کو زیادہ ٹھنڈا اور محفوظ بنا سکتے ہیں۔","checklist":["کیا آپ نے ‘should’ کا ترجمہ ‘چاہیے’ سے کیا؟","کیا ‘even if they do not feel thirsty’ کے لیے ‘چاہے… نہ’ استعمال کیا؟","کیا ‘took hundreds of lives’ کا محاورہ دار ترجمہ (جانیں لے لیں) کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"road-safety","ur":"سڑک پر حفاظت","en":"Road Safety","warmup":[{"en":"Wear a helmet on a motorbike.","bank":["پہنیں","ہیلمٹ","پر","موٹر سائیکل"],"answer":["موٹر سائیکل","پر","ہیلمٹ","پہنیں"]},{"en":"Stop at the red light.","bank":["رکیں","پر","بتی","سرخ"],"answer":["سرخ","بتی","پر","رکیں"]},{"en":"Speeding is dangerous.","bank":["ہے","خطرناک","تیز رفتاری"],"answer":["تیز رفتاری","خطرناک","ہے"]},{"en":"Cross at the zebra crossing.","bank":["کریں","سڑک پار","سے","زیبرا کراسنگ"],"answer":["زیبرا کراسنگ","سے","سڑک پار","کریں"]},{"en":"He was fined.","bank":["گیا","کیا","جرمانہ","اسے"],"answer":["اسے","جرمانہ","کیا","گیا"]}],"passage":{"en":"Road accidents are one of the leading causes of death among young people in Pakistan. Most of these accidents are not caused by bad luck but by human mistakes such as speeding, using a mobile phone while driving and ignoring traffic signals. Many motorcyclists still ride without a helmet, although a helmet can reduce the risk of a serious head injury by more than half. If every driver fastened a seat belt and respected the speed limit, thousands of lives could be saved each year. The Motorway Police has shown that when laws are enforced fairly and strictly, people's behaviour on the road changes. Road safety should also be taught in schools, because good habits learnt in childhood last a lifetime.","modelUr":"سڑک کے حادثات پاکستان میں نوجوانوں کی اموات کی بڑی وجوہات میں سے ایک ہیں۔ ان میں سے زیادہ تر حادثات بدقسمتی سے نہیں بلکہ انسانی غلطیوں سے ہوتے ہیں، جیسے تیز رفتاری، ڈرائیونگ کے دوران موبائل فون کا استعمال اور ٹریفک اشاروں کو نظر انداز کرنا۔ بہت سے موٹر سائیکل سوار اب بھی ہیلمٹ کے بغیر سفر کرتے ہیں، حالانکہ ہیلمٹ سر کی شدید چوٹ کا خطرہ آدھے سے بھی زیادہ کم کر سکتا ہے۔ اگر ہر ڈرائیور سیٹ بیلٹ باندھے اور رفتار کی حد کا احترام کرے تو ہر سال ہزاروں جانیں بچائی جا سکتی ہیں۔ موٹروے پولیس نے ثابت کیا ہے کہ جب قوانین منصفانہ اور سختی سے نافذ کیے جائیں تو سڑک پر لوگوں کا رویہ بدل جاتا ہے۔ اسکولوں میں بھی روڈ سیفٹی کی تعلیم دی جانی چاہیے، کیونکہ بچپن میں سیکھی ہوئی اچھی عادتیں عمر بھر ساتھ رہتی ہیں۔","checklist":["کیا آپ نے ‘not … but …’ کا ترجمہ ‘نہیں بلکہ’ سے کیا؟","کیا ‘although’ کے لیے ‘حالانکہ’ استعمال کیا؟","کیا شرطیہ جملہ ‘If every driver…’ ‘اگر… تو’ کی ساخت میں ترجمہ ہوا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"solar-energy","ur":"شمسی توانائی","en":"Solar Energy","warmup":[{"en":"The sun gives us energy.","bank":["دیتا ہے","توانائی","ہمیں","سورج"],"answer":["سورج","ہمیں","توانائی","دیتا ہے"]},{"en":"Solar power is clean.","bank":["ہے","صاف","بجلی","شمسی"],"answer":["شمسی","بجلی","صاف","ہے"]},{"en":"Our bill is lower now.","bank":["ہے","کم","اب","ہمارا بل"],"answer":["ہمارا بل","اب","کم","ہے"]},{"en":"Clean the panels regularly.","bank":["کریں","صاف","باقاعدگی سے","پینل"],"answer":["پینل","باقاعدگی سے","صاف","کریں"]},{"en":"Solar is cheaper than diesel.","bank":["ہے","سستا","سے","ڈیزل","سولر"],"answer":["سولر","ڈیزل","سے","سستا","ہے"]}],"passage":{"en":"Pakistan receives strong sunshine for most of the year, which makes it an ideal country for solar energy. In recent years, the price of solar panels has fallen sharply, and many families have installed them on their roofs to reduce their electricity bills and escape load-shedding. Farmers are also using solar tube wells instead of diesel pumps, which saves them a great deal of money. Unlike coal and oil, the sun does not produce smoke or harmful gases, so solar energy helps to protect the environment. However, a complete system with batteries is still too expensive for many poor households. If the government offered easy loans, even more people could benefit from this clean and free source of power.","modelUr":"پاکستان میں سال کے بیشتر حصے میں تیز دھوپ رہتی ہے، جو اسے شمسی توانائی کے لیے ایک مثالی ملک بناتی ہے۔ حالیہ برسوں میں سولر پینلز کی قیمت میں تیزی سے کمی آئی ہے، اور بہت سے خاندانوں نے بجلی کے بل کم کرنے اور لوڈ شیڈنگ سے بچنے کے لیے انہیں اپنی چھتوں پر لگوا لیا ہے۔ کسان بھی ڈیزل پمپوں کے بجائے شمسی ٹیوب ویل استعمال کر رہے ہیں، جس سے ان کی کافی رقم بچ جاتی ہے۔ کوئلے اور تیل کے برعکس سورج سے دھواں یا نقصان دہ گیسیں پیدا نہیں ہوتیں، اس لیے شمسی توانائی ماحول کے تحفظ میں مدد دیتی ہے۔ تاہم بیٹریوں سمیت مکمل نظام اب بھی بہت سے غریب گھرانوں کے لیے بہت مہنگا ہے۔ اگر حکومت آسان قرضے فراہم کرے تو اس صاف اور مفت ذریعۂ توانائی سے اور بھی زیادہ لوگ فائدہ اٹھا سکتے ہیں۔","checklist":["کیا آپ نے ‘unlike coal and oil’ کا ترجمہ ‘کے برعکس’ سے کیا؟","کیا ‘instead of’ کے لیے ‘کے بجائے’ استعمال کیا؟","کیا ‘However’ کا ترجمہ ‘تاہم’ سے کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"olympic-games","ur":"اولمپک کھیل","en":"The Olympic Games","warmup":[{"en":"She won a gold medal.","bank":["جیتا","سونے کا تمغہ","نے","اس"],"answer":["اس","نے","سونے کا تمغہ","جیتا"]},{"en":"The Olympics began in 1896.","bank":["شروع ہوئے","میں","اولمپکس","1896ء"],"answer":["اولمپکس","1896ء","میں","شروع ہوئے"]},{"en":"The players ran fast.","bank":["دوڑے","تیز","کھلاڑی"],"answer":["کھلاڑی","تیز","دوڑے"]},{"en":"He set a new record.","bank":["قائم کیا","ریکارڈ","نیا","نے","اس"],"answer":["اس","نے","نیا","ریکارڈ","قائم کیا"]},{"en":"The flag was raised.","bank":["گیا","لہرایا","پرچم"],"answer":["پرچم","لہرایا","گیا"]}],"passage":{"en":"The Olympic Games bring together athletes from more than two hundred countries every four years. The modern Games began in Athens in 1896, inspired by the ancient festival held at Olympia in Greece. The five interlocking rings on the Olympic flag stand for the friendship of the world's continents. Pakistan has a proud Olympic history, especially in hockey, in which it won three gold medals. In 2024, Arshad Nadeem, a young man from a small village in Punjab, won the javelin gold in Paris with an Olympic record throw. His success showed that talent can come from anywhere, and that hard work and determination matter more than wealth or facilities.","modelUr":"اولمپک کھیل ہر چار سال بعد دو سو سے زیادہ ملکوں کے کھلاڑیوں کو اکٹھا کرتے ہیں۔ جدید کھیلوں کا آغاز 1896ء میں ایتھنز میں ہوا، جو یونان کے مقام اولمپیا میں منعقد ہونے والے قدیم میلے سے متاثر تھے۔ اولمپک پرچم پر ایک دوسرے میں پیوست پانچ دائرے دنیا کے براعظموں کی دوستی کی نمائندگی کرتے ہیں۔ پاکستان کی اولمپک تاریخ قابلِ فخر ہے، خاص طور پر ہاکی میں، جس میں اس نے سونے کے تین تمغے جیتے۔ 2024ء میں پنجاب کے ایک چھوٹے سے گاؤں کے نوجوان ارشد ندیم نے پیرس میں اولمپک ریکارڈ تھرو کے ساتھ نیزہ بازی کا طلائی تمغہ جیتا۔ ان کی کامیابی نے ثابت کیا کہ ہنر کہیں سے بھی ابھر سکتا ہے، اور محنت اور عزم دولت یا سہولتوں سے زیادہ اہم ہیں۔","checklist":["کیا آپ نے ماضی کے جملوں میں ‘نے’ اور فعل کی مطابقت درست رکھی (اس نے… تمغے جیتے)؟","کیا ‘stand for’ کا ترجمہ ‘نمائندگی کرتے ہیں / علامت ہیں’ سے کیا؟","کیا ‘matter more than’ کا ترجمہ ‘سے زیادہ اہم ہیں’ کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"truck-art","ur":"ٹرک آرٹ","en":"Truck Art","warmup":[{"en":"The truck is very colourful.","bank":["ہے","رنگین","بہت","ٹرک"],"answer":["ٹرک","بہت","رنگین","ہے"]},{"en":"A peacock is painted on it.","bank":["بنا ہے","مور","اس پر"],"answer":["اس پر","مور","بنا ہے"]},{"en":"The craftsman is skilful.","bank":["ہے","ہنرمند","کاریگر"],"answer":["کاریگر","ہنرمند","ہے"]},{"en":"We went to the exhibition.","bank":["گئے","نمائش","ہم","میں"],"answer":["ہم","نمائش","میں","گئے"]},{"en":"These pictures are beautiful.","bank":["ہیں","خوبصورت","تصویریں","یہ"],"answer":["یہ","تصویریں","خوبصورت","ہیں"]}],"passage":{"en":"Anyone who travels on the highways of Pakistan is sure to notice the brightly decorated trucks. Every surface is covered with paintings of peacocks, flowers, mountains and famous faces, and the back often carries a witty line of poetry. For the drivers, who spend weeks away from home, the truck is a second home, so they spend a great deal of money to make it beautiful. Decorating a single truck can take several weeks and involves carpenters, metalworkers and painters. In recent years, Pakistani truck art has been displayed in museums abroad, and its designs now appear on clothes and furniture. Sadly, many young people no longer wish to learn this skill, so the craft needs our support to survive.","modelUr":"جو بھی پاکستان کی شاہراہوں پر سفر کرتا ہے، وہ چمکدار انداز میں سجے ہوئے ٹرکوں کو ضرور دیکھتا ہے۔ ان کا ہر حصہ موروں، پھولوں، پہاڑوں اور مشہور چہروں کی تصویروں سے ڈھکا ہوتا ہے، اور پیچھے اکثر کوئی دلچسپ شعر لکھا ہوتا ہے۔ ڈرائیوروں کے لیے، جو ہفتوں گھر سے دور رہتے ہیں، ٹرک دوسرا گھر ہے، اس لیے وہ اسے خوبصورت بنانے پر کافی رقم خرچ کرتے ہیں۔ ایک ٹرک کو سجانے میں کئی ہفتے لگ سکتے ہیں اور اس میں بڑھئی، دھات کا کام کرنے والے اور مصور سب شامل ہوتے ہیں۔ حالیہ برسوں میں پاکستانی ٹرک آرٹ کی بیرونِ ملک عجائب گھروں میں نمائش ہو چکی ہے، اور اب اس کے نقش و نگار کپڑوں اور فرنیچر پر بھی نظر آتے ہیں۔ افسوس کہ بہت سے نوجوان اب یہ ہنر سیکھنا نہیں چاہتے، اس لیے اس فن کو زندہ رہنے کے لیے ہماری مدد کی ضرورت ہے۔","checklist":["کیا آپ نے ‘Anyone who…’ کا ترجمہ ‘جو بھی… وہ…’ کی ساخت سے کیا؟","کیا صفات (سجے ہوئے ٹرک، دلچسپ شعر) کی مطابقت درست ہے؟","کیا ‘has been displayed’ کا ترجمہ ‘نمائش ہو چکی ہے’ کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"scouting","ur":"اسکاؤٹنگ","en":"Scouting","warmup":[{"en":"We pitched a tent.","bank":["لگایا","خیمہ","نے","ہم"],"answer":["ہم","نے","خیمہ","لگایا"]},{"en":"Scouts help others.","bank":["کرتے ہیں","مدد","دوسروں کی","اسکاؤٹ"],"answer":["اسکاؤٹ","دوسروں کی","مدد","کرتے ہیں"]},{"en":"Bring a warm jacket.","bank":["لائیں","جیکٹ","گرم"],"answer":["گرم","جیکٹ","لائیں"]},{"en":"Phones are not allowed.","bank":["نہیں","اجازت","فون کی","ہے"],"answer":["فون کی","اجازت","نہیں","ہے"]},{"en":"Always be prepared.","bank":["رہو","تیار","ہمیشہ"],"answer":["ہمیشہ","تیار","رہو"]}],"passage":{"en":"Scouting began in 1907, when Robert Baden-Powell took a group of boys camping on a small island in England. He believed that young people learn best by doing things for themselves in the open air. Today there are tens of millions of scouts around the world. At camp, scouts learn to pitch tents, cook their own food, read maps and give first aid, but the most important lessons are teamwork, discipline and service to others. The scout motto, ‘Be Prepared’, reminds them to be ready to help at any moment. In Pakistan, scouts have worked as volunteers during earthquakes and floods, carrying supplies and caring for families who lost their homes.","modelUr":"اسکاؤٹنگ کا آغاز 1907ء میں ہوا، جب رابرٹ بیڈن پاول لڑکوں کے ایک گروہ کو انگلینڈ کے ایک چھوٹے سے جزیرے پر کیمپ کے لیے لے گئے۔ ان کا خیال تھا کہ نوجوان کھلی فضا میں اپنے کام خود کر کے سب سے بہتر سیکھتے ہیں۔ آج دنیا بھر میں کروڑوں اسکاؤٹ موجود ہیں۔ کیمپ میں اسکاؤٹ خیمے لگانا، اپنا کھانا خود پکانا، نقشے پڑھنا اور ابتدائی طبی امداد دینا سیکھتے ہیں، لیکن سب سے اہم سبق ٹیم ورک، نظم و ضبط اور دوسروں کی خدمت ہیں۔ اسکاؤٹ کا نعرہ ‘تیار رہو’ انہیں یاد دلاتا ہے کہ وہ ہر لمحے مدد کے لیے تیار رہیں۔ پاکستان میں اسکاؤٹس نے زلزلوں اور سیلابوں کے دوران رضاکاروں کے طور پر کام کیا ہے، امدادی سامان پہنچایا ہے اور ان خاندانوں کی دیکھ بھال کی ہے جن کے گھر تباہ ہو گئے تھے۔","checklist":["کیا آپ نے ‘tens of millions’ کا ترجمہ ‘کروڑوں’ سے کیا؟","کیا ‘learn best by doing things for themselves’ کا مفہوم درست ادا ہوا؟","کیا ‘families who lost their homes’ کے لیے ‘جن کے… ’ والی ساخت استعمال کی؟","کیا ترجمہ رواں اور مکمل ہے؟"]}},{"id":"success-failure","ur":"کامیابی اور ناکامی","en":"Success and Failure","warmup":[{"en":"Hard work is never wasted.","bank":["جاتی","ضائع نہیں","کبھی","محنت"],"answer":["محنت","کبھی","ضائع نہیں","جاتی"]},{"en":"Don't be afraid of failure.","bank":["ڈریں","سے","نہ","ناکامی"],"answer":["ناکامی","سے","نہ","ڈریں"]},{"en":"Learn from mistakes.","bank":["سیکھیں","سے","غلطیوں"],"answer":["غلطیوں","سے","سیکھیں"]},{"en":"Despite the rain, we played.","bank":["کھیلے","ہم","کے باوجود","بارش"],"answer":["بارش","کے باوجود","ہم","کھیلے"]},{"en":"Keep your goal clear.","bank":["رکھیں","واضح","مقصد","اپنا"],"answer":["اپنا","مقصد","واضح","رکھیں"]}],"passage":{"en":"Nobody likes to fail, but failure is a part of every successful life. Many famous scientists, writers and sportsmen faced rejection again and again before they achieved their goals. What made them different was not luck but their refusal to give up. When we fail, we discover our weaknesses, and that knowledge helps us to do better next time. Although it is natural to feel disappointed, we should not let one bad result decide our future. Instead, we should look calmly at what went wrong, ask for help when we need it and make a new plan. Parents and teachers can help by praising effort rather than only results, so that young people are not afraid to try.","modelUr":"کوئی بھی ناکام ہونا پسند نہیں کرتا، لیکن ناکامی ہر کامیاب زندگی کا حصہ ہے۔ بہت سے مشہور سائنس دانوں، ادیبوں اور کھلاڑیوں کو اپنے مقاصد حاصل کرنے سے پہلے بار بار رد کیا گیا۔ جس چیز نے انہیں دوسروں سے مختلف بنایا وہ قسمت نہیں بلکہ ان کا ہار نہ ماننا تھا۔ جب ہم ناکام ہوتے ہیں تو ہمیں اپنی کمزوریوں کا پتا چلتا ہے، اور یہی علم اگلی بار بہتر کارکردگی دکھانے میں ہماری مدد کرتا ہے۔ اگرچہ مایوس ہونا فطری بات ہے، لیکن ہمیں ایک برے نتیجے کو اپنے مستقبل کا فیصلہ نہیں کرنے دینا چاہیے۔ اس کے بجائے ہمیں ٹھنڈے دل سے دیکھنا چاہیے کہ کہاں غلطی ہوئی، ضرورت ہو تو مدد مانگنی چاہیے اور نیا منصوبہ بنانا چاہیے۔ والدین اور اساتذہ صرف نتائج کے بجائے کوشش کی تعریف کر کے مدد کر سکتے ہیں، تاکہ نوجوان کوشش کرنے سے نہ ڈریں۔","checklist":["کیا آپ نے ‘Although…’ کا ترجمہ ‘اگرچہ… لیکن’ سے کیا؟","کیا ‘not luck but…’ کا ترجمہ ‘قسمت نہیں بلکہ…’ کیا؟","کیا ‘rather than’ کے لیے ‘کے بجائے’ استعمال کیا؟","کیا ترجمہ رواں اور مکمل ہے؟"]}}];
const SUMMARY_WRITING = [{"id":"reading-habit","ur":"مطالعے کی عادت","en":"The Habit of Reading","passage":"کتابیں پڑھنا انسان کی زندگی میں بہت اہمیت رکھتا ہے۔ یہ نہ صرف علم میں اضافہ کرتی ہیں بلکہ ذہن کو بھی تیز بناتی ہیں۔ جو لوگ باقاعدگی سے کتابیں پڑھتے ہیں، ان کی سوچنے سمجھنے کی صلاحیت دوسروں سے بہتر ہوتی ہے۔ کتابیں پڑھنے سے الفاظ کا ذخیرہ بڑھتا ہے اور زبان پر عبور حاصل ہوتا ہے، جو تحریر اور گفتگو دونوں میں مددگار ثابت ہوتا ہے۔\n\nاس کے علاوہ، کتابیں پڑھنے سے تخیل کو نئی جہتیں ملتی ہیں۔ ناول اور کہانیاں پڑھنے والے لوگ نئے حالات اور کرداروں کے بارے میں سوچنے کے قابل ہو جاتے ہیں، جس سے ان کی تخلیقی صلاحیت میں اضافہ ہوتا ہے۔ سائنسی اور تاریخی کتابیں پڑھنے سے دنیا کے بارے میں معلومات میں اضافہ ہوتا ہے اور مختلف ثقافتوں کو سمجھنے میں مدد ملتی ہے۔\n\nمطالعہ ذہنی دباؤ کو کم کرنے کا ایک بہترین ذریعہ بھی ہے۔ جب انسان کسی کہانی میں کھو جاتا ہے تو وہ روزمرہ کے مسائل کو کچھ دیر کے لیے بھول جاتا ہے، جس سے ذہنی سکون ملتا ہے۔ اسکولوں اور گھروں میں بچوں کو کتابیں پڑھنے کی عادت ڈالنی چاہیے تاکہ وہ مستقبل میں ایک کامیاب اور باشعور شہری بن سکیں۔ افسوس کی بات ہے کہ آج کل موبائل فون اور انٹرنیٹ کی وجہ سے کتابیں پڑھنے کا رجحان کم ہوتا جا رہا ہے، جس پر توجہ دینے کی ضرورت ہے۔","modelSummary":"کتابیں پڑھنے سے علم اور الفاظ کا ذخیرہ بڑھتا ہے اور سوچنے کی صلاحیت بہتر ہوتی ہے۔ ناول اور کہانیاں تخیل اور تخلیقی صلاحیت میں اضافہ کرتی ہیں، جبکہ سائنسی و تاریخی کتابیں دنیا اور مختلف ثقافتوں کو سمجھنے میں مدد دیتی ہیں۔ مطالعہ ذہنی دباؤ کم کرنے کا بھی ذریعہ ہے۔ بچوں میں یہ عادت ڈالنی چاہیے، مگر موبائل اور انٹرنیٹ کی وجہ سے یہ رجحان کم ہو رہا ہے۔","checklist":["کیا آپ کا خلاصہ 100 الفاظ سے کم ہے؟","کیا آپ نے کتابیں پڑھنے کے کم از کم تین فوائد شامل کیے؟","کیا آپ نے اپنے الفاظ استعمال کیے، پیراگراف سے جملے نقل نہیں کیے؟","کیا آپ کا خلاصہ صرف اہم نکات پر مشتمل ہے، غیر ضروری تفصیل شامل نہیں؟"]},{"id":"water-conservation","ur":"پانی کا تحفظ","en":"Water Conservation","passage":"پانی زندگی کے لیے سب سے بنیادی ضرورت ہے، لیکن دنیا بھر میں صاف پانی کی مقدار مسلسل کم ہوتی جا رہی ہے۔ آبادی میں اضافے، صنعتی تر
